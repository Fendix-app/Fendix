# Fendix Security Scan — GitLab CI include file.
#
# Generated by `fendix init --ci gitlab`. The default emit path is
# .gitlab-ci.fendix.yml so it doesn't collide with your main
# .gitlab-ci.yml. Add the following line to your main .gitlab-ci.yml
# to wire it in:
#
#   include:
#     - local: .gitlab-ci.fendix.yml
#
# What it does:
#   - Runs on every merge request commit AND on every push to the
#     default branch.
#   - Installs the pinned FENDIX_VERSION below with the official
#     installer, fetched at a pinned commit. The installer verifies the
#     release's SHA-256 checksum and requires a valid cosign signature.
#   - Produces a GitLab-SAST-compatible JSON report uploaded as the
#     job's `sast` report and as a 30-day artifact.
#   - Gates the pipeline on HIGH+ findings via fendix's --fail-on.
#
# Required permissions: none beyond the project default (Maintainer
# already has these). If your scan target is a private container
# registry, plumb the credential via a masked CI variable.

variables:
  # The Fendix release this job installs. `fendix init` pins the release
  # that generated this file. To upgrade, change it to a newer tag from
  # https://github.com/Fendix-app/Fendix/releases. Never use "latest":
  # a pinned tag keeps every pipeline on the same verified binary.
  FENDIX_VERSION: "@@FENDIX_VERSION@@"
  # The commit whose scripts/install.sh installs Fendix: the commit the
  # release above was built from. A commit, unlike a tag, cannot be
  # changed to serve a different script. The installer works for any
  # release, so upgrading FENDIX_VERSION does not require changing it.
  FENDIX_INSTALLER_COMMIT: "@@FENDIX_INSTALLER_COMMIT@@"
  # Optional: the SHA-256 of fendix-<FENDIX_VERSION>-linux-amd64, from the
  # release's .sha256 file. When set, the installer refuses any other
  # binary, even one the release repository later serves and signs.
  FENDIX_SHA256: ""

fendix-security-scan:
  stage: test
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    # cosign lets the installer verify the release signature as well as
    # its checksum. FENDIX_REQUIRE_SIGNATURE=1 makes a missing cosign or a
    # release without a signature abort the install instead of falling
    # back to the checksum alone.
    - apk add --no-cache curl ca-certificates cosign
    - |
      case "$FENDIX_VERSION" in
        v[0-9]*) ;;
        *) echo "FENDIX_VERSION must be a Fendix release tag such as vX.Y.Z, not '$FENDIX_VERSION'" >&2; exit 1 ;;
      esac
      printf '%s' "$FENDIX_INSTALLER_COMMIT" | grep -Eqx '[0-9a-f]{40}' || {
        echo "FENDIX_INSTALLER_COMMIT must be the full commit of a Fendix release tag, not '$FENDIX_INSTALLER_COMMIT'" >&2
        exit 1
      }
    - >
      curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/fendix-install.sh
      "https://raw.githubusercontent.com/Fendix-app/Fendix/${FENDIX_INSTALLER_COMMIT}/scripts/install.sh"
    - FENDIX_DIR=/usr/local/bin FENDIX_REQUIRE_SIGNATURE=1 sh /tmp/fendix-install.sh
    - fendix version | grep -F "fendix version ${FENDIX_VERSION} "
  script:
    - >
      fendix scan
      --code .
      --format sarif
      --output gl-sast-report.json
      --fail-on HIGH
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 30 days
  allow_failure: false
