# Fendix — reference GitHub Actions workflow.
#
# Generated by `fendix init` as `.github/workflows/fendix.yml`. It
# scans your repo (and optional OpenAPI spec) on every PR and on push to
# main, uploads SARIF to the GitHub Security tab, posts a summary comment
# on the PR, and gates the merge on findings at or above HIGH severity.
#
# What it does on each event:
#
#   - pull_request: scans against the baseline saved by the most recent
#     main run, posts a PR comment summarising findings (top 5 + counts),
#     uploads SARIF for inline annotations, and fails the build when
#     --fail-on triggers.
#
#   - push to main: scans, refreshes the baseline cache, uploads SARIF.
#     PRs that merge after this run will compare against the new baseline
#     so accepted-on-main findings stop showing up as PR diffs.
#
# Baseline storage: actions/cache (first-party). The cache is keyed by
# run_id with a fallback restore-key, so any new run reads the most
# recently saved baseline. PRs read; main writes (cache writes are
# automatic on success).
#
# Required permissions:
#   contents:        read     — checkout
#   security-events: write    — SARIF upload via github/codeql-action
#   pull-requests:   write    — PR comment via actions/github-script
#
# Required repository secrets: none to install Fendix.
# If your project's spec or staging URL needs auth, plumb a secret
# through the `--auth` flag (see the Live API Scan section in
# docs/ci-cd-integration.md).

name: Fendix Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  # The Fendix release this workflow installs. `fendix init` pins the
  # release that generated this file. To upgrade, change it to a newer
  # tag from https://github.com/Fendix-app/Fendix/releases. Never use
  # "latest": a pinned tag keeps every run on the same verified binary.
  FENDIX_VERSION: "@@FENDIX_VERSION@@"
  # The commit whose scripts/install.sh installs Fendix: the commit the
  # release above was built from. A commit, unlike a tag, cannot be
  # changed to serve a different script. The installer works for any
  # release, so upgrading FENDIX_VERSION does not require changing it.
  FENDIX_INSTALLER_COMMIT: "@@FENDIX_INSTALLER_COMMIT@@"
  # Optional: the SHA-256 of fendix-<FENDIX_VERSION>-linux-amd64, from
  # the release's .sha256 file. When set, the installer refuses any other
  # binary, even one the release repository later serves and signs.
  FENDIX_SHA256: ""

jobs:
  fendix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go and Python are not needed to install Fendix. They serve the
      # scan's language analyzers (govulncheck, for one, loads Go modules
      # through the go command).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # cosign lets the official installer verify the release's Sigstore
      # signature, bound to Fendix's release workflow, on top of its
      # SHA-256 checksum.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Install the pinned release with the official installer, fetched at
      # FENDIX_INSTALLER_COMMIT. The installer owns download, checksum and
      # signature verification; FENDIX_REQUIRE_SIGNATURE=1 makes a missing
      # cosign or a release without a signature abort the install instead
      # of falling back to the checksum alone.
      - name: Install Fendix
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          case "$FENDIX_VERSION" in
            v[0-9]*) ;;
            *) fail "FENDIX_VERSION must be a Fendix release tag such as vX.Y.Z, not '$FENDIX_VERSION'" ;;
          esac
          printf '%s' "$FENDIX_INSTALLER_COMMIT" | grep -Eqx '[0-9a-f]{40}' ||
            fail "FENDIX_INSTALLER_COMMIT must be the full commit of a Fendix release tag, not '$FENDIX_INSTALLER_COMMIT'"
          bin_dir="$RUNNER_TEMP/fendix/bin"
          mkdir -p "$bin_dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/fendix/install.sh" \
            "https://raw.githubusercontent.com/Fendix-app/Fendix/${FENDIX_INSTALLER_COMMIT}/scripts/install.sh"
          PATH="$bin_dir:$PATH" FENDIX_DIR="$bin_dir" FENDIX_REQUIRE_SIGNATURE=1 sh "$RUNNER_TEMP/fendix/install.sh"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/fendix" version | grep -F "fendix version ${FENDIX_VERSION} "

      # Restore the most-recent baseline produced by main. On the first
      # run (no cache yet) the scan runs without a baseline, which is
      # the correct behaviour — every finding is "new".
      - name: Restore Fendix baseline
        id: baseline
        uses: actions/cache@v4
        with:
          path: .fendix/baseline.json
          key: fendix-baseline-${{ github.run_id }}
          restore-keys: |
            fendix-baseline-

      - name: Run Fendix scan
        id: scan
        run: |
          mkdir -p .fendix
          baseline_flag=""
          if [ -f .fendix/baseline.json ]; then
            echo "Using baseline from previous run."
            baseline_flag="--baseline .fendix/baseline.json"
          fi
          # `set +e` so we capture the exit code without aborting the
          # job — we still want to upload SARIF + post the PR comment
          # even when --fail-on triggers.
          set +e
          fendix scan \
            --code ./ \
            --format json \
            --output findings.json \
            --save-baseline .fendix/baseline.json \
            $baseline_flag \
            --fail-on HIGH
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Re-render the JSON report into SARIF for GitHub Code Scanning.
      # Re-rendering (rather than running fendix twice) guarantees the
      # SARIF and PR comment describe the exact same findings.
      - name: Convert findings to SARIF
        if: always() && hashFiles('findings.json') != ''
        run: |
          fendix report \
            --input findings.json \
            --format sarif \
            --output results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: fendix

      # PR summary comment. Posts at most one new comment per push to
      # the PR — the GitHub UI threads them by timestamp. If you'd
      # rather edit a single sticky comment, see the "Sticky comment"
      # snippet in docs/ci-cd-integration.md.
      - name: Post PR summary comment
        if: github.event_name == 'pull_request' && always() && hashFiles('findings.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const summary = report.summary || {};
            const sources = report.sources || {};
            const total = report.total ?? (report.findings || []).length;

            const lines = [
              `## Fendix scan: ${total} finding${total === 1 ? '' : 's'}`,
              '',
              `Mode: \`${(report.metadata || {}).mode || 'unknown'}\` · ` +
                `Endpoints scanned: ${(report.metadata || {}).endpoints_scanned ?? 0} · ` +
                `Duration: ${(report.metadata || {}).duration || 'n/a'}`,
              '',
              '| Severity | Count | Source | Count |',
              '|---|---|---|---|',
              `| Critical | ${summary.critical || 0} | Blackbox | ${sources.blackbox || 0} |`,
              `| High | ${summary.high || 0} | Whitebox | ${sources.whitebox || 0} |`,
              `| Medium | ${summary.medium || 0} | Correlated | ${sources.correlated || 0} |`,
              `| Low | ${summary.low || 0} | _Total_ | **${total}** |`,
              `| Info | ${summary.info || 0} | | |`,
              '',
            ];

            if (total === 0) {
              lines.push('_No new findings vs. baseline. ✅_');
            } else {
              const top = (report.findings || []).slice(0, 5).map(f => {
                const where = f.endpoint || f.line || '';
                return `- **[${f.severity}]** ${f.title} — \`${where}\``;
              });
              lines.push('### Top findings', ...top);
              if (total > 5) lines.push('', `_…and ${total - 5} more in the SARIF report._`);
            }

            lines.push(
              '',
              '<sub>Open the **Security** tab for inline annotations. ' +
                'Re-run this workflow to refresh.</sub>'
            );

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });

      # Surface the scan exit code as the job result. We deferred
      # failure until after SARIF upload + comment so that the
      # PR author sees full output even when the gate fails.
      - name: Enforce --fail-on gate
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "fendix scan exited ${{ steps.scan.outputs.exit_code }} (1=findings at gate, 2=scan error)"
          exit ${{ steps.scan.outputs.exit_code }}
