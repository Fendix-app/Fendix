# Fendix Security Scan — CircleCI config snippet.
#
# Generated by `fendix init --ci circleci`. The default emit path is
# .circleci/fendix-config.yml. CircleCI does NOT merge multiple
# config files automatically; you must merge this snippet into your
# .circleci/config.yml manually. See NEXT-STEPS-fendix.md (also
# emitted by `fendix init --ci circleci`) for the merge recipe.
#
# What it does:
#   - One job, `fendix-scan`, on the security workflow.
#   - Installs a pinned, checksum-verified cosign, then the pinned
#     FENDIX_VERSION below with the official installer, fetched at a
#     pinned commit. The installer verifies the release's SHA-256 checksum
#     and requires a valid cosign signature: a missing cosign or a release
#     without a signature fails the job.
#   - Produces a SARIF report uploaded as a 30-day artifact.
#   - Gates the workflow on HIGH+ findings via fendix's --fail-on.

version: 2.1

jobs:
  fendix-scan:
    docker:
      - image: cimg/base:current
    environment:
      # The Fendix release this job installs. `fendix init` pins the
      # release that generated this file. To upgrade, change it to a newer
      # tag from https://github.com/Fendix-app/Fendix/releases. Never use
      # "latest": a pinned tag keeps every run on the same verified binary.
      FENDIX_VERSION: "@@FENDIX_VERSION@@"
      # The commit whose scripts/install.sh installs Fendix: the commit the
      # release above was built from. A commit, unlike a tag, cannot be
      # changed to serve a different script. The installer works for any
      # release, so upgrading FENDIX_VERSION does not require changing it.
      FENDIX_INSTALLER_COMMIT: "@@FENDIX_INSTALLER_COMMIT@@"
      # Optional: the SHA-256 of fendix-<FENDIX_VERSION>-linux-amd64, from
      # the release's .sha256 file. When set, the installer refuses any
      # other binary, even one the release repository later serves and
      # signs.
      FENDIX_SHA256: ""
      # cosign, which the installer needs to verify the release signature.
      # cimg/base does not ship it, so this job downloads this release and
      # checks it against these SHA-256 values, taken from cosign's own
      # cosign_checksums.txt (signed by Sigstore), before running it. To
      # upgrade cosign, change all three together.
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256_LINUX_AMD64: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      COSIGN_SHA256_LINUX_ARM64: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
    steps:
      - checkout
      - run:
          name: Install cosign
          command: |
            set -euo pipefail
            case "$(uname -m)" in
              x86_64) arch=amd64; sha="$COSIGN_SHA256_LINUX_AMD64" ;;
              aarch64 | arm64) arch=arm64; sha="$COSIGN_SHA256_LINUX_ARM64" ;;
              *) echo "no pinned cosign for $(uname -m)" >&2; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/cosign \
              "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-${arch}"
            echo "${sha}  /tmp/cosign" | sha256sum -c -
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
            rm -f /tmp/cosign
            cosign version
      # FENDIX_REQUIRE_SIGNATURE=1 makes a missing cosign or a release
      # without a signature abort the install instead of falling back to
      # the checksum alone.
      - run:
          name: Install Fendix
          command: |
            set -euo pipefail
            case "$FENDIX_VERSION" in
              v[0-9]*) ;;
              *) echo "FENDIX_VERSION must be a Fendix release tag such as vX.Y.Z, not '$FENDIX_VERSION'" >&2; exit 1 ;;
            esac
            printf '%s' "$FENDIX_INSTALLER_COMMIT" | grep -Eqx '[0-9a-f]{40}' || {
              echo "FENDIX_INSTALLER_COMMIT must be the full commit of a Fendix release tag, not '$FENDIX_INSTALLER_COMMIT'" >&2
              exit 1
            }
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/fendix-install.sh \
              "https://raw.githubusercontent.com/Fendix-app/Fendix/${FENDIX_INSTALLER_COMMIT}/scripts/install.sh"
            FENDIX_DIR=/usr/local/bin FENDIX_REQUIRE_SIGNATURE=1 sh /tmp/fendix-install.sh
            fendix version | grep -F "fendix version ${FENDIX_VERSION} "
      - run:
          name: Run Fendix scan
          command: |
            fendix scan \
              --code . \
              --format sarif \
              --output fendix-report.sarif \
              --fail-on HIGH
      - store_artifacts:
          path: fendix-report.sarif
          destination: fendix-report.sarif

workflows:
  security:
    jobs:
      - fendix-scan
