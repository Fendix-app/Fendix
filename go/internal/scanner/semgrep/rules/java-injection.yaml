                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
