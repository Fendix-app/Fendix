                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          # The handler reassigns the value before passing it (file = getName(file)).
          - pattern-not-inside: |
              class $SC {
                ...
                $SRT $SM(...) {
                  ...
                  $SP = $SREASSIGNED;
                  ...
                }
                ...
              }
          - metavariable-regex:
              metavariable: $SARG
              regex: ^(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*")(\s*\+\s*(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*"))*$|^String\.format\(\s*"[^"]*"(\s*,\s*(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*"))*\s*\)$
          - metavariable-pattern:
              metavariable: $SARG
              pattern: $SP
          - metavariable-regex:
              metavariable: $SHT
              regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
          - pattern: $SQ
      # The servlet request.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $SREQ).$SGET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (ServletRequest $SREQ).$SGET(...)
              - patterns:
                  - pattern: $SREQ.$SGET(...)
                  - metavariable-regex:
                      metavariable: $SREQ
                      regex: ^(request|req|httpRequest|servletRequest|httpServletRequest)$
          - metavariable-regex:
              metavariable: $SGET
              regex: ^(getParameter|getParameterValues|getHeader|getQueryString|getInputStream|getReader)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: UUID.fromString(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new Template($NAME, $T, ...)
              - pattern: new freemarker.template.Template($NAME, $T, ...)
              - pattern: Velocity.evaluate($CTX, $OUT, $TAG, $T)
              - pattern: (VelocityEngine $VE).evaluate($CTX, $OUT, $TAG, $T)
              - pattern: (TemplateEngine $TE).process($T, ...)
              - pattern: (SpringTemplateEngine $TE).process($T, ...)
              - pattern: (ITemplateEngine $TE).process($T, ...)
          - focus-metavariable: $T
