# Java / Spring injection pack: SQL injection, command injection and
# server-side template injection as taint rules from Spring MVC and servlet
# request input, plus a shape rule for SQL built from a method's own argument.
#
# Written in-house for Fendix; see docs/semgrep-rules.md. Semgrep cannot share
# a block between rules, so the request sources and the number sanitizers are
# repeated, word for word, in every taint rule of java-injection.yaml and
# java-web.yaml; TestJavaTaintRulesShareTheirBlocks keeps the copies equal.
#
# Request sources:
#   - a handler parameter annotated @RequestParam, @PathVariable, @RequestBody,
#     @RequestHeader, @CookieValue, @ModelAttribute, @RequestPart or
#     @MatrixVariable, or a plain String parameter of a request-mapping method
#     (Spring binds it as a request parameter); never a number, a boolean, a
#     date, a UUID or a framework object, none of which carries a payload;
#   - a parameter of a method of the same class (a direct member, not one of
#     a nested class) that a handler calls with the same number of arguments
#     (1 to 3), passing at that position the request value itself, a getter
#     of it, or a concatenation or String.format of such values. A value the
#     handler sanitised in the call (FilenameUtils.getName(file)) or
#     reassigned before it is not followed. Open-source Semgrep follows taint
#     within one method only; this lets it follow the request value into the
#     called method's body, so the finding is reported at the sink inside
#     that method;
#   - HttpServletRequest.getParameter, getParameterValues, getHeader,
#     getQueryString, getInputStream and getReader.
#
# A SQL identifier (a sort column, a direction, IN-list placeholders) is not
# request text when it is a count, copies or a stream map of a literal, a
# lookup in a final map of literals with a literal default, or a call of a
# method of this class that returns only literals; or when it passed an
# allowlist or a set of literals (a membership or negated-equalities check
# that exits or replaces it with a literal, a ternary, or a switch that
# replaces it in its default). java-sqli-sink carries the same guards as
# negations.
#
# Every rule skips test, fixture and mock code (the paths block at the top of
# each rule; TestJavaRulesShareTheTestPathExcludes keeps the copies equal).
rules:
  - id: java-sqli-taint
    mode: taint
    languages: [java]
    # Test, fixture and mock code is not shipped: a finding there would block a
    # build for code no user runs. Every rule of the Java packs carries this same
    # list (TestJavaRulesShareTheTestPathExcludes); the patterns are matched
    # relative to the scan root, so a project checked out under a directory of
    # one of these names is still scanned.
    paths:
      exclude:
        - "**/src/test/**"
        - "**/src/integrationTest/**"
        - "**/src/testFixtures/**"
        - "**/src/it/**"
        - "*Test.java"
        - "*Tests.java"
        - "*IT.java"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fake/**"
        - "**/fakes/**"
    severity: ERROR
    message: >-
      SQL query built from request input. A request value reaches the SQL text
      of a JDBC, JdbcTemplate or JPA query (directly, or through a method of
      this class that builds the query from it), so the caller can change the
      query. Use `?` placeholders and pass the value as a query argument, or a
      NamedParameterJdbcTemplate with a MapSqlParameterSource.
    metadata:
      category: injection
      cwe: CWE-89
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_reachability: taint
      fendix_title: SQL query built from request input.
      fendix_remediation: >-
        Keep the SQL text constant: use `?` placeholders and pass the request
        value as a query argument (jdbcTemplate.query(sql, rowMapper, value)),
        or a NamedParameterJdbcTemplate with a MapSqlParameterSource. Never
        concatenate or String.format request input into SQL.
    pattern-sources:
      # A request-bound parameter of a handler: annotated, or a plain String
      # parameter of a request-mapping method, which Spring binds as a request
      # parameter. Not a number, boolean, date or UUID, nor a framework object.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $SRT $SM(..., @$SANN(...) $ST $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      @$SMAP(...)
                      $SRT $SM(..., String $SP, ...) { ... }
                  # Annotated otherwise (@SessionAttribute, @AuthenticationPrincipal):
                  # not a request parameter.
                  - pattern-not-inside: |
                      $SRT $SM(..., @$SOTHER(...) String $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          - pattern: $SP
      # One call deep: the parameter of a method of the same class (a direct
      # member, not a nested class's) that a handler calls with such a value at
      # that position, matched by name and by the number of arguments (1 to 3).
      # Open-source Semgrep follows taint within one method; from this source it
      # follows the called method's own body, to the sink inside it. The argument
      # must be the value itself or a concatenation or format of it (see
      # $SARG below), and the handler must not reassign the parameter.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SA2, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SA2, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          # The handler reassigns the value before passing it (file = getName(file)).
          - pattern-not-inside: |
              class $SC {
                ...
                $SRT $SM(...) {
                  ...
                  $SP = $SREASSIGNED;
                  ...
                }
                ...
              }
          - metavariable-regex:
              metavariable: $SARG
              regex: ^(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*")(\s*\+\s*(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*"))*$|^String\.format\(\s*"[^"]*"(\s*,\s*(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*"))*\s*\)$
          - metavariable-pattern:
              metavariable: $SARG
              pattern: $SP
          - metavariable-regex:
              metavariable: $SHT
              regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
          - pattern: $SQ
      # The servlet request.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $SREQ).$SGET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (ServletRequest $SREQ).$SGET(...)
              - patterns:
                  - pattern: $SREQ.$SGET(...)
                  - metavariable-regex:
                      metavariable: $SREQ
                      regex: ^(request|req|httpRequest|servletRequest|httpServletRequest)$
          - metavariable-regex:
              metavariable: $SGET
              regex: ^(getParameter|getParameterValues|getHeader|getQueryString|getInputStream|getReader)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: UUID.fromString(...)
      # Values that hold no request text whatever the request: a count or a length;
      # n copies of a literal (IN-list placeholders); a stream mapped to a literal;
      # a lookup in a final map of literals, with a literal default; a call of a
      # method of this class whose every return is a literal.
      - pattern-either:
          - pattern: $GX.size()
          - pattern: $GX.length()
          - pattern: $GX.length
          - pattern: Collections.nCopies($GN, "...")
      - patterns:
          # A lambda's expression body is bound whole: "..." in its place would
          # also match a concatenation that holds the element.
          - pattern: $GX.map($GL -> $GLIT)
          - metavariable-regex:
              metavariable: $GLIT
              regex: ^"[^"\\\n]*"$
      - patterns:
          - pattern-either:
              - pattern: $GM.get($GK)
              - pattern: $GM.getOrDefault($GK, "...")
          - pattern-inside: |
              class $GC {
                ...
                final $GMT $GM = $GMINIT;
                ...
              }
          - metavariable-regex:
              metavariable: $GMINIT
              regex: '(?s)^(?:Map|ImmutableMap)\s*\.\s*of\s*\(\s*(?:"[^"\\\n]*"\s*(?:,\s*"[^"\\\n]*"\s*)*)?\)$|^Map\s*\.\s*ofEntries\s*\(\s*(?:(?:Map\s*\.\s*)?entry\s*\(\s*"[^"\\\n]*"\s*,\s*"[^"\\\n]*"\s*\)\s*(?:,\s*(?:Map\s*\.\s*)?entry\s*\(\s*"[^"\\\n]*"\s*,\s*"[^"\\\n]*"\s*\)\s*)*)?\)$'
      - patterns:
          - pattern: $GH(...)
          - pattern-inside: |
              class $GC {
                ...
                $GRT $GH(...) {
                  ...
                  return "...";
                }
                ...
              }
          # No method of that name returns anything but a literal (or a choice
          # between two literals).
          - pattern-not:
              patterns:
                - pattern: $GH(...)
                - pattern-inside: |
                    class $GC {
                      ...
                      $GRT $GH(...) {
                        ...
                        return $GRET;
                      }
                      ...
                    }
                - metavariable-regex:
                    metavariable: $GRET
                    regex: '(?s)^(?!"[^"\\\n]*"$)(?![^?]*\?\s*"[^"\\\n]*"\s*:\s*"[^"\\\n]*"$)'
      # An identifier checked against an allowlist or a set of literals: the
      # same guards as java-sqli-sink's negations.
      - patterns:
          - pattern-inside: |
              if ($GCOND) $GBODY;
              ...
          - pattern-either:
              - pattern-inside: |
                  if (<... $GALLOW.contains($GV) ...>) { ... }
                  ...
              - pattern-inside: |
                  if (<... $GALLOW.containsKey($GV) ...>) { ... }
                  ...
          - pattern-not-inside: |
              if ($GCOND) { ... }
          - pattern: $GV
          - metavariable-regex:
              metavariable: $GV
              regex: ^\w+$
          - metavariable-regex:
              metavariable: $GBODY
              regex: (?s)^(?:\{(?:.*[;{}])?\s*)?(?:throw|return)\b[^;{}]*;?\s*(?://[^\n]*\s*)*\}?\s*$
          - metavariable-pattern:
              metavariable: $GCOND
              patterns:
                - pattern-either:
                    - pattern: '!$GALLOW.contains($GV)'
                    - pattern: '!$GALLOW.containsKey($GV)'
                - pattern-not-inside: '$GA && $GB'
      - patterns:
          - pattern-inside: |
              if ($GCOND) $GBODY;
              ...
          - pattern-inside: |
              $GIF;
              ...
          - pattern-either:
              - pattern-inside: |
                  if (<... $GALLOW.contains($GV) ...>) { ... }
                  ...
              - pattern-inside: |
                  if (<... $GALLOW.containsKey($GV) ...>) { ... }
                  ...
          - pattern-not-inside: |
              if ($GCOND) { ... }
          - pattern: $GV
          - metavariable-regex:
              metavariable: $GV
              regex: ^\w+$
          - metavariable-pattern:
              metavariable: $GIF
              pattern: if ($GCOND) $GBODY;
          - metavariable-regex:
              metavariable: $GIF
              regex: '(?s)^(?!.*\belse\b)if\s*\((?:(?!\.\s*contains(?:Key)?\s*\(\s*)(?:(?!\)\s*\{)(?!\)\s*\w+\s*=).))*\.\s*contains(?:Key)?\s*\(\s*(\w+)\s*\)(?:(?!\.\s*contains(?:Key)?\s*\(\s*(?!\1\s*\)))(?:(?!\)\s*\{)(?!\)\s*\w+\s*=).))*\)\s*(?:\{(?:.*[;{}])?\s*)?\1\s*=\s*"[^"\\\n]*"\s*;(?:\s*\w+\s*=\s*"[^"\\\n]*"\s*;)*\s*(?://[^\n]*\s*)*\}?\s*$'
          - metavariable-pattern:
              metavariable: $GBODY
              pattern: '$GV = "...";'
          - metavariable-pattern:
              metavariable: $GCOND
              patterns:
                - pattern-either:
                    - pattern: '!$GALLOW.contains($GV)'
                    - pattern: '!$GALLOW.containsKey($GV)'
                - pattern-not-inside: '$GA && $GB'
      - patterns:
          - pattern-inside: |
              if ($GCOND) { ... }
          - pattern-either:
              - pattern-inside: |
                  if (<... $GALLOW.contains($GV) ...>) { ... }
              - pattern-inside: |
                  if (<... $GALLOW.containsKey($GV) ...>) { ... }
          - pattern-not-inside: |
              if ($GCOND) { ... } else { ... }
          - pattern: $GV
          - metavariable-regex:
              metavariable: $GV
              regex: ^\w+$
          - metavariable-pattern:
              metavariable: $GCOND
              patterns:
                - pattern-either:
                    - pattern: '$GALLOW.contains($GV)'
                    - pattern: '$GALLOW.containsKey($GV)'
                - pattern-not-inside: '!$GALLOW.contains($GV)'
                - pattern-not-inside: '!$GALLOW.containsKey($GV)'
                - pattern-not-inside: '$GA || $GB'
      - patterns:
          - pattern-inside: |
              if ($GCOND) $GBODY;
              ...
          - pattern-either:
              - pattern-inside: |
                  if (<... "...".equals($GV) ...>) { ... }
                  ...
              - pattern-inside: |
                  if (<... "...".equalsIgnoreCase($GV) ...>) { ... }
                  ...
              - pattern-inside: |
                  if (<... $GV.equals("...") ...>) { ... }
                  ...
              - pattern-inside: |
                  if (<... $GV.equalsIgnoreCase("...") ...>) { ... }
                  ...
          - pattern-not-inside: |
              if ($GCOND) { ... }
          - pattern: $GV
          - metavariable-regex:
              metavariable: $GV
              regex: ^\w+$
          - metavariable-regex:
