        Never build a template from request input. Load templates by a fixed
        name from the template directory and pass request values only in the
        data model (template.process(model, out), Context.setVariable).
    pattern-sources:
      # A request-bound parameter of a handler: annotated, or a plain String
      # parameter of a request-mapping method, which Spring binds as a request
      # parameter. Not a number, boolean, date or UUID, nor a framework object.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $SRT $SM(..., @$SANN(...) $ST $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      @$SMAP(...)
                      $SRT $SM(..., String $SP, ...) { ... }
                  # Annotated otherwise (@SessionAttribute, @AuthenticationPrincipal):
                  # not a request parameter.
                  - pattern-not-inside: |
                      $SRT $SM(..., @$SOTHER(...) String $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          - pattern: $SP
      # One call deep: the parameter of a method of the same class (a direct
      # member, not a nested class's) that a handler calls with such a value at
      # that position, matched by name and by the number of arguments (1 to 3).
      # Open-source Semgrep follows taint within one method; from this source it
      # follows the called method's own body, to the sink inside it. The argument
      # must be the value itself or a concatenation or format of it (see
      # $SARG below), and the handler must not reassign the parameter.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG) ...>;
                          ...
