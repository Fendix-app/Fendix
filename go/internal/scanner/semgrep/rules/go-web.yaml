# Go (net/http, Gin) web rules: XSS, SSRF, path traversal and open redirect.
#
# Written in-house for Fendix. Each class has a taint rule (<lang>-<class>-taint)
# that counts as reachability once Go clears its gate (ADR-011), and a shape
# rule (<lang>-<class>-sink) for a function parameter reaching the same sink.
# Tests: ../ruletests/go-web.go and go-web.texttemplate.go (semgrep --test,
# see its README.md).
#
# Semgrep OSS taint analysis is intraprocedural, so each taint rule also
# treats as a sink a call, in the same file, to a function whose string
# parameter reaches the sink directly. The call is then the reported line.
# The argument and the parameter are paired by position (first to third),
# and only a bare call is followed: it names a package-level function, never
# a method, and Semgrep's top-level func pattern does not match a method
# either (pinned by a rule test).
#
# Taint passes through a call, as Semgrep does by default, unless the call
# sanitizer clears it. A call is clean when it is
#   - len or cap;
#   - a call to a function or method of this file whose body is visible here
#     and whose every return is constant: every return is a string literal (a
#     switch or an if over literals, matched by a regex over the body), or the
#     body looks its result up in a map of string literals and falls back to a
#     literal (a few shapes, written out; the map is declared in the function,
#     or above it at package level);
#   - a package-qualified or method call that is not a source, a call that
#     hands its input back (fmt, the strings, filepath, path and url
#     functions, decoders), a call that takes a function literal, or a call of
#     a method of this file that takes a string and returns a string: a row, a
#     cache entry or a stored file name looked up by request input is not
#     request input.
# Every other call keeps its arguments' taint: a function of another file of the
# package (its body cannot be seen), a signature or body that is not one of
# the above, and a method of this file that builds its result. A helper that
# validates its parameter and returns it (if allowed[s] { return s }) hands
# its input back, so it is not clean: a known false positive.
# The cost note in go-injection.yaml's header applies to the helper patterns here.
rules:
  # Cross-site scripting (Go). Taint mode: request input written unescaped
  # into an HTML response, or wrapped in template.HTML (and its siblings) so
  # html/template does not escape it.
  - id: go-xss-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: ERROR
    message: >-
      Request input written into an HTML response without escaping: render it with html/template or escape it with html.EscapeString.
    metadata:
      category: xss
      cwe: [CWE-79]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        Request input written into an HTML response without escaping.
      fendix_remediation: >-
        Request input reaches an HTML response unescaped: a writer whose Content-Type is text/html, Gin's c.Data with an HTML type, or a template.HTML conversion that switches html/template's escaping off. Render it with html/template, or escape it with html.EscapeString.
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).FormFile(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
    pattern-sanitizers:
      # A call's result is clean only when it is a constant: len and cap, and a
      # call to a function or method of this file whose body can be seen here and whose
      # every return is a string literal, or a lookup in a map of string
      # literals with a literal fallback (the shapes below). Any other call of
      # a package-level function keeps the taint of its arguments, as Semgrep
      # does by default: a function of another file of the package, a
      # signature that is not a single string, or a body that builds its result
      # from its parameters. make is not listed: Semgrep's make(...) pattern
      # also matches every map, slice and struct literal, which would hide a
      # value put into one, and make takes only sizes.
      - exact: true
        pattern-either:
          - pattern: len(...)
          - pattern: cap(...)
      # A function or method of this file whose every return is a string literal
      # (a switch or an if over literals). The pattern ends at the helper, or at
      # a later function that calls it, and the regex on the body is part of
      # the pattern that ends there: see the cost note in the header of
      # go-injection.yaml.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $FUNC(...)
              - pattern: $RECEIVER.$FUNC(...)
          - pattern-either:
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                        ...
                        func $CALLER(...) {
                          ...
                          $FUNC(...)
                          ...
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
              - pattern-inside:
