          - pattern-not: http.Get(...)
          - pattern-not: http.Head(...)
          - pattern-not: http.Post(...)
          - pattern-not: http.PostForm(...)
          - pattern-not: http.DefaultClient.$FETCH(...)
          - pattern-not: '($CLIENT : *http.Client).$FETCH(...)'
          - pattern-not: http.NewRequest(...)
          - pattern-not: http.NewRequestWithContext(...)
          - pattern-not: $CLIENT.Do(...)

      # A value parsed as a number, a boolean or a UUID carries no syntax.
