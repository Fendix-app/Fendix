    severity: ERROR
    message: >-
      File path built from request input: keep only its base name, or check the resolved path stays under the base directory.
    metadata:
      category: injection
      cwe: [CWE-22]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        File path built from request input.
      fendix_remediation: >-
        Request input reaches a file path, so ../ sequences can read or write outside the intended directory. Keep only the base name (filepath.Base), or resolve the joined path and check it stays under the base directory: strings.HasPrefix(target, base+string(os.PathSeparator)).
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).FormFile(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
    pattern-sanitizers:
      # A call's result is clean only when it is a constant: len and cap, and a
      # call to a function or method of this file whose body can be seen here and whose
      # every return is a string literal, or a lookup in a map of string
      # literals with a literal fallback (the shapes below). Any other call of
      # a package-level function keeps the taint of its arguments, as Semgrep
      # does by default: a function of another file of the package, a
      # signature that is not a single string, or a body that builds its result
      # from its parameters. make is not listed: Semgrep's make(...) pattern
      # also matches every map, slice and struct literal, which would hide a
      # value put into one, and make takes only sizes.
      - exact: true
        pattern-either:
          - pattern: len(...)
          - pattern: cap(...)
