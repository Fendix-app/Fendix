  # A string parameter of the enclosing function joined onto a directory and
  # opened. A bare os.ReadFile(path) is left out: config loaders and CLIs do it
  # with paths no request controls.
  - id: go-path-traversal-sink
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: WARNING
    message: >-
      File path joined from a function parameter: if callers pass request input, this is path traversal.
    metadata:
      category: injection
      cwe: [CWE-22]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        File path joined from a function parameter.
      fendix_remediation: >-
        A parameter is joined onto a directory and opened. If a caller passes request input, ../ sequences escape the directory. Keep only the base name, or check the resolved path stays under the directory.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: os.$OP(filepath.Join($DIR, ..., $PARAM, ...), ...)
                  - pattern: os.$OP(path.Join($DIR, ..., $PARAM, ...), ...)
              - metavariable-regex:
                  metavariable: $OP
                  regex: ^(ReadFile|Open|OpenFile|Create|WriteFile|Remove|RemoveAll|ReadDir)$
          - pattern: http.ServeFile($W, $R, filepath.Join($DIR, ..., $PARAM, ...))
          - pattern: '($C : *gin.Context).File(filepath.Join($DIR, ..., $PARAM, ...))'
      # A guard on the parameter whose block ends in a return.
      - pattern-not-inside: |
          if strings.Contains($PARAM, "..") {
            return ...
          }
          ...
      - pattern-not-inside: |
          if strings.Contains($PARAM, "..") {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || strings.Contains($PARAM, "..") {
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || strings.Contains($PARAM, "..") {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if strings.Contains($PARAM, "..") || $A {
            return ...
          }
          ...
      - pattern-not-inside: |
          if strings.Contains($PARAM, "..") || $A {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if !filepath.IsLocal($PARAM) {
            return ...
          }
          ...
      - pattern-not-inside: |
          if !filepath.IsLocal($PARAM) {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || !filepath.IsLocal($PARAM) {
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || !filepath.IsLocal($PARAM) {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if !filepath.IsLocal($PARAM) || $A {
            return ...
          }
          ...
      - pattern-not-inside: |
          if !filepath.IsLocal($PARAM) || $A {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if filepath.Base($PARAM) != $PARAM {
            return ...
          }
          ...
      - pattern-not-inside: |
          if filepath.Base($PARAM) != $PARAM {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || filepath.Base($PARAM) != $PARAM {
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || filepath.Base($PARAM) != $PARAM {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if filepath.Base($PARAM) != $PARAM || $A {
            return ...
          }
          ...
      - pattern-not-inside: |
          if filepath.Base($PARAM) != $PARAM || $A {
            $S1
            return ...
          }
          ...
      - pattern-not: os.$OP("...", ...)
      - pattern-not: os.$OP(<... filepath.Base($PARAM) ...>, ...)
      - pattern-not: os.$OP(<... filepath.Ext($PARAM) ...>, ...)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
  # Open redirect (Go). Taint mode: request input used as a redirect target
  # (http.Redirect, Gin's c.Redirect, a Location header), unless a local-path
  # check ran first or a literal prefix fixes where the target points.
  - id: go-open-redirect-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: ERROR
    message: >-
      Redirect to a URL taken from request input: redirect only to a local path.
    metadata:
      category: injection
      cwe: [CWE-601]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Redirect to a URL taken from request input.
      fendix_remediation: >-
        The response redirects to a target the caller chose, which phishing links use to borrow the site's name. Redirect only to a local path: require a leading / and reject // and /\, or map the input to a fixed set of destinations.
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).FormFile(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
