  # A string parameter of the enclosing function used as an outbound URL.
  - id: go-ssrf-sink
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: WARNING
    message: >-
      Outbound HTTP request to a URL taken from a function parameter: if callers pass request input, this is SSRF.
    metadata:
      category: injection
      cwe: [CWE-918]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Outbound HTTP request to a URL taken from a function parameter.
      fendix_remediation: >-
        A parameter is used as the URL of an outbound request. If a caller passes request input, this is server-side request forgery. Allow only a fixed set of hosts before the request.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      # http.Get and siblings only. A request built with http.NewRequest from a
      # parameter is how service clients send to endpoints their callers build
      # from configuration; the taint rule still follows it within a file.
      - pattern-either:
          - pattern: http.$FETCH($PARAM, ...)
          - pattern: http.DefaultClient.$FETCH($PARAM, ...)
          - pattern: '($CLIENT : *http.Client).$FETCH($PARAM, ...)'
      - metavariable-regex:
          metavariable: $FETCH
          regex: ^(Get|Head|Post|PostForm)$
      # A host allowlist: a negated check whose block ends in a return.
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Hostname()] {
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Hostname()] {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if $A || !$ALLOWED[$U.Hostname()] {
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if $A || !$ALLOWED[$U.Hostname()] {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Hostname()] || $A {
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Hostname()] || $A {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Host] {
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Host] {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if $A || !$ALLOWED[$U.Host] {
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if $A || !$ALLOWED[$U.Host] {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Host] || $A {
            return ...
          }
          ...
      - pattern-not-inside: |
          $U, $ERR := url.Parse($PARAM)
          ...
          if !$ALLOWED[$U.Host] || $A {
            $S1
            return ...
          }
          ...
      - pattern-not: http.$FETCH("...", ...)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
  # Path traversal (Go). Taint mode: request input reaching a file path
  # (os and ioutil file operations, http.ServeFile, Gin's c.File), unless
  # only its base name is kept or the resolved path is checked to stay
  # under a base directory.
