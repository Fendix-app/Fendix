    severity: WARNING
    message: >-
      Redirect to a function parameter: if callers pass request input, this is an open redirect.
    metadata:
      category: injection
      cwe: [CWE-601]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Redirect to a URL taken from a function parameter.
      fendix_remediation: >-
        A parameter is used as a redirect target. If a caller passes request input, this is an open redirect. Redirect only to a local path.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      - pattern-either:
          - pattern: http.Redirect($W, $R, $PARAM, ...)
          - pattern: '($C : *gin.Context).Redirect($CODE, $PARAM)'
          - patterns:
              - pattern-either:
                  - pattern: $W.Header().Set($KEY, $PARAM)
                  - pattern: '($C : *gin.Context).Header($KEY, $PARAM)'
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^"location"$
      # A local-path check (starts with /, not with //) whose block ends in a
      # return or a literal replacing the parameter.
      - pattern-not-inside: |
          if !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            return ...
          }
          ...
      - pattern-not-inside: |
          if !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            $PARAM = "..."
          }
          ...
      - pattern-not-inside: |
          if !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            $S1
            $PARAM = "..."
          }
          ...
      - pattern-not-inside: |
          if strings.HasPrefix($PARAM, "//") || !strings.HasPrefix($PARAM, "/") {
            return ...
          }
          ...
      - pattern-not-inside: |
          if strings.HasPrefix($PARAM, "//") || !strings.HasPrefix($PARAM, "/") {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if strings.HasPrefix($PARAM, "//") || !strings.HasPrefix($PARAM, "/") {
            $PARAM = "..."
          }
          ...
      - pattern-not-inside: |
          if strings.HasPrefix($PARAM, "//") || !strings.HasPrefix($PARAM, "/") {
            $S1
            $PARAM = "..."
          }
          ...
      - pattern-not-inside: |
          if $A || !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            $S1
            return ...
          }
          ...
      - pattern-not-inside: |
          if $A || !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            $PARAM = "..."
          }
          ...
      - pattern-not-inside: |
          if $A || !strings.HasPrefix($PARAM, "/") || strings.HasPrefix($PARAM, "//") {
            $S1
            $PARAM = "..."
          }
          ...
      - pattern-not: http.Redirect($W, $R, "...", ...)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
