# Go (net/http, Gin) web rules: XSS, SSRF, path traversal and open redirect.
#
# Written in-house for Fendix. Each class has a taint rule (<lang>-<class>-taint)
# that counts as reachability once Go clears its gate (ADR-011), and a shape
# rule (<lang>-<class>-sink) for a function parameter reaching the same sink.
# Tests: ../ruletests/go-web.go and go-web.texttemplate.go (semgrep --test,
# see its README.md).
#
# Semgrep OSS taint analysis is intraprocedural, so each taint rule also
# treats as a sink a call, in the same file, to a function whose string
# parameter reaches the sink directly. The call is then the reported line.
# The argument and the parameter are paired by position (first to third),
# and only a bare call is followed: it names a package-level function, never
# a method, and Semgrep's top-level func pattern does not match a method
# either (pinned by a rule test).
#
# Taint passes through a bare call (a function of this package, a builtin, a
# conversion), as Semgrep does by default, and through the string-building
# calls the call sanitizer lists. Any other qualified or method call's result
# is clean: a row, a cache entry or a stored file name looked up by request
# input is not request input.
rules:
  # Cross-site scripting (Go). Taint mode: request input written unescaped
  # into an HTML response, or wrapped in template.HTML (and its siblings) so
  # html/template does not escape it.
  - id: go-xss-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
    severity: ERROR
    message: >-
      Request input written into an HTML response without escaping: render it with html/template or escape it with html.EscapeString.
    metadata:
      category: xss
      cwe: [CWE-79]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        Request input written into an HTML response without escaping.
      fendix_remediation: >-
        Request input reaches an HTML response unescaped: a writer whose Content-Type is text/html, Gin's c.Data with an HTML type, or a template.HTML conversion that switches html/template's escaping off. Render it with html/template, or escape it with html.EscapeString.
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
    pattern-sanitizers:
      # A qualified or method call's result is not request input: see the pack
      # header. A bare call (a function of this package, a builtin, a
      # conversion) keeps its arguments' taint, as Semgrep's default; that is
      # what lets the helper sinks below follow a call into this file.
      - exact: true
        patterns:
          - pattern: $RECEIVER.$FUNC(...)
          # Sources.
          - pattern-not: $R.URL.Query()
          - pattern-not: $R.URL.Query().$GET(...)
          - pattern-not: $R.FormValue(...)
          - pattern-not: $R.PostFormValue(...)
          - pattern-not: $R.PathValue(...)
          - pattern-not: $R.Header.Get(...)
          - pattern-not: $R.Header.Values(...)
          - pattern-not: $R.Form.Get(...)
          - pattern-not: $R.PostForm.Get(...)
          - pattern-not: '($R : *http.Request).Cookie(...)'
          - pattern-not: mux.Vars(...)
          - pattern-not: chi.URLParam(...)
          - pattern-not: '($C : *gin.Context).$GIN(...)'
          - pattern-not-inside: |
              $VALUES := $R.URL.Query()
              ...
              $VALUES.Get(...)
          # Calls that hand their input back.
          - pattern-not: fmt.Sprintf(...)
          - pattern-not: fmt.Sprint(...)
          - pattern-not: fmt.Sprintln(...)
          - pattern-not: strings.$STRINGS(...)
          - pattern-not: bytes.$BYTES(...)
          - pattern-not: filepath.$FILEPATH(...)
          - pattern-not: path.$PATH(...)
          - pattern-not: url.$URL(...)
          - pattern-not: html.UnescapeString(...)
          - pattern-not: strconv.Unquote(...)
          - pattern-not: string(...)
          - pattern-not: '[]byte(...)'
          - pattern-not: '[]rune(...)'
          - pattern-not: append(...)
          - pattern-not: $VALUE.String()
          - pattern-not: $VALUE.Bytes()
          - pattern-not: $VALUE.Query()
          - pattern-not: $VALUE.Hostname()
          - pattern-not: $CODEC.DecodeString(...)
          - pattern-not: $CODEC.Unescape(...)
          - pattern-not: $CODEC.UnescapeString(...)
          - pattern-not: $CODEC.QueryUnescape(...)
          - pattern-not: $CODEC.PathUnescape(...)
          - pattern-not: $CODEC.Unquote(...)
          - pattern-not: io.ReadAll(...)
          - pattern-not: ioutil.ReadAll(...)
          - pattern-not: json.NewDecoder(...)
          - pattern-not: $DECODER.Decode(...)
          - pattern-not: json.Unmarshal(...)
          # A call that takes a function literal (router.GET(path, func(c
          # *gin.Context) { ... })): its range holds the literal's body, and Semgrep
          # does not judge the calls inside a sanitized range one by one.
          - pattern-not: $OUTER(..., <... func(...) { ... } ...>, ...)
          # This rule's sinks.
          - pattern-not: template.HTML(...)
          - pattern-not: template.HTMLAttr(...)
          - pattern-not: template.JS(...)
          - pattern-not: template.JSStr(...)
          - pattern-not: template.CSS(...)
          - pattern-not: template.URL(...)
          - pattern-not: template.Srcset(...)
          - pattern-not: fmt.Fprintf(...)
          - pattern-not: fmt.Fprint(...)
          - pattern-not: fmt.Fprintln(...)
          - pattern-not: io.WriteString(...)
          - pattern-not: $W.Write(...)
          - pattern-not: $W.WriteString(...)
          - pattern-not: $TPL.Execute(...)
          - pattern-not: $TPL.ExecuteTemplate(...)

      # A value parsed as a number, a boolean or a UUID carries no syntax.
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      - pattern: uuid.Parse(...)
      - pattern: uuid.MustParse(...)
      # A number formatted back into a string is digits only.
      - pattern: strconv.Itoa(...)
      - pattern: strconv.FormatInt(...)
      - pattern: strconv.FormatUint(...)
      - pattern: strconv.FormatFloat(...)
      - pattern: strconv.FormatBool(...)

      # Escaped for HTML (or for a URL component).
      - pattern: html.EscapeString(...)
      - pattern: template.HTMLEscapeString(...)
      - pattern: template.HTMLEscaper(...)
      - pattern: template.JSEscapeString(...)
      - pattern: url.QueryEscape(...)
      - pattern: url.PathEscape(...)
      # bluemonday and similar HTML sanitizers.
      - pattern: $POLICY.Sanitize(...)
      - pattern: $POLICY.SanitizeBytes(...)
    pattern-sinks:
      # html/template trusts these types as already safe.
      - patterns:
          - pattern: template.$TYPE($VALUE)
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(HTML|HTMLAttr|JS|JSStr|CSS|URL|Srcset)$
          - focus-metavariable: $VALUE
      # A response writer whose Content-Type was set to text/html.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $W.Header().Set($KEY, $TYPE)
                  ...
              - pattern-inside: |
                  $W.Header().Add($KEY, $TYPE)
                  ...
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^"content-type"$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern-either:
              - pattern: fmt.Fprintf($W, ..., $VALUE, ...)
              - pattern: fmt.Fprint($W, ..., $VALUE, ...)
              - pattern: fmt.Fprintln($W, ..., $VALUE, ...)
              - pattern: io.WriteString($W, $VALUE)
              - pattern: $W.Write($VALUE)
              - pattern: $W.WriteString($VALUE)
          - focus-metavariable: $VALUE
      # Gin: the context's writer after c.Header("Content-Type", "text/html..."),
      # and c.Data with an HTML content type.
      - patterns:
          - pattern-inside: |
              $C.Header($KEY, $TYPE)
              ...
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^"content-type"$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern-either:
              - pattern: fmt.Fprintf($C.Writer, ..., $VALUE, ...)
              - pattern: fmt.Fprint($C.Writer, ..., $VALUE, ...)
              - pattern: io.WriteString($C.Writer, $VALUE)
              - pattern: $C.Writer.Write($VALUE)
              - pattern: $C.Writer.WriteString($VALUE)
          - focus-metavariable: $VALUE
      # text/template does not escape what Execute writes (html/template does).
      - patterns:
          - pattern-inside: |
              import "text/template"
              ...
          - pattern-not-inside: |
              import "html/template"
              ...
          - pattern-either:
              - pattern-inside: |
                  $W.Header().Set($KEY, $TYPE)
                  ...
              - pattern-inside: |
                  $W.Header().Add($KEY, $TYPE)
                  ...
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^"content-type"$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern-either:
              - pattern: $TPL.Execute($W, $VALUE)
              - pattern: $TPL.ExecuteTemplate($W, $NAME, $VALUE)
          - focus-metavariable: $VALUE
      - patterns:
          - pattern: '($C : *gin.Context).Data($CODE, $TYPE, $VALUE)'
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - focus-metavariable: $VALUE
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    fmt.Fprintf($W, ..., <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    fmt.Fprint($W, ..., <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    io.WriteString($W, <... $PARAM ...>)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    $W.Write(<... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^"content-type"$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    fmt.Fprintf($W, ..., <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    fmt.Fprint($W, ..., <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    io.WriteString($W, <... $PARAM ...>)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    $W.Write(<... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^"content-type"$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    fmt.Fprintf($W, ..., <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    fmt.Fprint($W, ..., <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    io.WriteString($W, <... $PARAM ...>)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $W.Header().Set($KEY, $TYPE)
                    ...
                    $W.Write(<... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^"content-type"$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern: $HELPER($X1, $X2, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    $C.Data($CODE, $TYPE, <... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    $C.Data($CODE, $TYPE, <... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $C.Data($CODE, $TYPE, <... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^"text/html
          - pattern: $HELPER($X1, $X2, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    template.$TEMPLATETYPE(<... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $TEMPLATETYPE
              regex: ^(HTML|HTMLAttr|JS|JSStr|CSS|URL|Srcset)$
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    template.$TEMPLATETYPE(<... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $TEMPLATETYPE
              regex: ^(HTML|HTMLAttr|JS|JSStr|CSS|URL|Srcset)$
          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches an HTML response; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    template.$TEMPLATETYPE(<... $PARAM ...>)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                html.EscapeString($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                template.HTMLEscapeString($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $TEMPLATETYPE
              regex: ^(HTML|HTMLAttr|JS|JSStr|CSS|URL|Srcset)$
          - pattern: $HELPER($X1, $X2, $ARG, ...)
          - focus-metavariable: $ARG
  # A string parameter of the enclosing function written into an HTML response.
  - id: go-xss-sink
    languages: [go]
    # Go test code: *_test.go and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
    severity: WARNING
    message: >-
      HTML response built from a function parameter without escaping: if callers pass request input, this is XSS.
    metadata:
      category: xss
      cwe: [CWE-79]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        HTML response built from a function parameter without escaping.
      fendix_remediation: >-
        A parameter is written into an HTML response unescaped. If a caller passes request input, this is cross-site scripting. Render it with html/template, or escape it with html.EscapeString.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      # The parameter is formatted or concatenated into HTML. A helper that
      # writes the page its caller rendered, whole, builds nothing and is left to
      # its callers.
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $W.Header().Set($KEY, $TYPE)
                      ...
                  - pattern-inside: |
                      $W.Header().Add($KEY, $TYPE)
                      ...
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^"content-type"$
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: (?i)^"text/html
              - pattern-either:
                  - pattern: fmt.Fprintf($W, "...", ..., <... $PARAM ...>, ...)
                  - patterns:
                      - pattern-either:
                          - pattern: $W.Write(<... $PARAM ...>)
                          - pattern: io.WriteString($W, <... $PARAM ...>)
                      - pattern-either:
                          - pattern: $W.Write([]byte(fmt.Sprintf(...)))
                          - pattern: $W.Write([]byte($LEFT + $RIGHT))
                          - pattern: io.WriteString($W, fmt.Sprintf(...))
                          - pattern: io.WriteString($W, $LEFT + $RIGHT)
          - patterns:
              - pattern: $C.Data($CODE, $TYPE, <... $PARAM ...>)
              - pattern-either:
                  - pattern: $C.Data($CODE, $TYPE, []byte(fmt.Sprintf(...)))
                  - pattern: $C.Data($CODE, $TYPE, []byte($LEFT + $RIGHT))
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: (?i)^"text/html
          - patterns:
              - pattern: template.$TEMPLATETYPE(<... $PARAM ...>)
              - pattern-either:
                  - pattern: template.$TEMPLATETYPE(fmt.Sprintf(...))
                  - pattern: template.$TEMPLATETYPE($LEFT + $RIGHT)
              - metavariable-regex:
                  metavariable: $TEMPLATETYPE
                  regex: ^(HTML|HTMLAttr|JS|JSStr|CSS|URL|Srcset)$
      - pattern-not: fmt.Fprintf($W, "...")
      - pattern-not: fmt.Fprintf($W, ..., <... html.EscapeString($PARAM) ...>, ...)
      - pattern-not: $W.Write(<... html.EscapeString($PARAM) ...>)
      - pattern-not: $C.Data($CODE, $TYPE, <... html.EscapeString($PARAM) ...>)
      - pattern-not: template.$TEMPLATETYPE(<... html.EscapeString($PARAM) ...>)
      - pattern-not: template.$TEMPLATETYPE(<... $POLICY.Sanitize(...) ...>)
      # The parameter reaches the HTML only through an escaping call.
      - pattern-not: template.$TEMPLATETYPE(<... html.EscapeString(<... $PARAM ...>) ...>)
      - pattern-not: template.$TEMPLATETYPE(<... template.HTMLEscapeString(<... $PARAM ...>) ...>)
      - pattern-not: fmt.Fprintf($W, ..., <... html.EscapeString(<... $PARAM ...>) ...>, ...)
      - pattern-not: $W.Write(<... html.EscapeString(<... $PARAM ...>) ...>)
      - pattern-not: $C.Data($CODE, $TYPE, <... html.EscapeString(<... $PARAM ...>) ...>)
      - pattern-not: $W.Write(<... $POLICY.Sanitize(...) ...>)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
  # Server-side request forgery (Go). Taint mode: request input used as the
  # URL of an outbound request (http.Get and siblings, or http.NewRequest
  # sent with Client.Do), unless a host allowlist was checked first.
  - id: go-ssrf-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
    severity: ERROR
    message: >-
      Outbound HTTP request to a URL taken from request input: allow only a fixed set of hosts first.
    metadata:
      category: injection
      cwe: [CWE-918]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        Outbound HTTP request to a URL taken from request input.
      fendix_remediation: >-
        The server fetches a URL the caller chose, so it can be pointed at internal services or cloud metadata endpoints. Parse the URL and allow only a fixed set of hosts before the request: u, err := url.Parse(target); if err != nil || !allowedHosts[u.Hostname()] { return }.
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
