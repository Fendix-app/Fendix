      - pattern: strconv.FormatInt(...)
      - pattern: strconv.FormatUint(...)
      - pattern: strconv.FormatFloat(...)
      - pattern: strconv.FormatBool(...)

      # A target whose start a literal fixes: a local path, a fixed host, or a
      # query string or fragment (relative to the current page).
