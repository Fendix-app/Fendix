                    - metavariable-pattern:
                        metavariable: $HEAD
                        patterns:
                          - pattern-not: $URL_L + $URL_R
                          - pattern: $HEAD
          - focus-metavariable: $HEAD
      - patterns:
          - pattern-either:
              - pattern: '$CLIENT({..., url: $U, ...}, ...)'
          - metavariable-regex:
