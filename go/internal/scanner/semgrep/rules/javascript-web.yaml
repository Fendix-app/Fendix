# JavaScript and TypeScript web rules (Task 4.3): cross-site scripting, SSRF,
# path traversal and open redirect, for Express, NestJS and Next.js. Written
# in-house. Every rule is a Semgrep taint rule: a match is a request source
# reaching the sink inside one function, which counts as reachability for a
# language enabled in semgrep.ReachabilityLanguages (ADR-011). SSRF, path
# traversal and open redirect are category injection, like textscan's. The
# request sources are repeated in every rule because Semgrep does not resolve
# YAML anchors. Reachable findings are escalated one severity level, so
# fendix_severity is the level before that.
rules:
  - id: js-xss-taint
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request input is written into an HTML response without escaping. Escape it
      for HTML (escape-html, he.encode) or render it with an autoescaping
      template.
    pattern-sources:
      # Express: req.query, req.params, req.body, req.headers, req.cookies,
      # req.get(...); Next.js: request.nextUrl.searchParams, request.json(),
      # request.formData(), request.headers. A request named req or request.
      - patterns:
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.params
              - pattern: $R.body
              - pattern: $R.headers
              - pattern: $R.cookies
              - pattern: $R.get(...)
              - pattern: $R.header(...)
              - pattern: $R.nextUrl.searchParams
              - pattern: $R.json()
              - pattern: $R.formData()
              - pattern: $R.text()
          - metavariable-regex:
              metavariable: $R
              regex: ^(req|request)$
      # NestJS: a parameter bound by @Query(), @Param(), @Body() or @Headers().
      - patterns:
          - pattern-either:
              - pattern-inside: function $F(..., @Query(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Param(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Body(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Headers(...) $P, ...) { ... }
          - pattern: $P
      # NestJS: the request bound by @Req(), under any name.
      - patterns:
          - pattern-inside: function $F(..., @Req(...) $R, ...) { ... }
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.params
              - pattern: $R.body
              - pattern: $R.headers
              - pattern: $R.cookies
              - pattern: $R.get(...)
              - pattern: $R.header(...)
      # Next.js App Router: the request of a route handler, under any name,
      # and the params of its context argument.
      - patterns:
          - pattern-inside: function $M($R, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
          - pattern-either:
              - pattern: $R.nextUrl.searchParams
              - pattern: $R.json()
              - pattern: $R.formData()
              - pattern: $R.text()
              - pattern: $R.headers
      - patterns:
          - pattern-inside: function $M($R, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
          - pattern-either:
              - pattern: $CTX.params
              - pattern: params
      # `const { a, b } = (await request.json()) as T`: Semgrep 1.141.0 loses
      # the binding of a name destructured from a type-asserted value when the
      # type literal declares the same name, so the names are matched by text.
      - patterns:
          - pattern-inside: |
              const {..., $V, ...} = $E as $T;
              ...
          - metavariable-pattern:
              metavariable: $E
              patterns:
                - pattern-either:
                    - pattern: $R.query
                    - pattern: $R.params
                    - pattern: $R.body
                    - pattern: $R.headers
                    - pattern: $R.cookies
                    - pattern: $R.get(...)
                    - pattern: $R.header(...)
                    - pattern: $R.nextUrl.searchParams
                    - pattern: $R.json()
                    - pattern: $R.formData()
                    - pattern: $R.text()
                - metavariable-regex:
                    metavariable: $R
                    regex: ^(req|request)$
          - pattern: $W
          - metavariable-comparison:
              comparison: str($V) == str($W)
    pattern-sanitizers:
      # HTML escapers, by name: escape-html (escapeHtml, escape), he.encode /
      # he.escape, lodash and validator escape, entities, DOMPurify.sanitize,
      # sanitize-html, xss / filterXSS, encodeURI, encodeURIComponent. Not a
      # decoder (unescape, he.decode) or another language's escaper
      # (_.escapeRegExp, a SQL or shell escape).
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex:
              metavariable: $ESCAPE
              regex: ^(?:(?:[\w$]+\.)*(?:escapeHtml|escapeHTML|htmlEscape|escapeHtmlEntities|encodeHTML|encodeHtml|htmlEncode|sanitizeHtml|sanitizeHTML|filterXSS|encodeURI|encodeURIComponent)|escape|xss|(?:_|lodash|he|validator|entities|htmlEntities)\.(?:escape|encode|encodeHTML|escapeHTML)|(?:DOMPurify|dompurify|purify)\.sanitize)$
      # The output of an autoescaping engine rendering a fixed template (a file
      # name or a constant), and React's server rendering. A template taken
      # from the request is template injection (js-ssti-taint), not escaped.
      - pattern-either:
          - pattern: $ENGINE.render("...", ...)
          - pattern: $ENGINE.renderFile("...", ...)
          - pattern: $ENGINE.renderString("...", ...)
          - pattern: renderToString(...)
          - pattern: renderToStaticMarkup(...)
          - pattern: $REACT.renderToString(...)
          - pattern: $REACT.renderToStaticMarkup(...)
      - pattern-either:
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Math.floor(...)
          - pattern: Math.round(...)
          - pattern: Boolean(...)
    pattern-sinks:
      # Express: res.send / res.write / res.end of a string built with markup,
      # or of a value named like HTML.
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X, ...)
              - pattern: $RES.end($X, ...)
              - pattern: $RES.status($CODE).send($X)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply)$
          - metavariable-regex:
              metavariable: $X
              regex: (?s)^.*<[A-Za-z!/][^<>]*>
          - metavariable-pattern:
              metavariable: $X
              pattern-either:
                - pattern: '`...`'
                - pattern: $A + $B
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X, ...)
              - pattern: $RES.end($X, ...)
              - pattern: $RES.status($CODE).send($X)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply)$
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^.*(html|markup)
          - focus-metavariable: $X
      # Express: anything sent after the response is typed as HTML.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RES.setHeader($KEY, $TYPE);
                  ...
              - pattern-inside: |
                  $RES.set($KEY, $TYPE);
                  ...
              - pattern-inside: |
                  $RES.type($TYPE);
                  ...
              - pattern-inside: |
                  $RES.writeHead($CODE, {..., $KEY: $TYPE, ...});
                  ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^.*html
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X, ...)
              - pattern: $RES.end($X, ...)
          - focus-metavariable: $X
      # Fetch API / Next.js: a Response or NextResponse typed text/html.
      - patterns:
          - pattern-either:
              - pattern: 'new Response($X, {..., headers: {..., $KEY: $TYPE, ...}, ...})'
              - pattern: 'new NextResponse($X, {..., headers: {..., $KEY: $TYPE, ...}, ...})'
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^['"]?content-type['"]?$
          - metavariable-regex:
              metavariable: $TYPE
              regex: (?i)^.*html
          - focus-metavariable: $X
    metadata:
      category: xss
      cwe: CWE-79
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Request input written into an HTML response unescaped.
      fendix_remediation: >-
        Request input is written into an HTML response body as-is, so a value
        holding markup or a script runs in the visitor's browser. Escape it for HTML
        before it is written (escape-html, he.encode, or DOMPurify.sanitize for
        markup that must stay), or render the page with a template engine that
        escapes by default.
      fendix_reachability: taint

  - id: js-ssrf-taint
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request input chooses the URL of an outbound request. Check its host against
      an allowlist before the request is made.
    pattern-sources:
      # Express: req.query, req.params, req.body, req.headers, req.cookies,
      # req.get(...); Next.js: request.nextUrl.searchParams, request.json(),
      # request.formData(), request.headers. A request named req or request.
      - patterns:
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.params
              - pattern: $R.body
              - pattern: $R.headers
              - pattern: $R.cookies
              - pattern: $R.get(...)
              - pattern: $R.header(...)
              - pattern: $R.nextUrl.searchParams
              - pattern: $R.json()
              - pattern: $R.formData()
              - pattern: $R.text()
          - metavariable-regex:
              metavariable: $R
              regex: ^(req|request)$
      # NestJS: a parameter bound by @Query(), @Param(), @Body() or @Headers().
      - patterns:
          - pattern-either:
              - pattern-inside: function $F(..., @Query(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Param(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Body(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Headers(...) $P, ...) { ... }
          - pattern: $P
      # NestJS: the request bound by @Req(), under any name.
      - patterns:
          - pattern-inside: function $F(..., @Req(...) $R, ...) { ... }
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.params
              - pattern: $R.body
              - pattern: $R.headers
              - pattern: $R.cookies
              - pattern: $R.get(...)
              - pattern: $R.header(...)
      # Next.js App Router: the request of a route handler, under any name,
      # and the params of its context argument.
      - patterns:
          - pattern-inside: function $M($R, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
          - pattern-either:
              - pattern: $R.nextUrl.searchParams
              - pattern: $R.json()
              - pattern: $R.formData()
              - pattern: $R.text()
              - pattern: $R.headers
      - patterns:
          - pattern-inside: function $M($R, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
          - pattern-either:
              - pattern: $CTX.params
              - pattern: params
      # `const { a, b } = (await request.json()) as T`: Semgrep 1.141.0 loses
      # the binding of a name destructured from a type-asserted value when the
      # type literal declares the same name, so the names are matched by text.
      - patterns:
          - pattern-inside: |
              const {..., $V, ...} = $E as $T;
              ...
          - metavariable-pattern:
              metavariable: $E
              patterns:
                - pattern-either:
                    - pattern: $R.query
                    - pattern: $R.params
                    - pattern: $R.body
                    - pattern: $R.headers
                    - pattern: $R.cookies
                    - pattern: $R.get(...)
                    - pattern: $R.header(...)
                    - pattern: $R.nextUrl.searchParams
                    - pattern: $R.json()
                    - pattern: $R.formData()
                    - pattern: $R.text()
                - metavariable-regex:
                    metavariable: $R
                    regex: ^(req|request)$
          - pattern: $W
          - metavariable-comparison:
              comparison: str($V) == str($W)
    pattern-sanitizers:
      # A host allowlist that rejects: if (!ALLOWED.has(<host>)) return|throw.
      # The host is read off a URL object, off new URL(string), or destructured
      # from new URL(string); afterwards the URL object and the string it
      # parsed are both clean. A denylist (no `!`) or a check whose body does
      # not leave cleans nothing. Inside if (ALLOWED.has(<host>)) { ... } the
      # value is clean as well.
      - patterns:
          - pattern-inside: |
              if (<... !$ALLOW.$HAS($U.$PART) ...>) $BODY
              ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - metavariable-regex:
              metavariable: $HAS
              regex: ^(has|includes)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(hostname|host|origin)$
          - pattern: $U
      - patterns:
          - pattern-inside: |
              if (<... !$ALLOW.$HAS(new URL($U, ...).$PART) ...>) $BODY
              ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - metavariable-regex:
              metavariable: $HAS
              regex: ^(has|includes)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(hostname|host|origin)$
          - pattern: $U
      - patterns:
          - pattern-inside: |
              $OBJ = new URL($U, ...);
              ...
              if (<... !$ALLOW.$HAS($OBJ.$PART) ...>) $BODY
              ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - metavariable-regex:
              metavariable: $HAS
              regex: ^(has|includes)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(hostname|host|origin)$
          - pattern: $U
      - patterns:
          - pattern-inside: |
              const {..., $PART, ...} = new URL($U, ...);
              ...
              if (<... !$ALLOW.$HAS($PART) ...>) $BODY
              ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - metavariable-regex:
              metavariable: $HAS
              regex: ^(has|includes)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(hostname|host|origin)$
          - pattern: $U
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if ($ALLOW.$HAS($U.$PART)) $BODY
              - pattern-inside: |
                  if ($ALLOW.$HAS(new URL($U, ...).$PART)) $BODY
          - metavariable-regex:
              metavariable: $HAS
              regex: ^(has|includes)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(hostname|host|origin)$
          - pattern: $U
      # A URL built from a literal that already fixes the scheme and host, or
      # a same-site path segment, wherever it is built: inline, or in a
      # variable first. '/' + next does not ('/' + '/evil.com' leaves the site),
      # nor does `https://host${path}` (path may be @evil.com).
      - patterns:
          - pattern: $URL_FIXED
          - metavariable-regex:
              metavariable: $URL_FIXED
              regex: ^[`'"]((https?:)?//[^/`'"$]+)?/[^/`'"$]
          - metavariable-pattern:
              metavariable: $URL_FIXED
              pattern-either:
                - pattern: '`...`'
                - pattern: $URL_L + $URL_R
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'fetch($U, ...)'
              - pattern: 'axios($U, ...)'
              - pattern: 'got($U, ...)'
          - pattern-not: '$F({...}, ...)'
          - pattern-not: '$C.$M({...}, ...)'
          - metavariable-pattern:
              metavariable: $U
              pattern-either:
                - pattern: '`${$HEAD}...`'
                - patterns:
                    - pattern-either:
                        - pattern: $HEAD + $URL_A
                        - pattern: $HEAD + $URL_A + $URL_B
                        - pattern: $HEAD + $URL_A + $URL_B + $URL_C
                        - pattern: $HEAD + $URL_A + $URL_B + $URL_C + $URL_D
                    - metavariable-pattern:
                        metavariable: $HEAD
                        patterns:
                          - pattern-not: $URL_L + $URL_R
                          - pattern: $HEAD
          - focus-metavariable: $HEAD
      - patterns:
          - pattern-either:
              - pattern: 'fetch($U, ...)'
              - pattern: 'axios($U, ...)'
              - pattern: 'got($U, ...)'
          - pattern-not: '$F({...}, ...)'
          - pattern-not: '$C.$M({...}, ...)'
          - metavariable-pattern:
              metavariable: $U
              patterns:
                - pattern: $URL_WHOLE
                - pattern-not-inside: $URL_L + $URL_R
                - pattern-not-inside: '`${$URL_H}...`'
          - metavariable-regex:
              metavariable: $U
              regex: ^(?!\s*[`'"]((https?:)?//[^/`'"$]+)?/[^/`'"$])
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: 'fetch($U, ...)'
              - pattern: 'axios($U, ...)'
              - pattern: 'got($U, ...)'
          - pattern-not: '$F({...}, ...)'
          - pattern-not: '$C.$M({...}, ...)'
          - metavariable-regex:
              metavariable: $U
              regex: ^\s*['"]
          - metavariable-pattern:
              metavariable: $U
              pattern: $URL_L + $URL_R
          - metavariable-regex:
              metavariable: $U
              regex: ^(?!\s*[`'"]((https?:)?//[^/`'"$]+)?/[^/`'"$])
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: '$CLIENT.$VERB($U, ...)'
          - pattern-not: '$F({...}, ...)'
          - pattern-not: '$C.$M({...}, ...)'
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^(axios|got|ky|superagent|needle|http|https|undici)$
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(get|post|put|patch|delete|head|options|request|stream|fetch)$
