      category: injection
      cwe: CWE-601
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Redirect to a URL taken from request input.
      fendix_remediation: >-
        Request input chooses where the response redirects, so a link to this site
        can send a visitor on to a phishing page that inherits the site's trust.
        Redirect only to same-site paths (the target starts with / and not with //),
        or parse the URL and check its host against an allowlist; fall back to a
        fixed page otherwise.
      fendix_reachability: taint

  - id: js-open-redirect-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A function's parameter is the target of a redirect. If a caller passes
      request input, it is an open redirect; allow only same-site paths.
    patterns:
      - pattern-either:
          - pattern-inside: function $F(..., $P, ...) { ... }
          - pattern-inside: (..., $P, ...) => $BODY
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $RES.redirect($P)
                  - pattern: $RES.redirect($STATUS, $P)
                  - pattern: $RES.location($P)
              - metavariable-regex:
                  metavariable: $RES
                  regex: ^(res|resp|response|reply)$
          - pattern: NextResponse.redirect($P, ...)
          - pattern: NextResponse.redirect(new URL($P, ...), ...)
          - pattern: Response.redirect($P, ...)
          - pattern: Response.redirect(new URL($P, ...), ...)
          - patterns:
              - pattern-either:
                  - pattern: '$RES.writeHead($STATUS, {..., $LOC: $P, ...}, ...)'
                  - pattern: $RES.setHeader($LOC, $P)
                  - pattern: 'new Response($BODY, {..., headers: {..., $LOC: $P, ...}, ...})'
                  - pattern: 'new NextResponse($BODY, {..., headers: {..., $LOC: $P, ...}, ...})'
              - metavariable-regex:
                  metavariable: $LOC
                  regex: (?i)^['"]?location['"]?$
      # The same-site check the taint rule accepts: both halves, and a body
      # that returns or throws.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    if (<... !$P.startsWith("/") || $P.startsWith("//") ...>) $BODY
                    ...
                - pattern: |
                    if (<... $P.startsWith("//") || !$P.startsWith("/") ...>) $BODY
                    ...
            - metavariable-pattern:
                metavariable: $BODY
                pattern-either:
                  - pattern: return ...;
                  - pattern: throw $ERR;
      - pattern-not-inside: |
          const $P = "...";
          ...
      - pattern-not: $RES.redirect("...")
    metadata:
      category: injection
      cwe: CWE-601
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Redirect to a URL taken from a function parameter.
      fendix_remediation: >-
        This function redirects to its parameter. If any caller passes request
        input, a link to this site can send a visitor on to a phishing page.
        Redirect only to same-site paths (the target starts with / and not with //),
        or check the host against an allowlist; fall back to a fixed page otherwise.
