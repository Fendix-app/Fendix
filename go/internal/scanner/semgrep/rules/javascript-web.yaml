  - id: js-path-traversal-taint
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request input reaches a file path that is read or sent. Resolve the path and
      check that it stays under the base directory, or keep only its base name.
    pattern-sources:
      # Express: req.query, req.params, req.body, req.headers, req.cookies,
      # req.get(...); Next.js: request.nextUrl.searchParams, request.json(),
      # request.formData(), request.headers. A request named req or request.
      - patterns:
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.params
              - pattern: $R.body
              - pattern: $R.headers
              - pattern: $R.cookies
              - pattern: $R.get(...)
              - pattern: $R.header(...)
              - pattern: $R.nextUrl.searchParams
              - pattern: $R.json()
              - pattern: $R.formData()
              - pattern: $R.text()
          - metavariable-regex:
              metavariable: $R
              regex: ^(req|request)$
      # NestJS: a parameter bound by @Query(), @Param(), @Body() or @Headers().
      - patterns:
          - pattern-either:
              - pattern-inside: function $F(..., @Query(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Param(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Body(...) $P, ...) { ... }
              - pattern-inside: function $F(..., @Headers(...) $P, ...) { ... }
          - pattern: $P
      # NestJS: the request bound by @Req(), under any name.
      - patterns:
          - pattern-inside: function $F(..., @Req(...) $R, ...) { ... }
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.params
              - pattern: $R.body
              - pattern: $R.headers
              - pattern: $R.cookies
              - pattern: $R.get(...)
              - pattern: $R.header(...)
      # Next.js App Router: the request of a route handler, under any name,
      # and the params of its context argument.
      - patterns:
          - pattern-inside: function $M($R, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
          - pattern-either:
              - pattern: $R.nextUrl.searchParams
              - pattern: $R.json()
              - pattern: $R.formData()
              - pattern: $R.text()
              - pattern: $R.headers
      - patterns:
          - pattern-inside: function $M($R, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
          - pattern-either:
              - pattern: $CTX.params
              - pattern: params
      # `const { a, b } = (await request.json()) as T`: Semgrep 1.141.0 loses
      # the binding of a name destructured from a type-asserted value when the
      # type literal declares the same name, so the names are matched by text.
      - patterns:
          - pattern-inside: |
              const {..., $V, ...} = $E as $T;
              ...
          - metavariable-pattern:
              metavariable: $E
              patterns:
                - pattern-either:
                    - pattern: $R.query
                    - pattern: $R.params
                    - pattern: $R.body
                    - pattern: $R.headers
                    - pattern: $R.cookies
                    - pattern: $R.get(...)
                    - pattern: $R.header(...)
                    - pattern: $R.nextUrl.searchParams
                    - pattern: $R.json()
                    - pattern: $R.formData()
                    - pattern: $R.text()
                - metavariable-regex:
                    metavariable: $R
                    regex: ^(req|request)$
          - pattern: $W
          - metavariable-comparison:
              comparison: str($V) == str($W)
    pattern-sanitizers:
      - pattern: path.basename(...)
      # Containment that rejects: if (!p.startsWith(BASE + path.sep)) return|
      # throw, or the relative path from the base climbs out or is absolute
      # (another drive on Windows). A bare startsWith(BASE) still admits
      # /srv/base_evil/x (Review Focus 5), and a check whose body does not
      # leave cleans nothing. Inside if (p.startsWith(BASE + path.sep)) { ... }
      # the path is clean as well.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if (<... !$P.startsWith($BASE + $PATH.sep) ...>) $BODY
                  ...
              - pattern-inside: |
                  if (<... !$P.startsWith($BASE + "/") ...>) $BODY
                  ...
              - pattern-inside: |
                  if (<... !$P.startsWith(`${$BASE}${$PATH.sep}`) ...>) $BODY
                  ...
              - pattern-inside: |
                  if (<... !$P.startsWith(`${$BASE}/`) ...>) $BODY
                  ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - pattern: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if ($P.startsWith($BASE + $PATH.sep)) $BODY
              - pattern-inside: |
                  if ($P.startsWith($BASE + "/")) $BODY
          - pattern: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $REL = path.relative($BASE, $P);
                  ...
                  if (<... $REL.startsWith("..") || path.isAbsolute($REL) ...>) $BODY
                  ...
              - pattern-inside: |
                  $REL = path.relative($BASE, $P);
                  ...
                  if (<... path.isAbsolute($REL) || $REL.startsWith("..") ...>) $BODY
                  ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - pattern: $P
      - pattern-either:
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Math.floor(...)
          - pattern: Math.round(...)
          - pattern: Boolean(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.$READ($P, ...)
              - pattern: $FS.promises.$READ($P, ...)
              - pattern: $READ($P, ...)
          - metavariable-regex:
              metavariable: $READ
              regex: ^(readFile|readFileSync|createReadStream)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $RES.sendFile($P, ...)
              - pattern: $RES.download($P, ...)
          # With root, Express's send resolves the path under it and rejects
          # one that leaves it.
          - pattern-not: '$RES.sendFile($P, {..., root: $ROOT, ...}, ...)'
          - pattern-not: '$RES.download($P, {..., root: $ROOT, ...}, ...)'
          - pattern-not: '$RES.download($P, $NAME, {..., root: $ROOT, ...}, ...)'
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply)$
          - focus-metavariable: $P
    metadata:
      category: injection
      cwe: CWE-22
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        File path built from request input.
      fendix_remediation: >-
        Request input reaches the path of a file the server reads or sends
        (fs.readFile, fs.createReadStream, res.sendFile), so ../ segments or an
        absolute path can reach any file the process can read. Resolve the path with
        path.resolve and check that it starts with the base directory plus path.sep
        before using it, or keep only path.basename of the input.
      fendix_reachability: taint

  - id: js-xss-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A function's parameter is written into HTML markup unescaped. If a caller
      passes request input, it is cross-site scripting; escape the value for HTML.
    patterns:
      - pattern-either:
          - pattern-inside: function $F(..., $P, ...) { ... }
          - pattern-inside: (..., $P, ...) => $BODY
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $RES.send($X)
                  - pattern: $RES.write($X, ...)
                  - pattern: $RES.end($X, ...)
                  - pattern: $RES.status($CODE).send($X)
              - metavariable-regex:
                  metavariable: $RES
                  regex: ^(res|resp|response|reply)$
          - patterns:
              - pattern-either:
                  - pattern: 'new Response($X, {..., headers: {..., $KEY: $TYPE, ...}, ...})'
                  - pattern: 'new NextResponse($X, {..., headers: {..., $KEY: $TYPE, ...}, ...})'
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?content-type['"]?$
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: (?i)^.*html
      # Markup built around the parameter itself, not around an escaped copy.
      - metavariable-regex:
          metavariable: $X
          regex: (?s)^.*<[A-Za-z!/][^<>]*>
      - metavariable-pattern:
          metavariable: $X
          pattern-either:
            - pattern: '`...${$P}...`'
            - pattern: $A + $P
            - pattern: $P + $A
      - pattern-not-inside: |
          const $P = "...";
          ...
      - pattern-not: $RES.send("...")
    metadata:
      category: xss
      cwe: CWE-79
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Function parameter written into an HTML response unescaped.
      fendix_remediation: >-
        This function writes its parameter into the markup of an HTML response as-
        is. If any caller passes request input, markup or a script in it runs in the
        visitor's browser. Escape the value for HTML before it is written (escape-
        html, he.encode), or render the page with an autoescaping template.

