      # AND not with "//" (https://evil.com fails the first, //evil.com the
      # second). As a guard whose body returns or throws, every later use is
      # clean; bound to a name, the ternary isLocal ? target : "/" is clean.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if (<... !$U.startsWith("/") || $U.startsWith("//") ...>) $BODY
                  ...
              - pattern-inside: |
                  if (<... $U.startsWith("//") || !$U.startsWith("/") ...>) $BODY
                  ...
          - metavariable-pattern:
              metavariable: $BODY
              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - pattern: $U
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $OK = <... $U.startsWith("/") && !$U.startsWith("//") ...>;
