              pattern-either:
                - pattern: return ...;
                - pattern: throw $ERR;
          - metavariable-regex:
              metavariable: $HAS
              regex: ^(has|includes)$
          - metavariable-regex:
              metavariable: $PART
              regex: ^(hostname|host|origin)$
          - pattern: $U
