  # A string parameter named like a password hashed with MD5 or SHA-1.
  - id: go-weak-password-hash-sink
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: WARNING
    message: >-
      Password parameter hashed with MD5 or SHA-1: use bcrypt, argon2id or scrypt.
    metadata:
      category: crypto
      cwe: [CWE-916, CWE-328]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Password parameter hashed with MD5 or SHA-1.
      fendix_remediation: >-
        A parameter named like a password is hashed with MD5 or SHA-1, fast and unsalted hashes. Hash passwords with bcrypt, argon2id or scrypt.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      - metavariable-regex:
          metavariable: $PARAM
          regex: (?i).*(passw|pwd|passphrase)
      - pattern-either:
          - pattern: md5.Sum(<... $PARAM ...>)
          - pattern: sha1.Sum(<... $PARAM ...>)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $HASH := md5.New()
                      ...
                  - pattern-inside: |
                      $HASH := sha1.New()
                      ...
              - pattern-either:
                  - pattern: $HASH.Write(<... $PARAM ...>)
                  - pattern: io.WriteString($HASH, <... $PARAM ...>)
      - pattern-not: md5.Sum([]byte("..."))
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
