    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      - pattern-either:
          - pattern-inside: |
              $TOKEN, $PARTS, $ERR := $PARSER.ParseUnverified($PARAM, ...)
              ...
              <... $TOKEN.Claims ...>
          - pattern-inside: |
              $CLAIMS := $INIT
              ...
              $PARSER.ParseUnverified($PARAM, $CLAIMS)
              ...
              <... $CLAIMS ...>
          - pattern-inside: |
              $CLAIMS := $INIT
              ...
              $PARSER.ParseUnverified($PARAM, &$CLAIMS)
              ...
              <... $CLAIMS ...>
      - pattern-not-inside: |
          $PARSER.ParseUnverified($PARAM, ...)
          ...
          $VERIFIER.Parse($PARAM, ...)
      - pattern-not-inside: |
          $PARSER.ParseUnverified($PARAM, ...)
          ...
          $VERIFIER.ParseWithClaims($PARAM, ...)
      - pattern: $PARSER.ParseUnverified($PARAM, ...)
      - pattern-not: $PARSER.ParseUnverified("...", ...)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
  # Security token from math/rand (Go). A pattern rule: math/rand output
  # assigned to a variable named like a secret, or returned or written byte by
  # byte in a function named like one. There is no request source, so it
  # never claims reachability.
  - id: go-weak-random-token
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: ERROR
    message: >-
      Security token generated with math/rand: use crypto/rand.
    metadata:
      category: crypto
      cwe: [CWE-338]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        Security token generated with math/rand.
      fendix_remediation: >-
        math/rand is a predictable generator: its outputs can be recovered from a few samples or its seed. Generate tokens, session ids and reset codes with crypto/rand, for example rand.Text() or rand.Read into a byte slice.
    patterns:
      # The file uses math/rand (under any name: Semgrep resolves the alias, so
      # mrand.Intn matches rand.Intn). crypto/rand shares only Read and the
      # two-argument Int with it; those are left out in a file that also imports
      # crypto/rand, and the two-argument Int everywhere.
      - pattern-either:
          - pattern-inside: |
              import "math/rand"
              ...
          - pattern-inside: |
              import "math/rand/v2"
              ...
      - pattern-not: $NAME := <... rand.Int($READER, $MAX) ...>
      - pattern-not: $NAME = <... rand.Int($READER, $MAX) ...>
      - pattern-not: return <... rand.Int($READER, $MAX) ...>
      - pattern-either:
          # Assigned to a variable or field named like a secret.
          - patterns:
              - pattern-either:
                  - pattern: $NAME := <... rand.$FN(...) ...>
                  - pattern: $NAME = <... rand.$FN(...) ...>
                  - pattern: var $NAME = <... rand.$FN(...) ...>
                  - pattern: var $NAME $TYPE = <... rand.$FN(...) ...>
                  - pattern: $OBJ.$NAME = <... rand.$FN(...) ...>
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(?:(?:token|secret|nonce|salt|otp|csrf|xsrf|apiKey|password|passwd|passcode|session|Token|Secret|Nonce|Salt|Otp|Csrf|Xsrf|ApiKey|Password|Passwd|Passcode|Session|APIKey|TOKEN|SECRET|NONCE|SALT|OTP|CSRF|XSRF|APIKEY|PASSWORD|PASSWD|PASSCODE|SESSION|API_KEY)|.*_(?:token|secret|nonce|salt|otp|csrf|xsrf|apiKey|password|passwd|passcode|session|Token|Secret|Nonce|Salt|Otp|Csrf|Xsrf|ApiKey|Password|Passwd|Passcode|Session|APIKey|TOKEN|SECRET|NONCE|SALT|OTP|CSRF|XSRF|APIKEY|PASSWORD|PASSWD|PASSCODE|SESSION|API_KEY)|.*[A-Za-z0-9](?:Token|Secret|Nonce|Salt|Otp|Csrf|Xsrf|ApiKey|Password|Passwd|Passcode|Session|APIKey|TOKEN|SECRET|NONCE|SALT|OTP|CSRF|XSRF|APIKEY|PASSWORD|PASSWD|PASSCODE|SESSION|API_KEY))(?:ID|Id|Key|Code|Hash|Value|String|Str|Bytes)?s?$
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(Int|Intn|IntN|Int31|Int31n|Int32|Int32N|Int63|Int63n|Int64|Int64N|Uint|UintN|Uint32|Uint32N|Uint64|Uint64N|Float32|Float64|N|Perm)$
          # Inside a function named like a secret: the value it returns, the
          # bytes it fills one by one, or a buffer filled with math/rand's Read.
          - patterns:
              - pattern-inside: |
                  func $FUNC(...) {
                    ...
                  }
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(?:(?:token|secret|nonce|salt|otp|csrf|xsrf|apiKey|password|passwd|passcode|session|Token|Secret|Nonce|Salt|Otp|Csrf|Xsrf|ApiKey|Password|Passwd|Passcode|Session|APIKey|TOKEN|SECRET|NONCE|SALT|OTP|CSRF|XSRF|APIKEY|PASSWORD|PASSWD|PASSCODE|SESSION|API_KEY)|.*_(?:token|secret|nonce|salt|otp|csrf|xsrf|apiKey|password|passwd|passcode|session|Token|Secret|Nonce|Salt|Otp|Csrf|Xsrf|ApiKey|Password|Passwd|Passcode|Session|APIKey|TOKEN|SECRET|NONCE|SALT|OTP|CSRF|XSRF|APIKEY|PASSWORD|PASSWD|PASSCODE|SESSION|API_KEY)|.*[A-Za-z0-9](?:Token|Secret|Nonce|Salt|Otp|Csrf|Xsrf|ApiKey|Password|Passwd|Passcode|Session|APIKey|TOKEN|SECRET|NONCE|SALT|OTP|CSRF|XSRF|APIKEY|PASSWORD|PASSWD|PASSCODE|SESSION|API_KEY))(?:ID|Id|Key|Code|Hash|Value|String|Str|Bytes)?s?$
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern: return <... rand.$FN(...) ...>
                          - pattern: $BUF[$I] = <... rand.$FN(...) ...>
                      - metavariable-regex:
                          metavariable: $FN
                          regex: ^(Int|Intn|IntN|Int31|Int31n|Int32|Int32N|Int63|Int63n|Int64|Int64N|Uint|UintN|Uint32|Uint32N|Uint64|Uint64N|Float32|Float64|N|Perm)$
                  - patterns:
                      - pattern: rand.Read($BUF)
                      - pattern-not-inside: |
                          import "crypto/rand"
                          ...
