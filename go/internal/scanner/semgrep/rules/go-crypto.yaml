    metadata:
      category: auth
      cwe: [CWE-347]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        JWT from the request trusted without verifying its signature.
      fendix_remediation: >-
        ParseUnverified decodes a token without checking its signature, so its claims are whatever the caller wrote. Verify it with jwt.Parse or jwt.ParseWithClaims, a key function and jwt.WithValidMethods; read only the header (for example kid) from an unverified token.
