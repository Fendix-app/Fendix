rules:
  # Rule 1: SQL injection via string formatting / concatenation
  # The alternatives must sit under pattern-either: as sibling `pattern:` entries
  # of `patterns:` Semgrep ANDs them, so the rule could never match (v3.6.3).
  # The f-string alternative fires only on an interpolation that Semgrep's
  # flow-sensitive constant propagation cannot resolve to a string literal, so
  # a module or local string constant is not reported. Input beside it, and a
  # rebinding or a parameter that shadows it, still are. A rule-level
  # `pattern-not-inside: $VAR = "..." ...` would also hide the other
  # alternatives and a local rebound from input (v3.7.0).
  - id: python-sql-injection-string-format
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute("..." % ..., ...)
          - pattern: $CURSOR.execute("..." + ..., ...)
          - patterns:
              - pattern: $CURSOR.execute(f"...{$VAR}...", ...)
              - metavariable-pattern:
                  metavariable: $VAR
                  patterns:
                    - pattern: $PART
                    - pattern-not: '"..."'
          - pattern: $CURSOR.execute("...".format(...), ...)
      - pattern-not: $CURSOR.execute("..." % "...", ...)
      - pattern-not: $CURSOR.execute("..." + "...", ...)
    message: >
      SQL query built via string formatting — SQL injection risk.
      Use parameterized queries: cursor.execute("SELECT ... WHERE x = %s", (value,))
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-89
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 2: Command injection via os.system or subprocess with shell=True
  # os.system / os.popen with a non-literal command. The subprocess(..., shell=True)
  # shapes belong to python-subprocess-shell-true-with-variable; listing them here
  # as sibling `pattern:` entries ANDed every alternative, so this rule never
  # matched, and repeating them would report each such call twice (v3.6.3).
  - id: python-command-injection-shell-true
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)
    message: >
      Command execution with user-controlled input — command injection risk.
      Use subprocess.run() with a list of arguments and shell=False.
      Never pass user input directly to shell commands.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-78
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 3: eval() with potentially dynamic/user-controlled input
  # eval()/exec() with a non-literal argument. The two calls were sibling
  # `pattern:` entries, which Semgrep ANDs, so the rule never matched (v3.6.3).
  - id: python-eval-injection
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)
    message: >
      eval()/exec() with dynamic argument — code injection risk.
      Avoid eval/exec entirely. If required, validate input strictly
      against an allowlist before execution.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-95
      confidence: MEDIUM
      fendix_severity: CRITICAL

  # Rule 4 (Sprint 18): Django ORM raw SQL — Model.objects.raw(<non-literal>)
  # and QuerySet.extra(where=[<non-literal>]). FP class: hand-rolled but safe
  # raw queries where the variable is a hardcoded string assembled at import
  # time will be flagged. FN class: the `objects` manager renamed to something
  # else won't match. The rule deliberately doesn't try to follow taint —
  # presence of raw SQL with a variable argument is enough signal for a
  # human review.
  - id: django-orm-raw-sql
    patterns:
      - pattern-either:
          - pattern: $MODEL.objects.raw($Q)
          - pattern: $QS.extra(where=$WHERE, ...)
          - pattern: $QS.extra(where=$WHERE)
      - pattern-not: $MODEL.objects.raw("...")
      - pattern-not: $QS.extra(where=["..."])
      - pattern-not: $QS.extra(where=["...", "..."])
    message: >
      Django ORM raw SQL with a non-literal argument — SQL injection risk.
      Pass user input as params, never interpolate into the query string.
      Prefer Django's ORM filter() expressions when possible.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-89
      confidence: MEDIUM
      fendix_severity: HIGH

  # Rule 5 (Sprint 18): Flask render_template_string with a non-literal
  # template — server-side template injection (SSTI) surface. FP class: if
  # the variable is built from a constants module the rule still fires.
  # FN class: re-assigning request input to a literal-shaped variable name
  # would escape the rule (e.g. `template = "{{ user }}"; render_template_string(template)`
  # — but the literal shape itself is the safe pattern).
  - id: flask-render-template-string-injection
    patterns:
      - pattern: render_template_string($TPL, ...)
      - pattern-not: render_template_string("...", ...)
      - pattern-not: render_template_string("...")
    message: >
      render_template_string() called with a non-literal template —
      server-side template injection (SSTI) risk. Use render_template()
      with a static .html file; never compose Jinja source from user input.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-94
      confidence: MEDIUM
      fendix_severity: HIGH

  # Rule 6 (Sprint 18): subprocess called with shell=True AND a non-literal
  # first argument. The existing rule 2 (python-command-injection-shell-true)
  # also fires on shell=True, but it triggers on every shell=True call
  # regardless of whether the command string is a literal or user-derived.
  # This rule is the high-precision variant: only fire when shell=True AND
  # the command is a variable / expression / f-string. FP class: when the
  # variable holds a literal string built at import time, still flagged.
  # FN class: shell=True with a literal command (caught by rule 2's broader
  # pattern at WARNING/MEDIUM).
  - id: python-subprocess-shell-true-with-variable
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, shell=True, ...)
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: subprocess.check_call($CMD, shell=True, ...)
          - pattern: subprocess.check_output($CMD, shell=True, ...)
          - pattern: subprocess.Popen($CMD, shell=True, ...)
      - pattern-not: subprocess.run("...", shell=True, ...)
      - pattern-not: subprocess.call("...", shell=True, ...)
      - pattern-not: subprocess.check_call("...", shell=True, ...)
      - pattern-not: subprocess.check_output("...", shell=True, ...)
      - pattern-not: subprocess.Popen("...", shell=True, ...)
    message: >
      subprocess with shell=True and a non-literal command — command
      injection risk. Drop shell=True and pass argv as a list, OR
      shlex.quote() each interpolated argument if shell semantics are
      truly required.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-78
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 7 (Sprint 18): pickle.loads on a non-literal argument — arbitrary
  # code execution on deserialization. The rule's confidence is MEDIUM
  # because the call site alone doesn't prove the bytes come from an
  # untrusted source. Reviewers see the rule fire, check the caller's
  # source, and either fix or suppress. FP class: pickle.loads on bytes
  # round-tripped from the same process (rare but legitimate). FN class:
  # `loads = pickle.loads; loads(data)` (aliasing).
  - id: python-pickle-loads-untrusted
    patterns:
      - pattern: pickle.loads($BYTES, ...)
      - pattern-not: pickle.loads(b"...")
      - pattern-not: pickle.loads(b"...", ...)
    message: >
      pickle.loads() on a non-literal byte string — arbitrary code
      execution on deserialization. Replace with json.loads() for
      untrusted input. If pickle is strictly required, sign the payload
      (hmac) and verify before unpickling.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-502
      confidence: MEDIUM
      fendix_severity: HIGH

  # Rule 8 (Sprint 18): yaml.load() without a SafeLoader — YAML allows
  # tag-based object instantiation that's effectively eval(). FP class:
  # if a project defines a SafeLoader subclass with a different name, the
  # rule still fires (the pattern-not only matches yaml.SafeLoader by
  # name). FN class: yaml.load_all() with no Loader argument — a separate
  # check; we keep the rule focused on the single-document path. The new
  # PyYAML default loader IS safe, but documenting yaml.load() as a
  # legacy hazard is still appropriate for codebases on older versions.
  - id: python-yaml-load-unsafe
    pattern-either:
      - pattern: yaml.load($DATA)
      - pattern: yaml.load($DATA, Loader=yaml.Loader)
      - pattern: yaml.load($DATA, Loader=yaml.FullLoader)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
    message: >
      yaml.load() without yaml.SafeLoader can execute arbitrary Python
      code via the !!python/object tag. Use yaml.safe_load() or pass
      Loader=yaml.SafeLoader explicitly.
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      cwe: CWE-502
      confidence: HIGH
      fendix_severity: HIGH
