                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $QUERY := fmt.Sprintf($FORMAT, ..., $PARAM, ...);
                    ...
