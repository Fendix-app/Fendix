                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                pq.QuoteLiteral($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                pq.QuoteIdentifier($PARAM)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                $DB, $ERR := $CONN.Prepare(...)
                ...
              }
              ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                $DB, $ERR := $CONN.PrepareContext(...)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(QueryContext|QueryRowContext|ExecContext|PrepareContext|QueryxContext|QueryRowxContext|MustExecContext)$
          - metavariable-regex:
              metavariable: $DB
              regex: ^(?!.*(?i:stmt))
          - pattern: $HELPER($X1, $X2, $ARG, ...)
          - focus-metavariable: $ARG
  # The same sinks, for a string parameter of the enclosing function: a helper
  # whose caller (in another file, or with input the taint rule cannot follow)
  # passes request input. A shape match proves no flow; it never blocks alone.
  - id: go-sqli-sink
    languages: [go]
    # Go test code: *_test.go and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
    severity: WARNING
    message: >-
      SQL query built from a function parameter: if callers pass request input, this is SQL injection. Use a placeholder.
    metadata:
      category: injection
      cwe: [CWE-89]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        SQL query built from a function parameter.
      fendix_remediation: >-
        The query string is formatted or concatenated from a parameter. If a caller passes request input, this is SQL injection. Pass the value as a query argument with a placeholder.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      # The parameter itself is formatted or concatenated into a query that reads
      # like SQL, in the call or in a variable the call runs. A wrapper that runs
      # a query its caller passes whole builds nothing, and a parameter passed
      # through a quoting function first is not the raw input.
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $DB.$METHOD(fmt.Sprintf($FORMAT, ..., $PARAM, ...), ...)
                  - pattern: $DB.$METHOD(<... $LEFT + $PARAM ...>, ...)
                  - pattern: $DB.$METHOD(<... $PARAM + $RIGHT ...>, ...)
              - pattern: $DB.$METHOD($QUERY, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(Query|QueryRow|Exec|Prepare|Queryx|QueryRowx|MustExec|Raw)$
          - patterns:
              - pattern-either:
                  - pattern: $DB.$METHOD($CTX, fmt.Sprintf($FORMAT, ..., $PARAM, ...), ...)
                  - pattern: $DB.$METHOD($CTX, <... $LEFT + $PARAM ...>, ...)
                  - pattern: $DB.$METHOD($CTX, <... $PARAM + $RIGHT ...>, ...)
              - pattern: $DB.$METHOD($CTX, $QUERY, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(QueryContext|QueryRowContext|ExecContext|PrepareContext|QueryxContext|QueryRowxContext|MustExecContext)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $VAR := fmt.Sprintf($FORMAT, ..., $PARAM, ...);
                      ...
                  - pattern-inside: |
                      $VAR := <... $LEFT + $PARAM ...>;
                      ...
                  - pattern-inside: |
                      $VAR := <... $PARAM + $RIGHT ...>;
                      ...
              - pattern-inside: |
                  $VAR := $QUERY;
                  ...
              - pattern-either:
                  - patterns:
                      - pattern: $DB.$METHOD($VAR, ...)
                      - metavariable-regex:
                          metavariable: $METHOD
                          regex: ^(Query|QueryRow|Exec|Prepare|Queryx|QueryRowx|MustExec|Raw)$
                  - patterns:
                      - pattern: $DB.$METHOD($CTX, $VAR, ...)
                      - metavariable-regex:
                          metavariable: $METHOD
                          regex: ^(QueryContext|QueryRowContext|ExecContext|PrepareContext|QueryxContext|QueryRowxContext|MustExecContext)$
      # The parameter lands in a value position (a comparison, LIKE, IN, VALUES
      # or a WHERE, ORDER BY or LIMIT clause). A table or column name formatted
      # into DDL is plumbing between internal callers, and no placeholder can
      # stand in for it.
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?is).*(=|<>|!=|<|>|\blike|\bin\s*\(|\bvalues\s*\(|\bwhere|\band|\bor|\border\s+by|\bgroup\s+by|\blimit|\boffset)\s*\(?\s*['"]?\s*(%%)*(%(\[\d+\])?[sv]|"\s*\+|`\s*\+)
      - pattern-not: '($C : *gin.Context).$ANY(...)'
      - pattern-not: '($STMT : *sql.Stmt).$ANY(...)'
      - pattern-not-inside: |
          $DB, $ERR := $CONN.Prepare(...)
          ...
      - pattern-not-inside: |
          $DB, $ERR := $CONN.PrepareContext(...)
          ...
      - metavariable-regex:
          metavariable: $DB
          regex: ^(?!.*(?i:stmt))
      - pattern-not: $DB.$METHOD("...", ...)
      - pattern-not: $DB.$METHOD($CTX, "...", ...)
      - pattern-not: $DB.$METHOD(<... pq.QuoteLiteral($PARAM) ...>, ...)
      - pattern-not: $DB.$METHOD(<... pq.QuoteIdentifier($PARAM) ...>, ...)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
  # Command injection (Go). Taint mode: request input reaching a shell's
  # command line (sh -c, bash -c, ...) or the program exec.Command runs.
  # Arguments of a fixed program are not a sink: without a shell they are
  # never parsed as a command.
  - id: go-cmdi-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
    severity: ERROR
    message: >-
      Shell command built from request input: run a fixed program without a shell and pass the input as an argument.
    metadata:
      category: injection
      cwe: [CWE-78]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        Shell command built from request input.
      fendix_remediation: >-
        Request input reaches a shell command line or the name of the program exec.Command runs. Run a fixed program and pass the input as its own argument, without a shell: exec.Command("ping", "-c", "1", host).
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
    pattern-sanitizers:
      # A qualified or method call's result is not request input: see the pack
      # header. A bare call (a function of this package, a builtin, a
      # conversion) keeps its arguments' taint, as Semgrep's default; that is
      # what lets the helper sinks below follow a call into this file.
      - exact: true
        patterns:
          - pattern: $RECEIVER.$FUNC(...)
          # Sources.
          - pattern-not: $R.URL.Query()
          - pattern-not: $R.URL.Query().$GET(...)
          - pattern-not: $R.FormValue(...)
          - pattern-not: $R.PostFormValue(...)
          - pattern-not: $R.PathValue(...)
          - pattern-not: $R.Header.Get(...)
          - pattern-not: $R.Header.Values(...)
          - pattern-not: $R.Form.Get(...)
          - pattern-not: $R.PostForm.Get(...)
          - pattern-not: '($R : *http.Request).Cookie(...)'
          - pattern-not: mux.Vars(...)
          - pattern-not: chi.URLParam(...)
          - pattern-not: '($C : *gin.Context).$GIN(...)'
          - pattern-not-inside: |
              $VALUES := $R.URL.Query()
              ...
              $VALUES.Get(...)
          # Calls that hand their input back.
          - pattern-not: fmt.Sprintf(...)
          - pattern-not: fmt.Sprint(...)
          - pattern-not: fmt.Sprintln(...)
          - pattern-not: strings.$STRINGS(...)
          - pattern-not: bytes.$BYTES(...)
          - pattern-not: filepath.$FILEPATH(...)
          - pattern-not: path.$PATH(...)
          - pattern-not: url.$URL(...)
          - pattern-not: html.UnescapeString(...)
          - pattern-not: strconv.Unquote(...)
          - pattern-not: string(...)
          - pattern-not: '[]byte(...)'
          - pattern-not: '[]rune(...)'
          - pattern-not: append(...)
          - pattern-not: $VALUE.String()
          - pattern-not: $VALUE.Bytes()
          - pattern-not: $VALUE.Query()
          - pattern-not: $VALUE.Hostname()
          - pattern-not: $CODEC.DecodeString(...)
          - pattern-not: $CODEC.Unescape(...)
          - pattern-not: $CODEC.UnescapeString(...)
          - pattern-not: $CODEC.QueryUnescape(...)
          - pattern-not: $CODEC.PathUnescape(...)
          - pattern-not: $CODEC.Unquote(...)
          - pattern-not: io.ReadAll(...)
          - pattern-not: ioutil.ReadAll(...)
          - pattern-not: json.NewDecoder(...)
          - pattern-not: $DECODER.Decode(...)
          - pattern-not: json.Unmarshal(...)
          # A call that takes a function literal (router.GET(path, func(c
          # *gin.Context) { ... })): its range holds the literal's body, and Semgrep
          # does not judge the calls inside a sanitized range one by one.
          - pattern-not: $OUTER(..., <... func(...) { ... } ...>, ...)
          # This rule's sinks.
          - pattern-not: exec.Command(...)
          - pattern-not: exec.CommandContext(...)
          - pattern-not: syscall.Exec(...)
          - pattern-not: os.StartProcess(...)

      # A value parsed as a number, a boolean or a UUID carries no syntax.
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      - pattern: uuid.Parse(...)
      - pattern: uuid.MustParse(...)
      # A number formatted back into a string is digits only.
      - pattern: strconv.Itoa(...)
      - pattern: strconv.FormatInt(...)
      - pattern: strconv.FormatUint(...)
      - pattern: strconv.FormatFloat(...)
      - pattern: strconv.FormatBool(...)

      # Quoted for the shell.
      - pattern: shellescape.Quote(...)
      - pattern: shellescape.QuoteCommand(...)
    pattern-sinks:
      # A shell's command line (sh -c, bash -c, cmd /c, ...).
      - patterns:
          - pattern-either:
              - pattern: exec.Command($SHELL, $FLAG, $CMD, ...)
              - pattern: exec.CommandContext($CTX, $SHELL, $FLAG, $CMD, ...)
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-[a-z]*c|/c|/C|-Command)"$
          - focus-metavariable: $CMD
      # The program itself.
      - patterns:
          - pattern-either:
              - pattern: exec.Command($NAME, ...)
              - pattern: exec.CommandContext($CTX, $NAME, ...)
              - pattern: syscall.Exec($NAME, ...)
              - pattern: os.StartProcess($NAME, ...)
          - focus-metavariable: $NAME
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    exec.Command($SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                shellescape.Quote($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-[a-z]*c|/c|/C|-Command)"$
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
