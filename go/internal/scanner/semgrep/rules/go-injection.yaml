# Go (net/http, Gin) injection rules: SQL, OS command and template injection.
#
# Written in-house for Fendix. Each class has a taint rule (<lang>-<class>-taint)
# that counts as reachability once Go clears its gate (ADR-011), and a shape
# rule (<lang>-<class>-sink) for a function parameter reaching the same sink.
# Tests: ../ruletests/go-injection.go (semgrep --test, see its README.md).
#
# Semgrep OSS taint analysis is intraprocedural, so each taint rule also
# treats as a sink a call, in the same file, to a function whose string
# parameter reaches the sink directly. The call is then the reported line.
# The argument and the parameter are paired by position (first to third),
# and only a bare call is followed: it names a package-level function, never
# a method, and Semgrep's top-level func pattern does not match a method
# either (pinned by a rule test).
#
# Taint passes through a call, as Semgrep does by default, unless the call
# sanitizer clears it. A call is clean when it is
#   - len or cap;
#   - a call to a function or method of this file whose body is visible here
#     and whose every return is constant: every return is a string literal (a
#     switch or an if over literals, matched by a regex over the body), or the
#     body looks its result up in a map of string literals and falls back to a
#     literal (a few shapes, written out; the map is declared in the function,
#     or above it at package level);
#   - a package-qualified or method call that is not a source, a call that
#     hands its input back (fmt, the strings, filepath, path and url
#     functions, decoders), a call that takes a function literal, or a call of
#     a method of this file that takes a string and returns a string: a row, a
#     cache entry or a stored file name looked up by request input is not
#     request input.
# Every other call keeps its arguments' taint: a function of another file of the
# package (its body cannot be seen), a signature or body that is not one of
# the above, and a method of this file that builds its result. A helper that
# validates its parameter and returns it (if allowed[s] { return s }) hands
# its input back, so it is not clean: a known false positive.
#
# Assigned calls. Semgrep 1.182 keeps the taint of a variable assigned from a
# call that an exact sanitizer clears ($x := f(...), x = f(...), var x = f(...)),
# where 1.141 cleared it. Each call sanitizer therefore also matches the
# assignment: the constant-helper shapes and len and cap list the assignment
# forms next to the call, and the qualified-call sanitizer has a second entry
# for the assignment (its call conditions run in a metavariable-pattern, on
# the call bound by a second list of the forms; the file conditions are
# repeated on the assignment). Do not drop "exact: true" instead: a sanitizer
# that is not exact also clears a sink inside its range, such as
# exec.Command(...).Run(). Rule tests: sqliAssignedHelpers and
# (*guardServer).assigned in ../ruletests/go-injection.guards.go,
# assignedLookups in ../ruletests/go-web.guards.go.
#
# Cost note. Semgrep joins the results of a file-spanning pattern with the
# calls of the file, so a pattern that has a result for every function or
# method of the file is quadratic in the file's size (150 s for the 1,400
# methods of a generated 17,000-line file), and a pattern that spans the file
# with a trailing "..." (or $...REST) has a result for each alignment of the
# tail. The helper patterns therefore (1) have a leading "..." only (package
#  ... helper), which reaches a call that comes before the end of the
# helper, and a second pattern per shape that ends in a later function that
# contains the call, which reaches the calls after it; (2) carry their
# metavariable-regex inside the pattern-inside, which drops a helper that is
# not constant before the join; (3) match the lookup shapes by structure, with
# the map checked by one regex on its text, the declaration above the helper;
# and (4) match a method of this file only when it takes a string and returns
# a string. A switch with a pattern clause for each case went exponential in
# the number of cases (a 17-case switch took seconds): never list case
# clauses. Keep any new file-spanning pattern to these forms and rerun
# TestGoPackStaysLinearOnALargeHandlerFile.
rules:
  # SQL injection (Go). Taint mode: a net/http or Gin request input reaching
  # the query string of a database/sql, sqlx or GORM call, in the handler or
  # through a function of the same file. Placeholders keep the input out of
  # the query string, so they are never a sink.
  - id: go-sqli-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: ERROR
    message: >-
      SQL query built from request input: pass the value as a query argument with a placeholder instead.
    metadata:
      category: injection
      cwe: [CWE-89]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        SQL query built from request input.
      fendix_remediation: >-
        Request input is formatted or concatenated into a SQL query. Pass it as a query argument with a placeholder instead: db.Query("... WHERE name = $1", name) (or ? for MySQL and SQLite).
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).FormFile(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
    pattern-sanitizers:
      # A call's result is clean only when it is a constant: len and cap, and a
      # call to a function or method of this file whose body can be seen here and whose
      # every return is a string literal, or a lookup in a map of string
      # literals with a literal fallback (the shapes below). Any other call of
      # a package-level function keeps the taint of its arguments, as Semgrep
      # does by default: a function of another file of the package, a
      # signature that is not a single string, or a body that builds its result
      # from its parameters. make is not listed: Semgrep's make(...) pattern
      # also matches every map, slice and struct literal, which would hide a
      # value put into one, and make takes only sizes.
      - exact: true
        pattern-either:
          - pattern: len(...)
          - pattern: cap(...)
          - pattern: $ASSIGNED := len(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR := len(...)
          - pattern: $ASSIGNED = len(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR = len(...)
          - pattern: var $ASSIGNED = len(...)
          - pattern: var $ASSIGNED $ASSIGNED_TYPE = len(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR = len(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = len(...)
          - pattern: $ASSIGNED := cap(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR := cap(...)
          - pattern: $ASSIGNED = cap(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR = cap(...)
          - pattern: var $ASSIGNED = cap(...)
          - pattern: var $ASSIGNED $ASSIGNED_TYPE = cap(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR = cap(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = cap(...)
      # A function or method of this file whose every return is a string literal
      # (a switch or an if over literals). The pattern ends at the helper, or at
      # a later function that calls it, and the regex on the body is part of
      # the pattern that ends there: see the cost note in the header of
      # go-injection.yaml.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $FUNC(...)
              - pattern: $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED := $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $FUNC(...)
              - pattern: $ASSIGNED = $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED = $FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $FUNC(...)
              - pattern: $ASSIGNED := $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
          - pattern-either:
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                        ...
                        func $CALLER(...) {
                          ...
                          $FUNC(...)
                          ...
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                        ...
                        func $CALLER(...) {
                          ...
                          $RECEIVER.$FUNC(...)
                          ...
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
      # A function or method of this file that looks its result up in a map of
      # string literals declared above it at package level, and falls back to a literal.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $FUNC(...)
              - pattern: $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED := $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $FUNC(...)
              - pattern: $ASSIGNED = $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED = $FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $FUNC(...)
              - pattern: $ASSIGNED := $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  var $MAP = $OBJ
                  ...
                  func $FUNC(...) string {
                    if $V, $OK := $MAP[$KEY]; $OK {
                      return $V
                    }
                    return "..."
                  }
              - pattern-inside: |
                  package $PKG
                  ...
                  var $MAP = $OBJ
                  ...
                  func $FUNC(...) string {
                    if $V, $OK := $MAP[$KEY]; $OK {
