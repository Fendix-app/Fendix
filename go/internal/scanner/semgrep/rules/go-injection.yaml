          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
