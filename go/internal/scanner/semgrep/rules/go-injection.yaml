          - metavariable-regex:
              metavariable: $OBJ
              regex: '(?s)^map\[string\]string\{\s*(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`)\s*:\s*(?:"(?:[^"\\]|\\.)*"|`[^`]*`)\s*(?:,\s*(?:"(?:[^"\\]|\\.)*"|`[^`]*`)\s*:\s*(?:"(?:[^"\\]|\\.)*"|`[^`]*`)\s*)*,?\s*)?\}$'
      # The same, with the map of string literals declared in the function.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $FUNC(...)
              - pattern: $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED := $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $FUNC(...)
              - pattern: $ASSIGNED = $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED = $FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $FUNC(...)
