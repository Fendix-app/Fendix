              - pattern: $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
          - metavariable-pattern:
              metavariable: $CALLEXPR
              patterns:
                - pattern: $RECEIVER.$FUNC(...)
                # Sources.
                - pattern-not: $R.URL.Query()
                - pattern-not: $R.URL.Query().$GET(...)
                - pattern-not: $R.FormValue(...)
                - pattern-not: $R.PostFormValue(...)
                - pattern-not: $R.PathValue(...)
                - pattern-not: $R.Header.Get(...)
                - pattern-not: $R.Header.Values(...)
                - pattern-not: $R.Form.Get(...)
                - pattern-not: $R.PostForm.Get(...)
                - pattern-not: '($R : *http.Request).Cookie(...)'
                - pattern-not: '($R : *http.Request).FormFile(...)'
                - pattern-not: mux.Vars(...)
                - pattern-not: chi.URLParam(...)
                - pattern-not: '($C : *gin.Context).$GIN(...)'
                # Calls that hand their input back.
                - pattern-not: fmt.Sprintf(...)
                - pattern-not: fmt.Sprint(...)
                - pattern-not: fmt.Sprintln(...)
                - pattern-not: strings.$STRINGS(...)
                - pattern-not: bytes.$BYTES(...)
                - pattern-not: filepath.$FILEPATH(...)
                - pattern-not: path.$PATH(...)
                - pattern-not: url.$URL(...)
                - pattern-not: html.UnescapeString(...)
                - pattern-not: strconv.Unquote(...)
                - pattern-not: string(...)
                - pattern-not: '[]byte(...)'
                - pattern-not: '[]rune(...)'
                - pattern-not: append(...)
                - pattern-not: $VALUE.String()
                - pattern-not: $VALUE.Bytes()
                - pattern-not: $VALUE.Query()
                - pattern-not: $VALUE.Hostname()
                - pattern-not: $RE.ReplaceAllString(...)
                - pattern-not: $RE.ReplaceAllLiteralString(...)
                - pattern-not: $RE.ReplaceAllStringFunc(...)
                - pattern-not: $REPLACER.Replace(...)
                - pattern-not: $CODEC.DecodeString(...)
                - pattern-not: $CODEC.Unescape(...)
                - pattern-not: $CODEC.UnescapeString(...)
                - pattern-not: $CODEC.QueryUnescape(...)
                - pattern-not: $CODEC.PathUnescape(...)
                - pattern-not: $CODEC.Unquote(...)
                - pattern-not: io.ReadAll(...)
                - pattern-not: ioutil.ReadAll(...)
                - pattern-not: json.NewDecoder(...)
                - pattern-not: $DECODER.Decode(...)
                - pattern-not: json.Unmarshal(...)
                # A call that takes a function literal (router.GET(path, func(c
                # *gin.Context) { ... })): its range holds the literal's body, and Semgrep
                # does not judge the calls inside a sanitized range one by one.
                - pattern-not: $OUTER(..., <... func(...) { ... } ...>, ...)
                # This rule's sinks.
                - pattern-not: $TPL.Parse(...)
          - pattern-not-inside: |
              $VALUES := $R.URL.Query()
              ...
              $VALUES.Get(...)
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }

      # A value parsed as a number, a boolean or a UUID carries no syntax.
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      - pattern: uuid.Parse(...)
      - pattern: uuid.MustParse(...)
      # A number formatted back into a string is digits only, and so is a Sprintf
      # whose every verb is numeric ("$%d" placeholders).
      - patterns:
          - pattern: fmt.Sprintf($NUMERICFORMAT, ...)
          - metavariable-regex:
              metavariable: $NUMERICFORMAT
              regex: ^"([^%"\\]|%%|%[-+# 0]*[0-9]*(\.[0-9]*)?[dboxXeEfFgG])*"$
      - pattern: strconv.Itoa(...)
      - pattern: strconv.FormatInt(...)
      - pattern: strconv.FormatUint(...)
      - pattern: strconv.FormatFloat(...)
      - pattern: strconv.FormatBool(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: template.New(...).Parse($TEMPLATE)
              - pattern: template.New(...).$CONFIG(...).Parse($TEMPLATE)
              - pattern: template.New(...).$CONFIG(...).$MORE(...).Parse($TEMPLATE)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $TPL := template.New(...)
                          ...
                      - pattern-inside: |
                          $TPL := template.New(...).$CONFIG(...)
                          ...
                  - pattern: $TPL.Parse($TEMPLATE)
          - focus-metavariable: $TEMPLATE
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches Template.Parse; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    template.New(...).Parse($PARAM)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    template.New(...).$CONFIG(...).Parse($PARAM)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    $TPL := template.New(...)
                    ...
                    $TPL.Parse($PARAM)
                    ...
                  }
                  ...
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches Template.Parse; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    template.New(...).Parse($PARAM)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    template.New(...).$CONFIG(...).Parse($PARAM)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    $TPL := template.New(...)
                    ...
                    $TPL.Parse($PARAM)
                    ...
                  }
                  ...
          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches Template.Parse; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    template.New(...).Parse($PARAM)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    template.New(...).$CONFIG(...).Parse($PARAM)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    $TPL := template.New(...)
                    ...
                    $TPL.Parse($PARAM)
                    ...
                  }
                  ...
          - pattern: $HELPER($X1, $X2, $ARG, ...)
          - focus-metavariable: $ARG
  # A string parameter of the enclosing function parsed as a template.
  - id: go-ssti-sink
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: WARNING
    message: >-
      Go template parsed from a function parameter: if callers pass request input, this is template injection.
    metadata:
      category: injection
      cwe: [CWE-1336, CWE-94]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Go template parsed from a function parameter.
      fendix_remediation: >-
        A template is parsed from a parameter. If a caller passes request input, this is template injection. Parse a fixed template and pass the value as data.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      - pattern-either:
          - pattern: template.New(...).Parse($PARAM)
          - pattern: template.New(...).$CONFIG(...).Parse($PARAM)
          - patterns:
              - pattern-inside: |
                  $TPL := template.New(...)
                  ...
              - pattern: $TPL.Parse($PARAM)
      - pattern-not: template.New(...).Parse("...")
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
