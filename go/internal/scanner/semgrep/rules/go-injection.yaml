  # A string parameter of the enclosing function in a shell's command line.
  - id: go-cmdi-sink
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: WARNING
    message: >-
      Shell command built from a function parameter: if callers pass request input, this is command injection.
    metadata:
      category: injection
      cwe: [CWE-78]
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: >-
        Shell command built from a function parameter.
      fendix_remediation: >-
        A shell's command line (sh -c) is built from a parameter. If a caller passes request input, this is command injection. Run a fixed program without a shell and pass the value as its own argument.
    patterns:
      - pattern-inside: |
          func $FN(..., $PARAM string, ...) {
            ...
          }
      - pattern-either:
          - pattern: exec.Command($SHELL, $FLAG, <... $PARAM ...>, ...)
          - pattern: exec.CommandContext($CTX, $SHELL, $FLAG, <... $PARAM ...>, ...)
      - metavariable-regex:
          metavariable: $SHELL
          regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
      - metavariable-regex:
          metavariable: $FLAG
          regex: ^"(-[a-z]*c|/c|/C|-Command)"$
      - pattern-not: exec.Command($SHELL, $FLAG, "...", ...)
      - pattern-not: exec.Command($SHELL, $FLAG, <... shellescape.Quote($PARAM) ...>, ...)
      # Exported functions only: the entry points another file (or package) calls,
      # which the taint rule cannot follow. A call into an unexported helper of
      # the same file is the taint rule's to judge.
      - metavariable-regex:
          metavariable: $FN
          regex: ^[A-Z]
      # A parameter cannot also be a constant in its own scope; these keep the
      # pack's -sink contract (a module constant is never reported) explicit.
      - pattern-not-inside: |
          const $PARAM = "..."
          ...
      - pattern-not-inside: |
          const (
            $PARAM = "..."
          )
          ...
  # Server-side template injection (Go). Taint mode: request input parsed as
  # a text/template or html/template template. Request input passed to
  # Execute as data is not a sink.
  - id: go-ssti-taint
    mode: taint
    languages: [go]
    # Go test code: *_test.go, mocks and the conventional helper directories. Matched
    # against paths below the scan root, so a checkout that itself lies under a
    # directory named test is still scanned.
    paths:
      exclude:
        - "*_test.go"
        - "**/testdata/**"
        - "**/testhelpers/**"
        - "**/testutil/**"
        - "**/testutils/**"
        - "**/testing/**"
        - "**/test/**"
        - "**/tests/**"
        - "**/unittest/**"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fakes/**"
        - "mock_*.go"
        - "*_mock.go"
    severity: ERROR
    message: >-
      Go template parsed from request input: parse a fixed template and pass the input as data.
    metadata:
      category: injection
      cwe: [CWE-1336, CWE-94]
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_title: >-
        Go template parsed from request input.
      fendix_remediation: >-
        Request input is parsed as a text/template or html/template template, so the caller controls its actions and the methods it calls. Parse a fixed template and pass the input as data to Execute.
      fendix_reachability: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
      # m[key] is a lookup: an element found by request input is not request input.
      taint_assume_safe_indexes: true
    pattern-sources:
      # net/http: the request's query string, form values, path values,
      # headers, cookies and body. Header, Cookie and Body are typed so that an
      # *http.Response's headers and body are not taken for request input.
      - pattern: $R.URL.Query()
      - pattern: $R.URL.RawQuery
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).FormFile(...)'
      - pattern: '($R : *http.Request).Body'
      - pattern: $C.Request.Header
      - pattern: $C.Request.Body
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      # A JSON request body decoded into a variable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: 'json.NewDecoder(($R : *http.Request).Body).Decode(&$X)'
              - pattern: json.NewDecoder($C.Request.Body).Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $DEC := json.NewDecoder(($R : *http.Request).Body)
                      ...
                  - pattern: $DEC.Decode(&$X)
              - patterns:
                  - pattern-inside: |
                      $BODY, $ERR := io.ReadAll(($R : *http.Request).Body)
                      ...
                  - pattern: json.Unmarshal($BODY, &$X)
          - focus-metavariable: $X
      # Gin: the context's request accessors, and the target of a bind.
      - patterns:
          - pattern: '($C : *gin.Context).$ACCESSOR(...)'
          - metavariable-regex:
              metavariable: $ACCESSOR
              regex: ^(Query|DefaultQuery|GetQuery|QueryArray|GetQueryArray|QueryMap|GetQueryMap|Param|PostForm|DefaultPostForm|GetPostForm|PostFormArray|GetPostFormArray|PostFormMap|GetPostFormMap|GetHeader|Cookie|GetRawData|FormFile)$
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '($C : *gin.Context).$BIND(&$X, ...)'
              - pattern: '($C : *gin.Context).$BIND($X, ...)'
          - metavariable-regex:
              metavariable: $BIND
              regex: ^(Should|Must)?Bind[A-Za-z]*$
          - focus-metavariable: $X
    pattern-sanitizers:
      # A call's result is clean only when it is a constant: len and cap, and a
      # call to a function or method of this file whose body can be seen here and whose
      # every return is a string literal, or a lookup in a map of string
      # literals with a literal fallback (the shapes below). Any other call of
      # a package-level function keeps the taint of its arguments, as Semgrep
      # does by default: a function of another file of the package, a
      # signature that is not a single string, or a body that builds its result
      # from its parameters. make is not listed: Semgrep's make(...) pattern
      # also matches every map, slice and struct literal, which would hide a
      # value put into one, and make takes only sizes.
      - exact: true
        pattern-either:
          - pattern: len(...)
          - pattern: cap(...)
          - pattern: $ASSIGNED := len(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR := len(...)
          - pattern: $ASSIGNED = len(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR = len(...)
          - pattern: var $ASSIGNED = len(...)
          - pattern: var $ASSIGNED $ASSIGNED_TYPE = len(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR = len(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = len(...)
          - pattern: $ASSIGNED := cap(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR := cap(...)
          - pattern: $ASSIGNED = cap(...)
          - pattern: $ASSIGNED, $ASSIGNED_ERR = cap(...)
          - pattern: var $ASSIGNED = cap(...)
          - pattern: var $ASSIGNED $ASSIGNED_TYPE = cap(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR = cap(...)
          - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = cap(...)
      # A function or method of this file whose every return is a string literal
      # (a switch or an if over literals). The pattern ends at the helper, or at
      # a later function that calls it, and the regex on the body is part of
      # the pattern that ends there: see the cost note in the header of
      # go-injection.yaml.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $FUNC(...)
              - pattern: $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED := $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $FUNC(...)
              - pattern: $ASSIGNED = $FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED = $FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $FUNC(...)
              - pattern: $ASSIGNED := $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR := $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR = $RECEIVER.$FUNC(...)
              - pattern: var $ASSIGNED, $ASSIGNED_ERR $ASSIGNED_TYPE = $RECEIVER.$FUNC(...)
          - pattern-either:
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                        ...
                        func $CALLER(...) {
                          ...
                          $FUNC(...)
                          ...
                        }
                    - metavariable-regex:
                        metavariable: $...BODY
                        regex: '(?s)^(?=(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*?\breturn\b)(?:(?:"(?:[^"\\]|\\.)*"|`[^`]*`|''(?:[^''\\]|\\.)+''|//[^\n]*|/\*.*?\*/|\breturn\s+(?:"(?:[^"\\]|\\.)*"|`[^`]*`)(?=[ \t]*(?:\n|;|\}|//|/\*|$))|[^"`\''/r]|r(?!eturn\b)|/(?![/*])))*$'
              - pattern-inside:
                  patterns:
                    - pattern: |
                        package $PKG
                        ...
                        func $FUNC(...) string {
                          $...BODY
                        }
                        ...
                        func $CALLER(...) {
                          ...
                          $RECEIVER.$FUNC(...)
                          ...
                        }
