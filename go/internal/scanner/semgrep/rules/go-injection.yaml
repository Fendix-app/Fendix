                - pattern-not: $R.Form.Get(...)
                - pattern-not: $R.PostForm.Get(...)
                - pattern-not: '($R : *http.Request).Cookie(...)'
                - pattern-not: '($R : *http.Request).FormFile(...)'
                - pattern-not: mux.Vars(...)
                - pattern-not: chi.URLParam(...)
                - pattern-not: '($C : *gin.Context).$GIN(...)'
                # Calls that hand their input back.
                - pattern-not: fmt.Sprintf(...)
                - pattern-not: fmt.Sprint(...)
                - pattern-not: fmt.Sprintln(...)
                - pattern-not: strings.$STRINGS(...)
                - pattern-not: bytes.$BYTES(...)
                - pattern-not: filepath.$FILEPATH(...)
                - pattern-not: path.$PATH(...)
                - pattern-not: url.$URL(...)
                - pattern-not: html.UnescapeString(...)
                - pattern-not: strconv.Unquote(...)
                - pattern-not: string(...)
                - pattern-not: '[]byte(...)'
                - pattern-not: '[]rune(...)'
                - pattern-not: append(...)
                - pattern-not: $VALUE.String()
                - pattern-not: $VALUE.Bytes()
                - pattern-not: $VALUE.Query()
                - pattern-not: $VALUE.Hostname()
                - pattern-not: $RE.ReplaceAllString(...)
                - pattern-not: $RE.ReplaceAllLiteralString(...)
                - pattern-not: $RE.ReplaceAllStringFunc(...)
                - pattern-not: $REPLACER.Replace(...)
                - pattern-not: $CODEC.DecodeString(...)
                - pattern-not: $CODEC.Unescape(...)
                - pattern-not: $CODEC.UnescapeString(...)
                - pattern-not: $CODEC.QueryUnescape(...)
                - pattern-not: $CODEC.PathUnescape(...)
                - pattern-not: $CODEC.Unquote(...)
                - pattern-not: io.ReadAll(...)
                - pattern-not: ioutil.ReadAll(...)
                - pattern-not: json.NewDecoder(...)
                - pattern-not: $DECODER.Decode(...)
                - pattern-not: json.Unmarshal(...)
                # A call that takes a function literal (router.GET(path, func(c
                # *gin.Context) { ... })): its range holds the literal's body, and Semgrep
                # does not judge the calls inside a sanitized range one by one.
                - pattern-not: $OUTER(..., <... func(...) { ... } ...>, ...)
                # This rule's sinks.
                - pattern-not: exec.Command(...)
                - pattern-not: exec.CommandContext(...)
                - pattern-not: syscall.Exec(...)
                - pattern-not: os.StartProcess(...)
          - pattern-not-inside: |
              $VALUES := $R.URL.Query()
              ...
              $VALUES.Get(...)
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RCV $RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) string {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
          - pattern-not-inside: |
              package $PKG
              ...
              func ($RTYPE) $FUNC(..., $PARAM string, ...) (string, $SECOND) {
                ...
              }
              ...
              func $CALLER(...) {
                ...
                $CALLEE.$FUNC(...)
                ...
              }

      # A value parsed as a number, a boolean or a UUID carries no syntax.
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      - pattern: uuid.Parse(...)
      - pattern: uuid.MustParse(...)
      # A number formatted back into a string is digits only, and so is a Sprintf
      # whose every verb is numeric ("$%d" placeholders).
      - patterns:
          - pattern: fmt.Sprintf($NUMERICFORMAT, ...)
          - metavariable-regex:
              metavariable: $NUMERICFORMAT
              regex: ^"([^%"\\]|%%|%[-+# 0]*[0-9]*(\.[0-9]*)?[dboxXeEfFgG])*"$
      - pattern: strconv.Itoa(...)
      - pattern: strconv.FormatInt(...)
      - pattern: strconv.FormatUint(...)
      - pattern: strconv.FormatFloat(...)
      - pattern: strconv.FormatBool(...)

      # Quoted for the shell.
      - pattern: shellescape.Quote(...)
      - pattern: shellescape.QuoteCommand(...)
    pattern-sinks:
      # A shell's command line (sh -c, bash -c, cmd /c, ...).
      - patterns:
          - pattern-either:
              - pattern: exec.Command($SHELL, $FLAG, $CMD, ...)
              - pattern: exec.CommandContext($CTX, $SHELL, $FLAG, $CMD, ...)
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-[a-z]*c|/c|/C|-Command)"$
          - focus-metavariable: $CMD
      # The program itself.
      - patterns:
          - pattern-either:
              - pattern: exec.Command($NAME, ...)
              - pattern: exec.CommandContext($CTX, $NAME, ...)
              - pattern: syscall.Exec($NAME, ...)
              - pattern: os.StartProcess($NAME, ...)
          - focus-metavariable: $NAME
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    exec.Command($SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                shellescape.Quote($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-[a-z]*c|/c|/C|-Command)"$
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    exec.Command($SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                shellescape.Quote($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-[a-z]*c|/c|/C|-Command)"$
          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    exec.Command($SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $SHELL, $FLAG, <... $PARAM ...>, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                ...
                shellescape.Quote($PARAM)
                ...
              }
              ...
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^"((/usr)?/bin/)?(sh|bash|zsh|ksh|dash|ash)"$|^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-[a-z]*c|/c|/C|-Command)"$
          - pattern: $HELPER($X1, $X2, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the first argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    exec.Command($PARAM, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $PARAM, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($PARAM string, ...) {
                ...
                shellescape.Quote($PARAM)
                ...
              }
              ...
          - pattern: $HELPER($ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the second argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    exec.Command($PARAM, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $PARAM, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $PARAM string, ...) {
                ...
                shellescape.Quote($PARAM)
                ...
              }
              ...
          - pattern: $HELPER($X1, $ARG, ...)
          - focus-metavariable: $ARG
      # Request input passed as the third argument of a function of this
      # file whose parameter reaches a shell command or program name; the call is reported.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    exec.Command($PARAM, ...)
                    ...
                  }
                  ...
              - pattern-inside: |
                  package $PKG
                  ...
                  func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
                    ...
                    exec.CommandContext($CTX, $PARAM, ...)
                    ...
                  }
                  ...
          - pattern-not-inside: |
              package $PKG
              ...
              func $HELPER($A1 $T1, $A2 $T2, $PARAM string, ...) {
