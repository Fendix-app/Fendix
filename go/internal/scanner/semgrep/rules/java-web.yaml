                          ...
                          <... $SH($SA1, $SA2, <... $SP ...>, ...) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ, ...) { ... }
                  - metavariable-regex:
