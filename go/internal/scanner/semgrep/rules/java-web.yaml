          - pattern-not-inside: |
              if (<... $ALLOW.contains(URI.create($U).getHost()) ...>) { ... }
              ...
          - pattern-not-inside: |
              if (<... $ALLOW.contains(new URI($U).getHost()) ...>) { ... }
              ...
