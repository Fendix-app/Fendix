                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SA2, <... $SP ...>, ...) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SA2, <... $SP ...>, ...) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ, ...) { ... }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          - metavariable-regex:
              metavariable: $SHT
              regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
          - pattern: $SQ
      # The servlet request.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $SREQ).$SGET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (ServletRequest $SREQ).$SGET(...)
              - patterns:
                  - pattern: $SREQ.$SGET(...)
                  - metavariable-regex:
                      metavariable: $SREQ
                      regex: ^(request|req|httpRequest|servletRequest|httpServletRequest)$
          - metavariable-regex:
              metavariable: $SGET
              regex: ^(getParameter|getParameterValues|getHeader|getQueryString|getInputStream|getReader)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: UUID.fromString(...)
      # A target whose start is fixed by a literal path or URL on this site.
      - patterns:
          - pattern: '"$PREFIX" + $REST'
          - metavariable-regex:
              metavariable: $PREFIX
              regex: ^(redirect:|forward:)?(/[^/\\]|https?://[^/]+/)
      # The local-path check: starts with "/" but not with "//".
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: '!$T.startsWith("/") || $T.startsWith("//")'
              - pattern: '$T.startsWith("/") && !$T.startsWith("//")'
          - focus-metavariable: $T
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (HttpServletResponse $RESP).sendRedirect($U)
              - patterns:
                  - pattern: $RESP.sendRedirect($U)
                  - metavariable-regex:
                      metavariable: $RESP
                      regex: ^(response|resp|res|httpResponse|servletResponse|httpServletResponse)$
              - pattern: '"redirect:" + $U'
              - pattern: new RedirectView($U, ...)
              - pattern: ResponseEntity.$STATUS(...).location($U)
              - pattern: ResponseEntity.$STATUS(...).$HEADERS(...).location($U)
              - pattern: (HttpHeaders $HEADERS).setLocation($U)
              - pattern: (HttpServletResponse $RESP).setHeader("Location", $U)
              - pattern: (HttpServletResponse $RESP).addHeader("Location", $U)
              - pattern: (HttpServletResponse $RESP).setHeader(HttpHeaders.LOCATION, $U)
              - pattern: (HttpHeaders $HEADERS).set(HttpHeaders.LOCATION, $U)
              - pattern: (HttpHeaders $HEADERS).add(HttpHeaders.LOCATION, $U)
          # Inside a local-path check (the target must not start with "//"), or after
          # one that replaces the target or returns early.
          - pattern-not-inside: |
              if (<... $U.startsWith("//") ...>) { ... }
              ...
          - focus-metavariable: $U

  - id: java-open_redirect-sink
    languages: [java]
    severity: WARNING
    message: >-
      Redirect to a URL taken from a method argument. This method redirects to
      whatever its callers pass, so a caller that passes request input makes it
      an open redirect. Redirect only to a path on this site, or to a URL from
      an allowlist.
    metadata:
      category: injection
      cwe: CWE-601
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: Redirect to a URL taken from a method argument.
      fendix_remediation: >-
        Accept the target only when it starts with "/" and not with "//" or
        "/\", here or in every caller, or map it to a URL from an allowlist.
        Callers in other files may pass request input.
    patterns:
      # A non-private method, so another class can call it, and its parameter $Q,
      # a string that carries no request annotation (the -taint rule covers those).
      - pattern-inside: |
          $RT $M(..., $PT $Q, ...) { ... }
      - pattern-not-inside: |
          private $RT $M(...) { ... }
      - pattern-not-inside: |
          $RT $M(..., @$ANN(...) $PT $Q, ...) { ... }
      - metavariable-regex:
          metavariable: $PT
          regex: ^(String|CharSequence|Object)$
      - pattern-either:
          - pattern: (HttpServletResponse $RESP).sendRedirect($Q)
          - patterns:
              - pattern: $RESP.sendRedirect($Q)
              - metavariable-regex:
                  metavariable: $RESP
                  regex: ^(response|resp|res|httpResponse|servletResponse|httpServletResponse)$
          - pattern: '"redirect:" + $Q'
          - pattern: new RedirectView($Q, ...)
      # A module constant of that name is not a caller's argument.
      - pattern-not-inside: |
          class $CLS {
            ...
            static final String $Q = "...";
            ...
          }
      - pattern-not: $RESP.sendRedirect("...")
