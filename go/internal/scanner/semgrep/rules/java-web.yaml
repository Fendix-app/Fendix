                  - pattern-inside: |
                      @$SMAP(...)
                      $SRT $SM(..., String $SP, ...) { ... }
                  # Annotated otherwise (@SessionAttribute, @AuthenticationPrincipal):
                  # not a request parameter.
                  - pattern-not-inside: |
                      $SRT $SM(..., @$SOTHER(...) String $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          - pattern: $SP
      # A parameter of a method of the same class that a handler calls with such
      # a parameter, or an expression of one, at the same position (1 to 3).
      # Open-source Semgrep follows taint within one method; from this source it
      # follows the called method's own body, to the sink inside it.
