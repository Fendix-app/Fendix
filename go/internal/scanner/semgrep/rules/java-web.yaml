  - id: java-path_traversal-sink
    languages: [java]
    severity: WARNING
    message: >-
      File path built from a base directory and a method argument. This method
      joins its own parameter to a directory and reads or writes that file, so
      a caller that passes request input lets `../` reach files outside the
      directory. Keep only the file name, or normalize the path and check that
      it stays inside the directory.
    metadata:
      category: injection
      cwe: CWE-22
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: File path built from a base directory and a method argument.
      fendix_remediation: >-
        Keep only the file name (FilenameUtils.getName), or resolve the path
        against the base directory, normalize it and reject it unless the
        normalized java.nio.file.Path starts with the base. Callers in other
        files may pass request input.
    patterns:
      # A non-private method, so another class can call it, and its parameter $Q,
      # a string that carries no request annotation (the -taint rule covers those).
      - pattern-inside: |
          $RT $M(..., $PT $Q, ...) { ... }
      - pattern-not-inside: |
          private $RT $M(...) { ... }
      - pattern-not-inside: |
          $RT $M(..., @$ANN(...) $PT $Q, ...) { ... }
      - metavariable-regex:
          metavariable: $PT
          regex: ^(String|CharSequence|Object)$
      - pattern-either:
          - pattern: Paths.get($DIR, ..., $Q, ...)
          - pattern: Path.of($DIR, ..., $Q, ...)
          - pattern: new File($DIR, $Q)
          - pattern: $DIRPATH.resolve($Q)
          - pattern: Paths.get($DIR + $Q)
          - pattern: new File($DIR + $Q)
      - pattern-either:
          - pattern-inside: Files.$FOP(...)
          - pattern-inside: new FileInputStream(...)
          - pattern-inside: new FileReader(...)
          - pattern-inside: new FileOutputStream(...)
          - pattern-inside: new FileWriter(...)
          - pattern-inside: new FileSystemResource(...)
          - pattern-inside: |
              $PATHT $PV = $JOIN;
              ...
              Files.$FOP(..., $PV, ...);
      # A module constant of that name is not a caller's argument.
      - pattern-not-inside: |
          class $CLS {
            ...
            static final String $Q = "...";
            ...
          }
      - pattern-not: Paths.get("...", "...")
      # The joined path is checked for containment, exiting when it fails.
