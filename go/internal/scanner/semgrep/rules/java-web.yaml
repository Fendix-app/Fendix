                      regex: ^(readAllBytes|readAllLines|readString|lines|newInputStream|newBufferedReader|newOutputStream|newBufferedWriter|newByteChannel|write|writeString|delete|deleteIfExists|createFile|list|walk|size|move)$
              - pattern: Files.copy($SRC, $P, ...)
              - pattern: new FileInputStream($P)
              - pattern: new FileReader($P, ...)
              - pattern: new FileOutputStream($P, ...)
              - pattern: new FileWriter($P, ...)
              - pattern: new RandomAccessFile($P, ...)
              - pattern: new FileSystemResource($P)
              - pattern: new PathResource($P)
              - pattern: (MultipartFile $UPLOAD).transferTo($P)
          # Inside a containment check on the normalized path, or after one that
          # returns early. (A check combined with || does not clean the path by side
          # effect: Semgrep merges both operands' paths before the if.)
          - pattern-not-inside: |
              $GT $P = $NORM.normalize();
              ...
              if (<... $P.startsWith($BASE) ...>) { ... }
              ...
          - pattern-not-inside: |
              $P = $NORM.normalize();
              ...
              if (<... $P.startsWith($BASE) ...>) { ... }
              ...
          - pattern-not-inside: |
              $GT $P = $NORM.toRealPath(...);
              ...
              if (<... $P.startsWith($BASE) ...>) { ... }
              ...
          - focus-metavariable: $P

