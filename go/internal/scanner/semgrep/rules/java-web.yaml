                  - pattern-either:
                      - pattern-inside: |
                          $PT $T = $NORM.normalize();
                          ...
                      - pattern-inside: |
                          $T = $NORM.normalize();
                          ...
                      - pattern-inside: |
                          $PT $T = $NORM.toRealPath(...);
                          ...
                      - pattern-inside: |
