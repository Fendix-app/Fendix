          # wildcards, or equals).
          - pattern-not-inside: |
              if (<... $U.matches("=~/^\^?[A-Za-z0-9:/._\\-]*\$?$/") ...>) { ... }
              ...
          - pattern-not-inside: |
              if (<... $U.equals("...") ...>) { ... }
              ...
          - pattern-not-inside: |
              if (<... "...".equals($U) ...>) { ... }
              ...
          - focus-metavariable: $U

