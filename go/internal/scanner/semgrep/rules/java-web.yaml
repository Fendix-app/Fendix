# Java / Spring web pack: reflected XSS, SSRF, path traversal and open
# redirect as taint rules from Spring MVC and servlet request input, plus a
# shape rule per class for a sink fed by a method's own argument.
#
# Written in-house for Fendix; see docs/semgrep-rules.md. The request sources
# and the number sanitizers are the blocks described at the top of
# java-injection.yaml, repeated word for word (Semgrep cannot share a block
# between rules); TestJavaTaintRulesShareTheirBlocks keeps the copies equal.
#
# A guard (a host check, a containment check, a local-path check) counts only
# when the branch taken on a failing check ends with a direct return or
# throw (for a redirect, also a direct assignment of a literal to the target,
# followed by nothing but literal assignments), not under an &&; or when the
# use sits inside the then-branch of a passing check with no else. java-ssrf-sink and java-open_redirect-sink carry the same guards as
# negations on their parameter; TestJavaSinkRulesShareTheirTaintRulesBlocks
# keeps those copies equal.
#
# SSRF, path traversal and open redirect are category injection, as the
# textscan Java rules already file them, so a finding of both collapses into
# one.
rules:
  - id: java-xss-taint
    mode: taint
    languages: [java]
    severity: WARNING
    message: >-
      Request input written into an HTML response without encoding (reflected
      XSS). A request value reaches the body of a text/html response: the
      return value of a @ResponseBody handler that produces text/html, or the
      servlet response writer (directly, or through a method of this class that
      writes it). Encode it with HtmlUtils.htmlEscape or Encode.forHtml, or
      render it through a template engine that escapes by default.
    metadata:
      category: xss
      cwe: CWE-79
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_reachability: taint
      fendix_title: Request input written into an HTML response without encoding.
      fendix_remediation: >-
        HTML-encode the value where it is written (HtmlUtils.htmlEscape,
        Encode.forHtml or StringEscapeUtils.escapeHtml4), or render the page
        with a template engine that escapes by default, such as Thymeleaf
        th:text.
    pattern-sources:
      # A request-bound parameter of a handler: annotated, or a plain String
      # parameter of a request-mapping method, which Spring binds as a request
      # parameter. Not a number, boolean, date or UUID, nor a framework object.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $SRT $SM(..., @$SANN(...) $ST $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      @$SMAP(...)
                      $SRT $SM(..., String $SP, ...) { ... }
                  # Annotated otherwise (@SessionAttribute, @AuthenticationPrincipal):
                  # not a request parameter.
                  - pattern-not-inside: |
                      $SRT $SM(..., @$SOTHER(...) String $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          - pattern: $SP
      # One call deep: the parameter of a method of the same class (a direct
      # member, not a nested class's) that a handler calls with such a value at
      # that position, matched by name and by the number of arguments (1 to 3).
      # Open-source Semgrep follows taint within one method; from this source it
      # follows the called method's own body, to the sink inside it. The argument
      # must be the value itself or a concatenation or format of it (see
      # $SARG below), and the handler must not reassign the parameter.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SARG, $SA2, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT $SQ, $SHT2 $SHP2, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SARG, $SA3) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT $SQ, $SHT3 $SHP3) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SANN(...) $ST $SP, ...) {
                          ...
                          <... $SH($SA1, $SA2, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ) { ... }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
                      regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
              - patterns:
                  - pattern-inside: |
                      class $SC {
                        ...
                        @$SMAP(...)
                        $SRT $SM(..., String $SP, ...) {
                          ...
                          <... $SH($SA1, $SA2, $SARG) ...>;
                          ...
                        }
                        ...
                      }
                  - pattern-inside: |
                      class $SC {
                        ...
                        $SHR $SH($SHT1 $SHP1, $SHT2 $SHP2, $SHT $SQ) { ... }
                        ...
                      }
                  - pattern-not-inside: |
                      class $SC {
                        ...
                        $SRT $SM(..., @$SOTHER(...) String $SP, ...) {
                          ...
                        }
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $SMAP
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)$
          # The handler reassigns the value before passing it (file = getName(file)).
          - pattern-not-inside: |
              class $SC {
                ...
                $SRT $SM(...) {
                  ...
                  $SP = $SREASSIGNED;
                  ...
                }
                ...
              }
          - metavariable-regex:
              metavariable: $SARG
              regex: ^(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*")(\s*\+\s*(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*"))*$|^String\.format\(\s*"[^"]*"(\s*,\s*(\w+(\.(get\w*|trim|strip|toLowerCase|toUpperCase)\(\))*|"[^"]*"))*\s*\)$
          - metavariable-pattern:
              metavariable: $SARG
              pattern: $SP
          - metavariable-regex:
              metavariable: $SHT
              regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Number|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|LocalTime|OffsetDateTime|ZonedDateTime|Instant|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|Principal|Authentication|BindingResult|Errors|Locale|RedirectAttributes)$)
          - pattern: $SQ
      # The servlet request.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $SREQ).$SGET(...)
              - pattern: (javax.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $SREQ).$SGET(...)
              - pattern: (ServletRequest $SREQ).$SGET(...)
              - patterns:
                  - pattern: $SREQ.$SGET(...)
                  - metavariable-regex:
                      metavariable: $SREQ
                      regex: ^(request|req|httpRequest|servletRequest|httpServletRequest)$
          - metavariable-regex:
              metavariable: $SGET
              regex: ^(getParameter|getParameterValues|getHeader|getQueryString|getInputStream|getReader)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: UUID.fromString(...)
      - pattern-either:
          - pattern: HtmlUtils.htmlEscape(...)
          - pattern: HtmlUtils.htmlEscapeDecimal(...)
          - pattern: HtmlUtils.htmlEscapeHex(...)
          - pattern: StringEscapeUtils.escapeHtml4(...)
          - pattern: StringEscapeUtils.escapeHtml3(...)
          - pattern: StringEscapeUtils.escapeXml10(...)
          - pattern: StringEscapeUtils.escapeXml11(...)
          - pattern: Encode.forHtml(...)
          - pattern: Encode.forHtmlContent(...)
          - pattern: Encode.forHtmlAttribute(...)
          - pattern: Encode.forXml(...)
          - pattern: ESAPI.encoder().encodeForHTML(...)
          - pattern: ESAPI.encoder().encodeForHTMLAttribute(...)
          - pattern: HtmlEscapers.htmlEscaper().escape(...)
          - pattern: Jsoup.clean(...)
      # A Thymeleaf template named by a constant escapes what it renders
      # (th:text), so its output is not the request value.
      - patterns:
          - pattern-either:
              - pattern: (TemplateEngine $TE).process("...", ...)
              - pattern: (SpringTemplateEngine $TE).process("...", ...)
              - pattern: (ITemplateEngine $TE).process("...", ...)
              - patterns:
                  - pattern: $TE.process("...", ...)
                  - metavariable-regex:
                      metavariable: $TE
                      regex: (?i)^\w*templateEngine$
    pattern-sinks:
      # The return value of a handler whose response body is text/html.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$MAP(..., produces = MediaType.TEXT_HTML_VALUE, ...)
                  $RT $M(...) { ... }
              - pattern-inside: |
                  @$MAP(..., produces = "=~/^text\/html/", ...)
                  $RT $M(...) { ... }
              - pattern-inside: |
                  @$MAP(..., produces = {..., MediaType.TEXT_HTML_VALUE, ...}, ...)
                  $RT $M(...) { ... }
              - pattern-inside: |
                  @$MAP(..., produces = {..., "=~/^text\/html/", ...}, ...)
                  $RT $M(...) { ... }
          - pattern-either:
              - pattern-inside: |
                  @RestController
                  class $C { ... }
              - pattern-inside: |
                  @ResponseBody
                  class $C { ... }
              - pattern-inside: |
                  @ResponseBody
                  $RT $M(...) { ... }
          - pattern: return $X;
          - focus-metavariable: $X
      # ResponseEntity.ok().contentType(MediaType.TEXT_HTML).body(value)
      - patterns:
          - pattern: $BUILDER.contentType(MediaType.TEXT_HTML).body($X)
          - focus-metavariable: $X
      # The servlet response writer, also through a variable.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletResponse $RESP).getWriter().$W($X, ...)
              - pattern: (ServletResponse $RESP).getWriter().$W($X, ...)
              - patterns:
                  - pattern: $RESP.getWriter().$W($X, ...)
                  - metavariable-regex:
                      metavariable: $RESP
                      regex: ^(response|resp|res|httpResponse|servletResponse|httpServletResponse)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $WT $OUT = $RESP.getWriter();
                          ...
                      - pattern-inside: |
                          $OUT = $RESP.getWriter();
                          ...
                  - pattern: $OUT.$W($X, ...)
          - metavariable-regex:
              metavariable: $W
              regex: ^(write|print|println|printf|format|append)$
          # A response declared JSON is not rendered as HTML.
          - pattern-not-inside: |
              $JRESP.setContentType("=~/json/");
              ...
          - pattern-not-inside: |
              $JRESP.setContentType(MediaType.APPLICATION_JSON_VALUE);
              ...
          - pattern-not-inside: |
              $JRESP.setHeader("Content-Type", "=~/json/");
              ...
          - pattern-not-inside: |
              @$JMAP(..., produces = MediaType.APPLICATION_JSON_VALUE, ...)
              $JRT $JM(...) { ... }
          - pattern-not-inside: |
              @$JMAP(..., produces = "=~/json/", ...)
              $JRT $JM(...) { ... }
          - focus-metavariable: $X

  - id: java-xss-sink
    languages: [java]
    severity: WARNING
    message: >-
      HTML built from a method argument and written to the servlet response
      without encoding. This method writes markup containing its own parameter
      to HttpServletResponse.getWriter(), so whatever its callers pass is
      rendered as HTML. Encode the value with HtmlUtils.htmlEscape or
      Encode.forHtml.
    metadata:
      category: xss
      cwe: CWE-79
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: HTML built from a method argument and written to the response without encoding.
      fendix_remediation: >-
        HTML-encode the argument where it is written (HtmlUtils.htmlEscape,
        Encode.forHtml or StringEscapeUtils.escapeHtml4), or render the page
        with a template engine that escapes by default. Callers in other files
        may pass request input.
    patterns:
      # A non-private method, so another class can call it, and its parameter $Q,
      # a string that carries no request annotation (the -taint rule covers those).
      - pattern-inside: |
          $RT $M(..., $PT $Q, ...) { ... }
      - pattern-not-inside: |
          private $RT $M(...) { ... }
      - pattern-not-inside: |
          $RT $M(..., @$ANN(...) $PT $Q, ...) { ... }
      - metavariable-regex:
          metavariable: $PT
          regex: ^(String|CharSequence|Object)$
      - pattern-either:
          - pattern: (HttpServletResponse $RESP).getWriter().$W($HTML, ...)
          - pattern: (ServletResponse $RESP).getWriter().$W($HTML, ...)
          - patterns:
              - pattern: $RESP.getWriter().$W($HTML, ...)
              - metavariable-regex:
                  metavariable: $RESP
                  regex: ^(response|resp|res|httpResponse|servletResponse|httpServletResponse)$
      - metavariable-regex:
          metavariable: $W
          regex: ^(write|print|println|append)$
      # Markup concatenated with the parameter itself, not with an encoding of it.
      - metavariable-pattern:
          metavariable: $HTML
          patterns:
            - pattern-either:
                - pattern: '"$TAG" + $Q'
                - pattern: '"$TAG" + $Q + $REST'
            - metavariable-regex:
                metavariable: $TAG
                regex: (?s).*<[A-Za-z!/]
      # A module constant of that name is not a caller's argument.
      - pattern-not-inside: |
          class $CLS {
            ...
            static final String $Q = "...";
            ...
          }
      - pattern-not: $RESP.getWriter().$W("...", ...)
      # A response declared JSON is not rendered as HTML.
      - pattern-not-inside: |
          $JRESP.setContentType("=~/json/");
          ...
      - pattern-not-inside: |
          $JRESP.setContentType(MediaType.APPLICATION_JSON_VALUE);
          ...
      - pattern-not-inside: |
          $JRESP.setHeader("Content-Type", "=~/json/");
          ...
      - pattern-not-inside: |
          @$JMAP(..., produces = MediaType.APPLICATION_JSON_VALUE, ...)
          $JRT $JM(...) { ... }
      - pattern-not-inside: |
          @$JMAP(..., produces = "=~/json/", ...)
          $JRT $JM(...) { ... }

  - id: java-ssrf-taint
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Outbound request to a URL taken from request input (SSRF). A request
      value chooses the URL a RestTemplate, WebClient, HttpClient,
      URLConnection or Apache HttpClient request goes to (directly, or through
      a method of this class that sends it), so the caller can reach internal
      services. Check the host against an allowlist before sending.
    metadata:
      category: injection
      cwe: CWE-918
      confidence: MEDIUM
      fendix_severity: HIGH
      fendix_reachability: taint
      fendix_title: Outbound request to a URL taken from request input.
      fendix_remediation: >-
        Parse the URL, then check its scheme and host against an allowlist
        (ALLOWED_HOSTS.contains(URI.create(url).getHost())) before sending, or
        build the URL from a fixed base and pass request input only as a path
        segment or query parameter.
    pattern-sources:
      # A request-bound parameter of a handler: annotated, or a plain String
      # parameter of a request-mapping method, which Spring binds as a request
      # parameter. Not a number, boolean, date or UUID, nor a framework object.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $SRT $SM(..., @$SANN(...) $ST $SP, ...) { ... }
                  - metavariable-regex:
                      metavariable: $SANN
                      regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|RequestPart|MatrixVariable)$
                  - metavariable-regex:
                      metavariable: $ST
