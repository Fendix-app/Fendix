  - id: java-open_redirect-sink
    languages: [java]
    severity: WARNING
    message: >-
      Redirect to a URL taken from a method argument. This method redirects to
      whatever its callers pass, so a caller that passes request input makes it
      an open redirect. Redirect only to a path on this site, or to a URL from
      an allowlist.
    metadata:
      category: injection
      cwe: CWE-601
      confidence: MEDIUM
      fendix_severity: MEDIUM
      fendix_title: Redirect to a URL taken from a method argument.
      fendix_remediation: >-
        Accept the target only when it starts with "/" and not with "//" or
        "/\", here or in every caller, or map it to a URL from an allowlist.
        Callers in other files may pass request input.
    patterns:
      # A non-private method, so another class can call it, and its parameter $Q,
      # a string that carries no request annotation (the -taint rule covers those).
      - pattern-inside: |
          $RT $M(..., $PT $Q, ...) { ... }
      - pattern-not-inside: |
          private $RT $M(...) { ... }
      - pattern-not-inside: |
          $RT $M(..., @$ANN(...) $PT $Q, ...) { ... }
      - metavariable-regex:
          metavariable: $PT
          regex: ^(String|CharSequence|Object)$
      - pattern-either:
          - pattern: (HttpServletResponse $RESP).sendRedirect($Q)
          - patterns:
              - pattern: $RESP.sendRedirect($Q)
              - metavariable-regex:
                  metavariable: $RESP
                  regex: ^(response|resp|res|httpResponse|servletResponse|httpServletResponse)$
          - pattern: '"redirect:" + $Q'
          - pattern: new RedirectView($Q, ...)
      # A module constant of that name is not a caller's argument.
      - pattern-not-inside: |
          class $CLS {
            ...
            static final String $Q = "...";
            ...
          }
      - pattern-not: $RESP.sendRedirect("...")
      # The same local-path check as java-open_redirect-taint's.
      - pattern-not:
          patterns:
            - pattern-inside: |
                if ($GCOND) $GBODY;
                ...
            - pattern-either:
                - pattern-inside: |
                    if (<... $Q.startsWith("//") ...>) { ... }
                    ...
            - pattern-not-inside: |
                if ($GCOND) { ... }
            - pattern-either:
                - pattern: (HttpServletResponse $RESP).sendRedirect($Q)
                - patterns:
                    - pattern: $RESP.sendRedirect($Q)
                    - metavariable-regex:
                        metavariable: $RESP
                        regex: ^(response|resp|res|httpResponse|servletResponse|httpServletResponse)$
                - pattern: '"redirect:" + $Q'
                - pattern: new RedirectView($Q, ...)
            - metavariable-regex:
                metavariable: $GBODY
                regex: (?s)^(?:\{(?:.*[;{}])?\s*)?(?:throw|return)\b[^;{}]*;?\s*(?://[^\n]*\s*)*\}?\s*$
            - metavariable-pattern:
                metavariable: $GCOND
                patterns:
                  - pattern-either:
                      - pattern: '$Q.startsWith("//")'
                  - pattern-not-inside: '!$Q.startsWith("//")'
                  - pattern-not-inside: '$GA && $GB'
            - metavariable-pattern:
                metavariable: $GCOND
                patterns:
                  - pattern-either:
                      - pattern: '!$Q.startsWith("/")'
                  - pattern-not-inside: '$GA && $GB'
      - pattern-not:
          patterns:
            - pattern-inside: |
