name: Composite Action smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-engine:
    name: Action Python setup (${{ matrix.source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [automatic, explicit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
      - uses: ./
        with:
          version: v3.6.0
          code: tests/fixtures/coverage-smoke
          diff: 'false'
          format: json
          output: action-report.json
          upload-sarif: 'false'
          fail-on: CRITICAL
          engine_path: ${{ matrix.source == 'explicit' && format('{0}/python', github.workspace) || '' }}
          extra-args: --fail-on-coverage-gap --require-analyzers python-engine,semgrep,secrets,textscan --checks auth,injection
      - name: Verify actual Python execution
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('action-report.json'))
          states = {entry['name']: entry['state'] for entry in report['metadata']['scanner_status']}
          for name in ['python-engine', 'python-engine/injection', 'semgrep', 'secrets', 'textscan']:
              assert states.get(name) == 'ok', (name, states)
          PY
      # The Action installed exactly v3.6.0, signature-verified, into its own
      # private directory under RUNNER_TEMP: that is the fendix on PATH, and
      # nothing was written to /usr/local/bin.
      - name: Assert the verified binary runs from the Action's private directory
        run: |
          set -eu
          path=$(command -v fendix)
          case "$path" in
            "$RUNNER_TEMP"/fendix-bin.*/fendix) ;;
            *) echo "::error::fendix resolves to $path, not the Action's private directory"; exit 1 ;;
          esac
          out=$(fendix version)
          [ "${out%%$'\n'*}" = "fendix version v3.6.0 (linux/amd64)" ] || { echo "::error::unexpected version: $out"; exit 1; }
          [ ! -e /usr/local/bin/fendix ] || { echo "::error::a fendix binary was written to /usr/local/bin"; exit 1; }
          echo "fendix v3.6.0 runs from $path"
      # setup-python runs with update-environment: false, so the caller's job
      # keeps its own environment: no pythonLocation or *_ROOT_DIR, and the
      # tool-cache interpreter is not on PATH. (The Action's venv and
      # FENDIX_ENGINE are still published for the job, by design.)
      - name: Assert setup-python left this job's environment alone
        run: |
          set -eu
          for name in pythonLocation Python_ROOT_DIR Python2_ROOT_DIR Python3_ROOT_DIR; do
            if [ -n "$(printenv "$name" || true)" ]; then
              echo "::error::setup-python leaked $name into the caller's job"
              exit 1
            fi
          done
          case ":$PATH:" in
            *"/hostedtoolcache/Python/"*) echo "::error::setup-python's interpreter is on the caller's PATH"; exit 1 ;;
          esac
          echo "no setup-python environment in this job; python3 is $(command -v python3)"

  # The lock path a release tree takes. No published release ships
  # python/requirements.lock before v3.6.1, so the Action's automatic path
  # cannot reach it yet; this job runs the same preparation code on this
  # commit's python/ tree as a release tree. The venv must hold exactly the
  # locked versions, and every required analyzer must reach ok with it.
  release-lock:
    name: Release tree lock install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
      - id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          update-environment: false
      - name: Install Fendix v3.6.0
        run: |
          set -euo pipefail
          curl -fsSL https://get.fendix.dev/install.sh | FENDIX_VERSION=v3.6.0 sh
          fendix version
      - name: Prepare this commit's python/ tree as a release tree
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" - <<'PY' 2>&1 | tee prepare.log
          import importlib.util, os, shutil, tempfile
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("prepare", "scripts/prepare-action-engine.py")
          prepare = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(prepare)
          work = Path(tempfile.mkdtemp(prefix="fendix-lock-", dir=os.environ["RUNNER_TEMP"]))
          # "v3.6.4" is the release this tree becomes; it only names the log line.
          prepare.prepare(shutil.which("fendix"), Path("python").resolve(), "v3.6.4", work)
          PY
          grep -qF "Installing the locked dependencies of Fendix v3.6.4 (requirements.lock, --require-hashes)" prepare.log
      - name: Assert the venv holds exactly the locked versions
        run: |
          python3 - <<'PY'
          import re, sys
          from importlib import metadata
          from pathlib import Path
          norm = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          pins = {}
          for line in Path("python/requirements.lock").read_text().splitlines():
              match = re.match(r"([A-Za-z0-9][A-Za-z0-9._-]*)==(\S+)", line)
              if match:
                  pins[norm(match.group(1))] = match.group(2)
          assert sys.prefix != sys.base_prefix, "python3 is not the prepared venv"
          installed = {norm(d.metadata["Name"]): d.version for d in metadata.distributions()}
          wrong = {name: (version, installed.get(name)) for name, version in pins.items() if installed.get(name) != version}
          extra = sorted(set(installed) - set(pins) - {"pip", "setuptools", "wheel"})
          assert not wrong, f"locked versions not installed: {wrong}"
          assert not extra, f"installed outside the lock: {extra}"
          print(f"the venv holds exactly the {len(pins)} locked packages")
          PY
      - name: Scan with the locked engine; every required analyzer must be ok
        run: |
          set -euo pipefail
          fendix scan --code tests/fixtures/coverage-smoke --format json --output lock-report.json \
            --fail-on CRITICAL --fail-on-coverage-gap \
            --require-analyzers python-engine,semgrep,secrets,textscan --checks auth,injection
          python3 - <<'PY'
          import json
          report = json.load(open('lock-report.json'))
          states = {entry['name']: entry['state'] for entry in report['metadata']['scanner_status']}
          required = ['python-engine', 'python-engine/injection', 'semgrep', 'secrets', 'textscan']
          for name in required:
              assert states.get(name) == 'ok', (name, states)
          print("analyzers ok:", ", ".join(required))
          PY

  # Signature verification is required: against the real v3.6.0 release, an
  # install without cosign, or one whose signature cannot verify, is refused
  # with nothing installed, run or published. And hostile inherited FENDIX_*
  # variables cannot move the Action off the official repository and signer.
  installer-fails-closed:
    name: Installer fails closed (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [no-cosign, wrong-signer]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - if: ${{ matrix.case == 'wrong-signer' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"
      - name: The install must be refused, with nothing installed, run or published
        env:
          CASE: ${{ matrix.case }}
        run: |
          # The default shell runs with -e; the install below is expected to
          # fail, so its status is captured instead of ending the step early.
          set -u +e
          published="$RUNNER_TEMP/published-path"
          : >"$published"
          if [ "$CASE" = no-cosign ]; then
            if command -v cosign >/dev/null; then echo "::error::precondition: this runner already has cosign"; exit 1; fi
            # The Action's own install step, with no cosign available.
            VERSION=v3.6.0 ACTION_PATH="$GITHUB_WORKSPACE" GITHUB_PATH="$published" \
              bash scripts/action/install.sh >install.log 2>&1
            rc=$?
            want="FENDIX_REQUIRE_SIGNATURE=1 but cosign is not installed"
          else
            # The bundled installer expecting another signer: the release's
            # real signature cannot verify against it.
            dir=$(mktemp -d "$RUNNER_TEMP/fendix-bin.wrong-signer.XXXXXXXX")
            FENDIX_VERSION=v3.6.0 FENDIX_DIR="$dir" FENDIX_REQUIRE_SIGNATURE=1 FENDIX_SIGN_REPO=not-fendix/not-fendix \
              PATH="$dir:$PATH" sh scripts/install.sh >install.log 2>&1
            rc=$?
            want="cosign signature verification FAILED"
          fi
          cat install.log
          [ "$rc" -ne 0 ] || { echo "::error::$CASE: the install was not refused"; exit 1; }
          grep -qF "$want" install.log || { echo "::error::$CASE: expected '$want'"; exit 1; }
          if grep -q '^fendix version v' install.log; then echo "::error::$CASE: a fendix binary ran"; exit 1; fi
          for leftover in "$RUNNER_TEMP"/fendix-bin.*/fendix; do
            if [ -e "$leftover" ]; then echo "::error::$CASE: $leftover was left installed"; exit 1; fi
          done
          [ ! -s "$published" ] || { echo "::error::$CASE: a directory was published to PATH"; exit 1; }
          echo "$CASE: refused; nothing installed, run or published"
      - name: Inherited FENDIX_* variables cannot redirect or weaken the Action
        if: ${{ matrix.case == 'wrong-signer' }}
        env:
          FENDIX_REPO: not-fendix/not-fendix
          FENDIX_SIGN_REPO: not-fendix/not-fendix
          FENDIX_ALLOW_UNVERIFIED: "1"
          FENDIX_REQUIRE_SIGNATURE: "0"
          FENDIX_VERSION: v0.0.1
          FENDIX_DIR: /tmp/not-the-action
        run: |
          set -eu
          published="$RUNNER_TEMP/published-path-2"
          : >"$published"
          VERSION=v3.6.0 ACTION_PATH="$GITHUB_WORKSPACE" GITHUB_PATH="$published" bash scripts/action/install.sh | tee install.log
          grep -qF "cosign signature verified." install.log
          dir=$(cat "$published")
          case "$dir" in "$RUNNER_TEMP"/fendix-bin.*) ;; *) echo "::error::published $dir"; exit 1 ;; esac
          out=$("$dir/fendix" version)
          [ "${out%%$'\n'*}" = "fendix version v3.6.0 (linux/amd64)" ]
          [ ! -e /tmp/not-the-action ] || { echo "::error::FENDIX_DIR redirected the install"; exit 1; }
          echo "official v3.6.0 verified and installed despite the hostile environment"

  # Local-mode failure handling (scripts/action/{scan,enforce}.sh). Every leg
  # must fail closed with the result it names. This job holds no
  # security-events permission, so nothing is ever uploaded from this
  # repository; the two legs that write no report keep upload-sarif on to
  # prove the upload is skipped rather than attempted.
  failure-handling:
    name: Action failure (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # v3.4.1 predates signed build records, so the Python engine cannot
          # be prepared: a setup step fails before any scan.
          - case: setup-failure
            version: v3.4.1
            fail-on: HIGH
            upload-sarif: 'true'
            expected-exit: ''
          # The engine rejects --fail-on INFO before scanning: exit 2, no report.
          - case: scan-error
            version: v3.6.0
            fail-on: INFO
            upload-sarif: 'true'
            expected-exit: '2'
          - case: block
            version: v3.6.0
            fail-on: HIGH
            upload-sarif: 'false'
            expected-exit: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: fendix
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.version }}
          code: tests/fixtures/action-block
          diff: 'false'
          fail-on: ${{ matrix.fail-on }}
          format: sarif
          output: action report.sarif
          upload-sarif: ${{ matrix.upload-sarif }}
      - name: Assert the Action failed closed with the expected result
        env:
          CASE: ${{ matrix.case }}
          OUTCOME: ${{ steps.fendix.outcome }}
          EXIT_CODE: ${{ steps.fendix.outputs.exit-code }}
          EXPECTED: ${{ matrix.expected-exit }}
        run: |
          set -eu
          [ "$OUTCOME" = failure ] || { echo "::error::$CASE: the Action step should fail, got '$OUTCOME'"; exit 1; }
          [ "$EXIT_CODE" = "$EXPECTED" ] || { echo "::error::$CASE: exit-code should be '$EXPECTED', got '$EXIT_CODE'"; exit 1; }
          if [ "$CASE" = block ]; then
            [ -s "action report.sarif" ] || { echo "::error::block: no report was written"; exit 1; }
          else
            [ ! -e "action report.sarif" ] || { echo "::error::$CASE: a report was left behind"; exit 1; }
          fi
          echo "$CASE: outcome=$OUTCOME exit-code='$EXIT_CODE' as expected"

  # A composite Action's inner steps are invisible to the caller, so what
  # each Action job printed is checked in its finished log.
  action-logs:
    name: Action log checks
    needs: [python-engine, failure-handling]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check each Action job's log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          rules_for() {
            case "$1" in
              "Action Python setup (automatic)") printf '%s\n' \
                "present|Fendix v3.6.0 ships no requirements.lock: installing requirements.txt with the pydantic<2.14 compatibility bound" \
                "absent|Installing the locked dependencies" ;;
              "Action Python setup (explicit)") printf '%s\n' \
                "present|Custom engine_path: installing its requirements.txt with the pydantic<2.14 compatibility bound" \
                "absent|Installing the locked dependencies" ;;
              "Action failure (setup-failure)") printf '%s\n' \
                "present|A setup step failed before the scan" \
                "present|Fendix v3.4.1 predates signed build records" ;;
              "Action failure (scan-error)") printf '%s\n' "present|The scan did not complete" ;;
              "Action failure (block)") printf '%s\n' "present|At least one finding reached BLOCK status" ;;
            esac
            # Every Action job: the signature verified before the binary first
            # ran, the exact version confirmed, and never checksum-only.
            printf '%s\n' \
              "before|cosign signature verified.|fendix version v" \
              "present|Verified Fendix v" \
              "absent|cosign not installed"
            case "$1" in
              "Action failure ("*) printf '%s\n' \
                "present|##[start-action display=Enforce fail-on threshold;" \
                "present|##[end-action id=fendix.upload;outcome=skipped;" \
                "absent|Run github/codeql-action/upload-sarif@" \
                "absent|Unable to upload" \
                "absent|numeric argument required" ;;
            esac
          }
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Action Python setup (") or startswith("Action failure (")) | "\(.id) \(.name)"')
          [ "$(printf '%s\n' "$jobs" | grep -c .)" = 5 ] || { echo "::error::expected 5 Action jobs, found: $jobs"; exit 1; }
          failed=0
          while read -r id name; do
            # Job logs carry ANSI colour codes, which gh refuses to print
            # unless told to; strip them before matching.
            log=""
            for _ in 1 2 3 4 5 6; do
              log=$(gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$id/logs" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g') || true
              [ -n "$log" ] && break
              sleep 10
            done
            # No log means nothing was checked: that is a failure, never a
            # vacuous pass of the "absent" rules.
            if [ -z "$log" ]; then
              echo "::error::$name: could not read the job log"
              failed=1
              continue
            fi
            rules=$(rules_for "$name")
            [ -n "$rules" ] || { echo "::error::$name: no log rules for this job"; failed=1; continue; }
            # A literal substring match without a pipe: under the default
            # pipefail, `printf | grep -q` can fail with SIGPIPE on a match.
            # before|A|B: both appear, and the first A precedes the first B.
            check() {
              case "$1" in
                before)
                  local a=${2%%|*} b=${2#*|}
                  [[ $log == *"$b"* ]] || return 1
                  local head=${log%%"$b"*}
                  [[ $head == *"$a"* ]] ;;
                *) if [[ $log == *"$2"* ]]; then [ "$1" = present ]; else [ "$1" = absent ]; fi ;;
              esac
            }
            while IFS= read -r rule; do
              if check "${rule%%|*}" "${rule#*|}"; then
                echo "✓ $name: ${rule%%|*}: ${rule#*|}"
              elif [ "${rule%%|*}" = before ]; then
                text=${rule#*|}
                echo "::error::$name: expected '${text%%|*}' before the first '${text#*|}' in the log"
                failed=1
              else
                echo "::error::$name: expected '${rule#*|}' to be ${rule%%|*} in the log"
                failed=1
              fi
            done <<<"$rules"
          done <<<"$jobs"
          exit "$failed"
