name: CircleCI template

# Runs the CircleCI config `fendix init --ci circleci` writes, verbatim, in
# CircleCI's cimg/base image as its circleci user: the pinned cosign
# installs, a signed release installs with the signature required, and a
# missing cosign, an unsigned release or a tampered cosign download are
# refused. Runs when anything that shapes that install changes.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/circleci-template.yml"
      - "go/internal/initcmd/templates/circleci-config.yml"
      - "scripts/install.sh"
      - "scripts/test-circleci-install.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Generated CircleCI install (cimg/base)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Build fendix
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.Version=v3.5.1" -o "${RUNNER_TEMP}/fendix" ./cmd/fendix/

      - name: Run the generated CircleCI install in cimg/base
        env:
          FENDIX_BIN: ${{ runner.temp }}/fendix
          # The commit under test, which raw.githubusercontent.com serves
          # (a pull_request run builds the unpushed merge commit instead).
          INSTALLER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/test-circleci-install.sh
