name: Benchmark — enterprise comparison

# Sprint 16 — apples-to-apples Python SAST comparison: fendix vs.
# semgrep vs. bandit on a shared 100-LOC fixture. Triggered on release
# tags and manually; not on push/PR (the comparison is most useful
# against tagged releases, and semgrep+bandit install adds ~30s).
#
# Honesty constraint: this measures Python SAST on a single fixture.
# It does NOT measure DAST (only fendix), cross-language SAST (varies
# wildly by rule pack), or coverage on real-world projects.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install GNU time + competitors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y time
          pip install --quiet bandit semgrep

      - name: Build fendix
        run: make build

      - name: Run benchmark
        run: bash scripts/benchmark-enterprise/run.sh

      - name: Post results as job summary
        if: always()
        run: |
          if [ -f scripts/benchmark-enterprise/RESULTS.md ]; then
            cat scripts/benchmark-enterprise/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RESULTS.md produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload RESULTS.md
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-enterprise-results
          path: scripts/benchmark-enterprise/RESULTS.md
          if-no-files-found: warn
          # Match the heavy-eval + juice-shop workflows; 30 days is
          # plenty for "compare a regression PR vs. last month's run."
          retention-days: 30
