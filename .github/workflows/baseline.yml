name: Baseline

# v0.20 — Establish Baselines. Runs the Go benchmark suite (internal/benchmark)
# and gates on regression-vs-stored-baseline (any metric >10% worse fails).
#
# ADDITIVE by design: this does NOT replace benchmark.yml (manual Juice Shop
# DAST) or heavy-eval.yml (Track-4 absolute-threshold accuracy gate). Those
# keep working untouched; this adds the delta-vs-committed-baseline gate the
# roadmap's exit criterion requires.
#
# v1.1 D2 -- real-world regression tier + synthetic corpus gate:
#   * `fendix benchmark run --target all` now discovers every committed
#     benchmarks/realworld/<name>/ entry (targets.DiscoverRealWorld) and scores
#     it against its labels.yaml. Seed entries (twiscope, sanad) are LOCAL-only
#     and loud-SKIP in CI -- their source path lives in a git-ignored local.yaml,
#     so CI never sees them and never silently reports green. A committed PUBLIC
#     entry (pinned repo+SHA) runs end-to-end and its tp/fp/fn feed the same
#     >10%-regression gate as dvwa/juiceshop (compare vs baseline.json, which now
#     carries a realworld/twiscope reference row).
#   * A synthetic-corpus gate step asserts the Python taint corpus still scores
#     HANDLED F1 == 1.000 on tag builds (the same gate ci.yml runs on push/PR).
#
# Not on push/PR — spinning up DVWA/Juice Shop containers and downloading the
# OWASP corpus is minutes of runner time, most meaningful against release tags.
#
# Depends on: `fendix benchmark` subcommand (TASK B4, Benchmark agent) and the
# committed benchmarks/baselines/baseline.json (TASK B6). Until B4 lands this
# workflow is lint-clean but not yet runnable end-to-end.

on:
  workflow_dispatch:
    inputs:
      save_baseline:
        description: "Save this run as the new committed baseline (true/false)"
        required: false
        default: "false"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  baseline:
    name: Benchmark baseline + regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Build fendix
        run: make build

      - name: Set up Python (synthetic corpus gate)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Synthetic corpus gate (F1 == 1.000)
        working-directory: python
        run: PYTHONPATH=. python -m benchmark.run_benchmark --gate

      - name: Add fendix to PATH
        run: echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Run benchmark suite (incl. discovered realworld tier)
        run: |
          set -euo pipefail
          # --target all discovers benchmarks/realworld/* entries; seed entries
          # loud-SKIP (private local.yaml), committed public entries run + gate.
          fendix benchmark run --target all --output benchmarks/results/ci.json

      - name: Compare against committed baseline (gate)
        run: |
          set -euo pipefail
          # `compare` exits non-zero when any metric regressed >10% vs
          # benchmarks/baselines/baseline.json.
          fendix benchmark compare

      - name: Update baseline (only when explicitly requested)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.save_baseline == 'true' }}
        run: |
          set -euo pipefail
          fendix benchmark baseline --save

      - name: Write job summary
        if: always()
        env:
          # Route github context through env (never interpolate ${{ }} into a
          # run: script) — the exact untrusted-input rule Fendix itself ships.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Fendix benchmark baseline — \`${REF_NAME}\`"
            echo
            if [ -f benchmarks/results/ci.json ]; then
              echo '```json'
              cat benchmarks/results/ci.json
              echo '```'
            else
              echo "_No results produced (see job logs)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-results-${{ github.run_id }}
          path: benchmarks/results/
          retention-days: 30
