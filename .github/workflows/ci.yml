name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The exact patch release.yml builds the shipped binaries with: the
      # govulncheck tests exercise the go/types and x/tools linked into the
      # binary, so a different toolchain would test a different scanner.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Bundle Python engine
        run: cd .. && make embed-engine

      - name: Build
        run: go build ./...

      # `./...` includes the v0.20 subprocess suites under tests/smoke and
      # tests/regression (CLI smoke, output-snapshot + perf + benchmark-
      # baseline regression). They build the fendix binary via tests/harness
      # and need no Docker/network, so they run on every push/PR here.
      - name: Test
        run: go test -race -v ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  python:
    name: Python Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install runtime + test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis

      - name: Test
        run: python -m pytest tests/ -v

      # v1.1 D2: run the synthetic taint corpus as an explicit named gate on
      # every push/PR. `--gate` exits non-zero if HANDLED F1 != 1.000 or any
      # in-scope FP/FN/mis-score appears (also covered by test_benchmark_gate.py
      # in the pytest step above; this makes the regression obvious in the log).
      # Static command, no ${{ }} interpolation — no injection surface.
      - name: Synthetic corpus gate (F1 == 1.000)
        run: PYTHONPATH=. python -m benchmark.run_benchmark --gate

  # actionlint catches workflow drift: malformed YAML, deprecated syntax,
  # shell-script bugs inside `run:` blocks, and — critically — actions
  # that have been un-pinned from a SHA back to a floating tag.
  # Installed via `go install` (uses the same Go toolchain CI already
  # sets up) so we don't pull in another third-party action.
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint -color

      # Enforce the SHA-pin policy directly. actionlint itself doesn't
      # mandate SHA-pin. scripts/check-action-pins.sh fails CI if any
      # workflow, or the root action.yml that users run as the composite
      # Action, references an action by tag, branch or short SHA instead
      # of a full commit SHA. Its self-test plants floating references
      # first, so the guard itself is proven on every run.
      - name: Enforce SHA-pin policy
        run: |
          set -eu
          sh scripts/check-action-pins.sh --self-test
          sh scripts/check-action-pins.sh .github/workflows/*.yml action.yml

  public-claims:
    name: Public namespace and claim regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check current public claims and release namespace
        run: scripts/check-public-claims.sh

      # The formula release.yml publishes to the Homebrew tap: explicit
      # version and scheme, four platform URL/SHA pairs, and Formula/fendix.rb
      # in sync with the generator. homebrew-formula.yml drives real brew.
      - name: Check the generated Homebrew formula
        run: sh scripts/release/test-homebrew-formula.sh

  container-smoke:
    name: Container analyzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release container
        run: docker build --build-arg VERSION=ci -t fendix-ci .

      - name: Verify CLI and offline analyzer coverage
        run: |
          set -eu
          docker run --rm fendix-ci version | grep -F 'fendix version ci' >/dev/null
          docker run --rm fendix-ci --help >/dev/null
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/tests/fixtures/coverage-smoke:/src:ro" fendix-ci -c '
              /usr/local/bin/fendix db update --source /src/osv-export.json --output /tmp/offline-db.json >/dev/null
              /usr/local/bin/fendix scan --code /src --python-engine --offline --offline-db /tmp/offline-db.json \
                --format json --output /tmp/report.json >/dev/null 2>&1 || true
              cat /tmp/report.json' > smoke-container.json
          # Fixture-only diagnostic: name the failed analyzer and its reason.
          python3 -c 'import json; print(json.dumps(json.load(open("smoke-container.json"))["metadata"]["scanner_status"], indent=2))'
          scripts/coverage-smoke-check.sh --deterministic smoke-container.json

      # The bundled rule pack's semgrep --test cases, run with the semgrep the
      # image ships (go/internal/scanner/semgrep/ruletests/README.md). The
      # repository is mounted read-only at the same relative paths.
      # semgrep --test runs one process per CPU, one rule file each, and gives
      # every rule a fixed 5 s per file that no flag changes. On a hosted
      # runner the parallel taint rules starved each other past that limit,
      # and a rule that times out reports no match, so a different rule
      # failed each run. PYTHON_CPU_COUNT=1 (Python 3.13+, the image has 3.14)
      # tests the rule files one at a time.
      - name: Semgrep rule tests
        run: |
          set -eu
          docker run --rm --network none -e PYTHON_CPU_COUNT=1 --entrypoint semgrep \
            -v "$PWD:/src:ro" -w /src fendix-ci \
            --test --config go/internal/scanner/semgrep/rules go/internal/scanner/semgrep/ruletests

  e2e:
    name: End-to-End (CLI flag regression)
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same exact patch as the release build (see the go job).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The locked, hashed set the images and the parity gate install, not
      # the unpinned python/requirements.txt: this job must run the Semgrep
      # that ships.
      - name: Install Python runtime dependencies
        run: pip install --require-hashes -r python/requirements.lock

      # The semgrep-dependent tests skip without Semgrep, which is every
      # runner of the go job: the rule-behaviour tests of the semgrep package
      # and the engine package's mixed-language, JavaScript-fallback and
      # tagged-template tests. This job installs Semgrep and the Python engine's
      # dependencies (python/requirements.lock), so it runs them here with
      # FENDIX_REQUIRE_SEMGREP=1, which makes each fail instead of skip when
      # Semgrep or the Python engine did not run.
      - name: Semgrep-dependent tests (semgrep and engine packages)
        env:
          FENDIX_REQUIRE_SEMGREP: "1"
        run: cd go && go test -count=1 ./internal/scanner/semgrep/ ./internal/engine/

      - name: Run e2e tests
        run: make e2e

  # The framework parity gate (benchmarks/frameworks/SPEC.md): 522 labelled
  # cases across nine frameworks, each scanned in its own tree. `make parity`
  # exits 1 when any case is worse than benchmarks/frameworks/baseline.json,
  # so a detection regression fails the PR. One job per framework: the whole
  # corpus in one job ran past 45 minutes on a hosted runner (about ten on a
  # developer machine), and with --frameworks the gate compares only that
  # framework's baseline cases. The run: command is static; the framework
  # reaches make through PARITY_ARGS in env, from the fixed matrix below.
  framework-parity:
    name: Framework parity gate (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [django, flask, fastapi, express, nestjs, nextjs, spring, nethttp, gin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same exact patch as the release build (see the go job); `make parity`
      # builds bin/fendix-parity from source with it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      # 3.11 is the version python/requirements.lock was compiled with;
      # `make parity-venv` installs it with --require-hashes.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run the framework parity gate
        env:
          PARITY_ARGS: --frameworks ${{ matrix.framework }}
        run: make parity-venv parity

      # Kept on failure too: the per-case results are what shows which cases
      # regressed against the baseline. .parity/ is a hidden directory, which
      # upload-artifact skips unless include-hidden-files is set.
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-parity-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .parity/results.json
          include-hidden-files: true
          retention-days: 30

  # One result for the whole gate, to require in branch protection: it fails
  # unless every framework's job passed.
  framework-parity-gate:
    name: Framework parity gate
    runs-on: ubuntu-latest
    needs: [framework-parity]
    if: always()
    steps:
      - name: Every framework passed
        env:
          RESULT: ${{ needs.framework-parity.result }}
        run: test "$RESULT" = success
