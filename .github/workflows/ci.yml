name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - name: Bundle Python engine
        run: cd .. && make embed-engine

      - name: Build
        run: go build ./...

      # `./...` includes the v0.20 subprocess suites under tests/smoke and
      # tests/regression (CLI smoke, output-snapshot + perf + benchmark-
      # baseline regression). They build the fendix binary via tests/harness
      # and need no Docker/network, so they run on every push/PR here.
      - name: Test
        run: go test -race -v ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  python:
    name: Python Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install runtime + test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis

      - name: Test
        run: python -m pytest tests/ -v

      # v1.1 D2: run the synthetic taint corpus as an explicit named gate on
      # every push/PR. `--gate` exits non-zero if HANDLED F1 != 1.000 or any
      # in-scope FP/FN/mis-score appears (also covered by test_benchmark_gate.py
      # in the pytest step above; this makes the regression obvious in the log).
      # Static command, no ${{ }} interpolation — no injection surface.
      - name: Synthetic corpus gate (F1 == 1.000)
        run: PYTHONPATH=. python -m benchmark.run_benchmark --gate

  # actionlint catches workflow drift: malformed YAML, deprecated syntax,
  # shell-script bugs inside `run:` blocks, and — critically — actions
  # that have been un-pinned from a SHA back to a floating tag.
  # Installed via `go install` (uses the same Go toolchain CI already
  # sets up) so we don't pull in another third-party action.
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint -color

      # Enforce the SHA-pin policy directly. actionlint itself doesn't
      # mandate SHA-pin; this guard is a one-liner that fails CI if any
      # workflow re-introduces a floating @vN tag for a third-party
      # action. GitHub-published actions/* are also pinned for
      # consistency.
      - name: Enforce SHA-pin policy
        run: |
          set -eu
          if grep -EHn 'uses: [a-zA-Z0-9_./-]+@v[0-9]+\b' .github/workflows/*.yml; then
            echo "::error::Found a floating @vN tag pin. Every uses: line must pin to a 40-char SHA followed by '# vN' (see docs/threat-model.md §T6)."
            exit 1
          fi
          echo "✓ all workflow action pins are SHAs"

  public-claims:
    name: Public namespace and claim regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check current public claims and release namespace
        run: scripts/check-public-claims.sh

  container-smoke:
    name: Container analyzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build release container
        run: docker build --build-arg VERSION=ci -t fendix-ci .

      - name: Verify CLI and offline analyzer coverage
        run: |
          set -eu
          docker run --rm fendix-ci version | grep -F 'fendix version ci' >/dev/null
          docker run --rm fendix-ci --help >/dev/null
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/tests/fixtures/coverage-smoke:/src:ro" fendix-ci -c '
              /usr/local/bin/fendix db update --source /src/osv-export.json --output /tmp/offline-db.json >/dev/null
              /usr/local/bin/fendix scan --code /src --python-engine --offline --offline-db /tmp/offline-db.json \
                --format json --output /tmp/report.json >/dev/null 2>&1 || true
              cat /tmp/report.json' > smoke-container.json
          scripts/coverage-smoke-check.sh --deterministic smoke-container.json

  e2e:
    name: End-to-End (CLI flag regression)
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python runtime dependencies
        run: pip install -r python/requirements.txt

      - name: Run e2e tests
        run: make e2e
