name: Heavy-eval

# Track 4 accuracy + perf regression check.
#
# On PRs and push to main: runs the FAST sweep (SAST stages 4a–4d only,
# ~5 min of runner time, no docker). Gates on:
#   - stage 4a F1 >= 0.95 (line-anchored Juliet-style corpus)
#   - bandit-examples expectation_recall >= 0.95
#   - aggregate cat-recall >= 0.95 across stages 4b–4d
# (floors live in scripts/heavy-eval/gate.py — the single source of truth)
#
# Manually-triggered FULL run: includes DAST stage 4e + perf stage 4f.
# Runs on ubuntu-latest; docker images are pulled inline so first-run
# wall-clock is ~30 min. Subsequent runs benefit from runner image cache.
#
# Artifacts:
#   - results.json   (machine-readable, one per stage)
#   - stage-*.json
#   - perf-logs/     (full run only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the FULL sweep including DAST (4e) and perf (4f). Otherwise SAST-only."
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  heavy-eval:
    name: Heavy-eval ${{ github.event.inputs.full == 'true' && '(full)' || '(fast)' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.full == 'true' && 60 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # The harness itself uses only stdlib. The python engine
          # (--python-engine) needs the deps in python/requirements.txt.
          pip install -r python/requirements.txt

      - name: Build fendix binary
        run: make build

      - name: Accuracy gate — synthetic corpus F1 floor
        # Guards the published synthetic F1 (1.000 as of v0.27, after the SSRF
        # multi-hop taint fix). Floor 0.99 trips on the first real regression
        # (e.g. re-introducing the SSRF FN → 0.987 < 0.99) without jitter — the
        # gate whose absence let the headline silently drift in v0.26 (MF-1).
        run: python3 scripts/accuracy/run.py --python-engine --min-f1 0.99 ./bin/fendix

      - name: Run heavy-eval (fast SAST stages 4a–4d)
        if: github.event.inputs.full != 'true'
        run: |
          python3 scripts/heavy-eval/run.py \
            --binary ./bin/fendix \
            --python-engine \
            --fast

      - name: Run heavy-eval (full sweep including DAST + perf)
        if: github.event.inputs.full == 'true'
        run: |
          python3 scripts/heavy-eval/run.py \
            --binary ./bin/fendix \
            --python-engine \
            --all \
            --perf-repeats 3

      - name: Apply quality gates
        run: |
          # Newest sub-directory under bench-results/heavy/. find -printf
          # is GNU-find-only but this runs on ubuntu-latest, so it's fine.
          # Replaces `ls -td` per shellcheck SC2012.
          LATEST="$(find bench-results/heavy/ -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "$LATEST" ]; then
            echo "::error::no run directory found under bench-results/heavy/"
            exit 1
          fi
          python3 scripts/heavy-eval/gate.py "$LATEST"

      - name: Upload heavy-eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heavy-eval-results-${{ github.run_id }}
          path: bench-results/heavy/
          retention-days: 30
