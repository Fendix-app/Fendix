name: Homebrew formula

# Drives real Homebrew against the formula release.yml publishes: an install
# from the legacy formula recovers, v3.5.0 is reported outdated and upgrades
# to v3.5.1, a fresh install works, and the formula passes brew style and
# brew audit --strict. Runs when anything that shapes that formula changes.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/homebrew-formula.yml"
      - ".github/workflows/release.yml"
      - "Formula/**"
      - "scripts/release/render-homebrew-formula.sh"
      - "scripts/release/test-homebrew-formula.sh"
      - "scripts/release/test-homebrew-upgrade.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Formula upgrade path (brew)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      # Two builds of this checkout that differ only in the version they
      # report stand in for consecutive releases; brew fetches them from
      # file:// URLs, so the test needs no published release.
      - name: Build v3.5.0 and v3.5.1 stand-in binaries
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for v in v3.5.0 v3.5.1; do
            go build -trimpath -ldflags="-s -w -X main.Version=${v}" -o "${RUNNER_TEMP}/fendix-${v}" ./cmd/fendix/
          done

      - name: Static formula checks
        run: sh scripts/release/test-homebrew-formula.sh

      - name: Install, outdated, upgrade, fresh install, style and audit
        env:
          OLD_BIN: ${{ runner.temp }}/fendix-v3.5.0
          NEW_BIN: ${{ runner.temp }}/fendix-v3.5.1
        run: |
          set -eu
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # The runner image's Homebrew can trail its bottle API; a stale
          # copy fails pouring python@3.11 (fendix's recommended dependency)
          # before the formula under test is reached.
          brew update
          sh scripts/release/test-homebrew-upgrade.sh
