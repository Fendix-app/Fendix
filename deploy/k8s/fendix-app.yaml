# Fendix GitHub App — Kubernetes reference deployment
#
# Prerequisites:
#   kubectl create secret generic fendix-app-secrets \
#     --from-literal=FENDIX_APP_ID=<id> \
#     --from-literal=FENDIX_WEBHOOK_SECRET=<secret> \
#     --from-file=private-key.pem=./private-key.pem
#
# Deploy:
#   kubectl apply -f deploy/k8s/fendix-app.yaml
#
# This is a starting template, not a production-ready deployment. The official
# image is pinned to its verified manifest digest and supports linux/amd64 and
# linux/arm64. Pull access is anonymous. Adjust replicas, ingress class/host,
# and the TLS secret to your cluster's conventions.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fendix-app
  labels:
    app: fendix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fendix-app
  template:
    metadata:
      labels:
        app: fendix-app
      annotations:
        # Egress posture for the scan workload (F-M5). This pod runs
        # untrusted fork-PR code via `fendix scan`. Two layers restrict
        # what that code can reach:
        #   1. In-process: the Linux Sandbox
        #      (internal/ghapp/sandbox_linux.go) runs each scan in a
        #      fresh network namespace with no connectivity, so the
        #      scanned code itself cannot make any network calls.
        #   2. Pod-level: the NetworkPolicy at the bottom of this file
        #      restricts the *pod's* egress to GitHub (api.github.com /
        #      github.com over 443) + DNS only — defense-in-depth in
        #      case the in-process sandbox is unavailable on the node's
        #      kernel (unprivileged userns disabled). Apply it only on a
        #      cluster whose CNI enforces NetworkPolicy (Calico, Cilium,
        #      etc.); a no-op CNI silently ignores it.
        fendix.dev/scan-egress: "github-and-dns-only"
    spec:
      terminationGracePeriodSeconds: 960
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fendix-app
          # Official application image version: 3.4.1
          image: docker.io/fendixapp/fendix-app@sha256:cdd0fabae6e80abbc3724628e876680f630f2005d378fd47b19265c86fd24d46
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: FENDIX_APP_ID
              valueFrom:
                secretKeyRef:
                  name: fendix-app-secrets
                  key: FENDIX_APP_ID
            - name: FENDIX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: fendix-app-secrets
                  key: FENDIX_WEBHOOK_SECRET
            - name: FENDIX_APP_PRIVATE_KEY_FILE
              value: /var/secrets/fendix/private-key.pem
            # Background scan worker-pool size. Sized for the 2-vCPU
            # limit below (one Semgrep scan ≈ 1 vCPU). Raise this and the
            # CPU/memory limits together; the webhook always acks
            # immediately regardless of this value.
            - name: FENDIX_MAX_CONCURRENT_SCANS
              value: "2"
          volumeMounts:
            - name: private-key
              mountPath: /var/secrets/fendix
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          # Sized for FENDIX_MAX_CONCURRENT_SCANS=2: a Semgrep scan is
          # ~1 vCPU, so the 2-vCPU limit lets both pool workers run flat
          # out. Raise the limit and the env var in lockstep to run more
          # concurrent scans; the memory limit must grow too (each scan
          # holds a clone in /tmp plus Semgrep's working set).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: private-key
          secret:
            secretName: fendix-app-secrets
            items:
              - key: private-key.pem
                path: private-key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fendix-app
spec:
  selector:
    app: fendix-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fendix-app
  annotations:
    # Adjust for your ingress controller (nginx, traefik, alb, etc.)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.fendix.dev
      secretName: fendix-app-tls
  rules:
    - host: app.fendix.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fendix-app
                port:
                  number: 80
---
# Egress restriction for the scan workload (F-M5). This pod clones and
# scans untrusted fork-PR code; this policy bounds where the *pod* can
# send traffic to: GitHub (api.github.com + github.com, 443) for the
# webhook API + clone, and DNS to resolve them. The in-process Linux
# Sandbox already denies the scanned code any network, so this is
# defense-in-depth for nodes where the in-process sandbox can't be
# applied (unprivileged user namespaces disabled).
#
# NOTE: NetworkPolicy is enforced only by CNIs that support it (Calico,
# Cilium, Weave, …). On a cluster without an enforcing CNI this object
# is silently ignored — verify your CNI before relying on it. Ingress is
# left to the existing Ingress/Service path; only egress is constrained
# here. Adjust the DNS namespace selector to match your cluster
# (kube-system is the common default for CoreDNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fendix-app-egress
  labels:
    app: fendix-app
spec:
  podSelector:
    matchLabels:
      app: fendix-app
  policyTypes:
    - Egress
  egress:
    # DNS resolution (UDP+TCP 53) to the cluster DNS service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to GitHub. NetworkPolicy can't match DNS names, so this
    # allows 443 egress broadly; pair it with an egress proxy or a
    # CNI-specific FQDN policy (Cilium CiliumNetworkPolicy
    # toFQDNs: api.github.com, github.com) to pin the destination. The
    # in-process sandbox is what actually denies the scanned code any
    # egress — this layer narrows the App's own reachable ports.
    - ports:
        - protocol: TCP
          port: 443
