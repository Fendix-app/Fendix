# Fendix GitHub Action (composite).
#
# Runs a Fendix security scan in CI and gates the job on the release policy.
# On pull_request events (diff: auto) the native secrets, text and Semgrep
# scanners read only the files the PR changes, whole files, so existing issues
# in those files are reported; dependency checks run when a manifest changed;
# the Python engine and DAST always cover the full target. Use a baseline to
# report only new findings. SARIF goes to GitHub code scanning: a private or
# internal repository needs GitHub Code Security and `actions: read` for that,
# otherwise set upload-sarif: 'false'.
#
# The Fendix binary comes from the installer bundled with this revision, into
# a private temporary directory, and runs only after its release's cosign
# signature verifies. There is no checksum-only fallback, so the runner needs
# outbound access to GitHub releases and to Sigstore (proxies through the
# standard HTTPS_PROXY variables; a ~/.curlrc is ignored).
#
# Usage: `@v1` follows compatible stable releases of the v1 Action; set
# `version` to the Fendix release to install.
#
#   - uses: actions/checkout@<full-commit-sha> # v6
#     with: { fetch-depth: 0 }          # diff mode compares against the base ref
#   - uses: Fendix-app/Fendix@v1
#     with:
#       version: v3.6.2
#       code: .
#
# High-assurance or reproducible pipelines: pin the full commit of the
# validated release instead, which is immutable.
#
#   - uses: Fendix-app/Fendix@b9e1fad6e1d9531ac899ab44b01f413424f30a7a # v3.6.2
#     with:
#       version: v3.6.2
#
# Usage (full: add a DAST target and fail the build on HIGH):
#
#   - uses: Fendix-app/Fendix@v1
#     with:
#       version: v3.6.2
#       url: ${{ secrets.STAGING_API_URL }}
#       code: .
#       spec: openapi.yaml
#       fail-on: HIGH
#
# Never reference @main; it changes without review.
name: "Fendix Security Scan"
description: "Evidence-backed application security decisions for CI/CD."
author: "Fendix"
branding:
  icon: "shield"
  color: "purple"

inputs:
  code:
    description: "Path to source code to scan (white-box SAST/secrets/SCA). Empty to skip."
    required: false
    default: "."
  url:
    description: "Target URL for black-box DAST scanning. Empty to skip DAST."
    required: false
    default: ""
  spec:
    description: "Path or HTTP(S) URL for an OpenAPI/Swagger spec used to seed endpoint discovery."
    required: false
    default: ""
  fail-on:
    description: "Minimum severity considered by release policy (CRITICAL, HIGH, MEDIUM, LOW). Confidence and evidence rules still govern BLOCK; empty disables blocking."
    required: false
    default: "HIGH"
  diff:
    description: "Diff mode. 'auto' (default) turns it on for pull_request events only: the native secrets, text and Semgrep scanners read the files changed vs the PR base ref, dependency checks run when a manifest changed, and the Python engine and DAST still scan the full target. 'true' turns it on for every event; without a PR base ref it compares against HEAD, which on a fresh checkout leaves those scanners no changed files. 'false' always scans in full. If the diff cannot be computed, or a changed file cannot be placed under code (as when code is a subdirectory of the repository), the scan falls back to a full scan."
    required: false
    default: "auto"
  format:
    description: "Report format: sarif (default, for the Security tab), json, html, pdf."
    required: false
    default: "sarif"
  output:
    description: "Path to write the report to."
    required: false
    default: "fendix-results.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning, when format=sarif and the scan wrote a report. Needs security-events: write; a private or internal repository also needs actions: read and GitHub Code Security."
    required: false
    default: "true"
  version:
    description: "Fendix release to install: an exact tag such as v3.6.2, or 'latest', resolved once to an exact tag. The binary must verify against its release's cosign signature, so only signed releases install; automatic Python preparation (engine_path empty) needs a signed build record, published from v3.5.0."
    required: false
    default: "latest"
  extra-args:
    description: "Additional raw arguments appended to the fendix scan command."
    required: false
    default: ""
  # --- Managed mode (ADR-010 preview; new in v3.5.0, absent from v3.4.1) ---
  # Managed mode submits sanitized evidence to the Fendix backend, which
  # DECIDES. The runner never computes, infers or falls back to a local
  # decision, so none of the local gating inputs above apply to it.
  mode:
    description: "'local' (default) runs entirely on the runner and gates on --fail-on. Preview (ADR-010): 'managed' submits evidence to the Fendix backend and gates on its Decision Record; it needs engine v3.5.0 or later."
    required: false
    default: "local"
  token:
    description: "Managed mode only. The repository-scoped Fendix CI credential (fxci_…). Pass it from a secret; it is masked and is never written to argv, logs, artifacts or summaries."
    required: false
    default: ""
  tenant-id:
    description: "Managed mode only. Organization (tenant) UUID from the Fendix binding."
    required: false
    default: ""
  asset-id:
    description: "Managed mode only. Asset UUID from the Fendix binding."
    required: false
    default: ""
  environment:
    description: "Managed mode only. sandbox, staging or production — must match the credential's environment."
    required: false
    default: ""
  api-base:
    description: "Managed mode only. Backend API origin."
    required: false
    default: "https://api.fendix.dev"
  engine_path:
    description: "Optional caller-managed Python engine directory. Empty (default): the installed release's Python source is fetched at the commit its signed build record names, and its dependencies are installed from that release's hash-locked python/requirements.lock (releases up to v3.6.0 have none and use requirements.txt with a pydantic<2.14 bound). Set: the directory's requirements.txt is installed with the same pydantic<2.14 bound. Both install into an isolated Python 3.11 venv; the Fendix binary itself is signature-verified either way."
    required: false
    default: ""

outputs:
  report:
    description: "Path to the generated report file."
    value: ${{ steps.scan.outputs.report }}
  decision:
    description: "Managed mode only. The backend's authoritative decision (PASS, WARN, BLOCK or INCOMPLETE)."
    value: ${{ steps.managed.outputs.decision }}
  decision-record:
    description: "Managed mode only. The immutable Decision Record id the decision came from."
    value: ${{ steps.managed.outputs.decision-record }}
  exit-code:
    description: "The fendix exit code (0 no blocking decision, 1 BLOCK-status finding, 2 error)."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    # Managed mode is a different trust model, so its inputs are checked
    # before anything runs. Everything the local mode allows and managed mode
    # does not is refused here rather than ignored: silently dropping an input
    # someone set is how a scan ends up narrower than its author believed.
    - name: Validate managed inputs
      if: ${{ inputs.mode == 'managed' }}
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        URL: ${{ inputs.url }}
        SPEC: ${{ inputs.spec }}
        TENANT: ${{ inputs.tenant-id }}
        ASSET: ${{ inputs.asset-id }}
        ENVIRONMENT: ${{ inputs.environment }}
        API_BASE: ${{ inputs.api-base }}
      run: |
        set -euo pipefail
        # Mask first, before any later step can echo it. GitHub masks secrets
        # it knows about; this covers a token that reached the input by any
        # other route.
        if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
        fail() { echo "::error::$1"; exit 1; }
        [ -n "$TOKEN" ] || fail "managed mode requires 'token' (a repository-scoped fxci_ credential)"
        [ -n "$TENANT" ] || fail "managed mode requires 'tenant-id'"
        [ -n "$ASSET" ] || fail "managed mode requires 'asset-id'"
        [ -n "$ENVIRONMENT" ] || fail "managed mode requires 'environment'"
        case "$API_BASE" in
          https://*) ;;
          http://127.0.0.1*|http://localhost*) ;;
          *) fail "managed mode requires an https 'api-base'" ;;
        esac
        # The backend accepts only allowlisted engine builds, so the version
        # must be an exact release. 'latest' would submit whatever happens to
        # be newest, which no allowlist can describe in advance.
        case "$VERSION" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) fail "managed mode requires an exact engine version such as v3.5.0, not '$VERSION'" ;;
        esac
        # Raw argument passthrough cannot be allowlisted, and the contract
        # replaces it with typed inputs.
        [ -z "$EXTRA_ARGS" ] || fail "managed mode does not accept 'extra-args'; use typed inputs"
        # The pilot is full-head SAST/SCA. A DAST target would produce
        # evidence the pilot's binding policy does not require and cannot
        # attribute.
        [ -z "$URL" ] || fail "managed mode does not scan a URL in the pilot"
        [ -z "$SPEC" ] || fail "managed mode does not take a spec in the pilot"

    # cosign first, for every caller: the Fendix binary is always verified by
    # its release signature before it first runs (engine_path changes only the
    # Python tree), and the Python engine's signed build record uses it too.
    - name: Install source verification tool
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: "v2.4.1"

    # scripts/action/install.sh: one exact release from Fendix-app/Fendix,
    # installed by the installer bundled with this Action revision with the
    # signature REQUIRED, into a private directory that is published to PATH
    # only after the exact version is confirmed. No inherited FENDIX_*
    # variable reaches the installer.
    - name: Install Fendix
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/action/install.sh"

    # Python 3.11 for the engine's preparation only: update-environment: false
    # keeps setup-python from putting it on PATH or setting pythonLocation
    # and friends for the rest of the caller's job.
    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
        update-environment: false

    # Bind the Python tree to the installed binary's signed build record,
    # install its dependencies in an isolated venv (the release's hash lock
    # when it ships one), then pin it for all scans. Run with setup-python's
    # own interpreter, never whichever python3 is first on the caller's PATH.
    - name: Prepare Fendix Python engine
      shell: bash
      env:
        ENGINE_PATH: ${{ inputs.engine_path }}
        ACTION_PATH: ${{ github.action_path }}
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: '"$PYTHON" "$ACTION_PATH/scripts/prepare-action-engine.py"'

    - name: Run Fendix scan
      id: scan
      if: ${{ inputs.mode != 'managed' }}
      shell: bash
      env:
        # Route every input through env (never interpolate ${{ }} into a run:
        # script) — the exact untrusted-input rule Fendix ships.
        CODE: ${{ inputs.code }}
        URL: ${{ inputs.url }}
        SPEC: ${{ inputs.spec }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.format }}
        OUTPUT: ${{ inputs.output }}
        DIFF: ${{ inputs.diff }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ACTION_PATH: ${{ github.action_path }}
      # scripts/action/scan.sh records report-present, report and exit-code.
      run: bash "$ACTION_PATH/scripts/action/scan.sh"

    # Managed scan: full-head SAST/SCA, no diff scoping, no local gate. The
    # engine writes the exact document the backend will receive; the runner
    # does not assemble or edit evidence.
    - name: Run Fendix managed scan
      if: ${{ inputs.mode == 'managed' }}
      shell: bash
      env:
        CODE: ${{ inputs.code }}
        TENANT: ${{ inputs.tenant-id }}
        ASSET: ${{ inputs.asset-id }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        workdir="${RUNNER_TEMP:-/tmp}/fendix-managed"
        mkdir -p "$workdir"
        chmod 700 "$workdir"
        fendix managed context \
          --tenant-id "$TENANT" --asset-id "$ASSET" --environment "$ENVIRONMENT" \
          --out "$workdir/context.json"
        # No --diff and no --fail-on: the pilot submits full-head evidence,
        # and the threshold is the binding's, held by the backend. The output
        # is kept as well as shown, so a contract-ceiling refusal can be named.
        set +e
        fendix scan --code "${CODE:-.}" \
          --format json --output "$workdir/report.json" \
          --managed-evidence "$workdir/evidence.json" \
          --managed-context "$workdir/context.json" 2>&1 | tee "$workdir/scan.log"
        code=${PIPESTATUS[0]}
        set -e
        # This step passes no --fail-on, so the local scan never decides
        # anything: its summary is labelled a diagnostic, and the decision
        # is the backend's (next step). Exit 1 can still come from a
        # repository policy file that sets fail_on; managed mode ignores it
        # by design. Anything else is a real scan failure, and a managed
        # run that produced no evidence must not continue as if it had.
        if [ "$code" != "0" ] && [ "$code" != "1" ]; then
          # Evidence over a contract ceiling is never truncated or split: the
          # engine names the ceiling on one line, and that line is the error.
          ceiling="$(grep -m1 '^fendix: managed evidence exceeds a contract ceiling: ' "$workdir/scan.log" || true)"
          if [ -n "$ceiling" ]; then
            echo "::error::${ceiling//%/%25}"
            printf '## Fendix managed evidence refused\n\n%s\n' "$ceiling" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "::error::the managed scan failed (exit $code); no evidence was produced"
          fi
          exit "$code"
        fi
        [ -s "$workdir/evidence.json" ] || { echo "::error::no managed evidence was written"; exit 2; }
        echo "FENDIX_MANAGED_DIR=$workdir" >> "$GITHUB_ENV"

    # Submit and wait for the BACKEND's decision. The credential reaches one
    # process through the environment and never appears in argv.
    - name: Submit evidence and await the backend decision
      id: managed
      if: ${{ inputs.mode == 'managed' }}
      shell: bash
      env:
        FENDIX_CI_TOKEN: ${{ inputs.token }}
        API_BASE: ${{ inputs.api-base }}
      run: |
        set -euo pipefail
        workdir="$FENDIX_MANAGED_DIR"
        set +e
        fendix managed submit \
          --evidence "$workdir/evidence.json" \
          --api-base "$API_BASE" \
          --decision-output "$workdir/decision.json" 2>&1 | tee "$workdir/submit.log"
        code=${PIPESTATUS[0]}
        set -e
        # `fendix managed submit` writes the decision and its record id to
        # $GITHUB_OUTPUT itself, so no JSON is parsed in shell here.
        if [ "$code" != "0" ]; then
          # Evidence over a contract ceiling is refused before any request;
          # the command names the ceiling on one line, and that is the error.
          ceiling="$(grep -m1 '^fendix: managed evidence exceeds a contract ceiling: ' "$workdir/submit.log" || true)"
          if [ -n "$ceiling" ]; then
            echo "::error::${ceiling//%/%25}"
            printf '## Fendix managed evidence refused\n\n%s\n' "$ceiling" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          # 1 is a decision that fails the gate; anything else is NO decision.
          # Neither may fall back to the local scan's own result.
          exit "$code"
        fi

    # Only a report this scan actually wrote is uploaded. After a setup or scan
    # failure there is nothing to upload, and trying would bury the real error
    # under an unrelated one.
    - name: Upload SARIF to code scanning
      id: upload
      if: ${{ inputs.mode != 'managed' && inputs.upload-sarif == 'true' && inputs.format == 'sarif' && steps.scan.outputs.report-present == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ inputs.output }}

    # Local gate only. In managed mode the gate is the backend's decision,
    # enforced by the submit step's exit code above.
    - name: Enforce fail-on threshold
      if: ${{ inputs.mode != 'managed' && always() }}
      shell: bash
      env:
        # Route inputs through env (never interpolate ${{ }} into a run:
        # script) — the untrusted-input rule Fendix itself ships.
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
        REPORT: ${{ inputs.output }}
        REPORT_PRESENT: ${{ steps.scan.outputs.report-present }}
        SARIF_UPLOAD: ${{ steps.upload.outcome }}
        ACTION_PATH: ${{ github.action_path }}
      # scripts/action/enforce.sh: empty -> setup failure (2), 0 pass, 1 BLOCK,
      # 2 scan error, anything else fails closed (2).
      run: bash "$ACTION_PATH/scripts/action/enforce.sh"
